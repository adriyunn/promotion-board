.</td></tr>\n  </table>\n</div>\n"},{"key":"plan","num":25,"title":"8-Day Plan & Board-Day Checklist","category":"Library","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">25</div><div class=\"txt\"><h2>8-Day Plan &amp; Board-Day Checklist</h2><div class=\"why\">Every day: the creed once out loud, one mock-board session, and the Situational Questions section.</div></div></div>\n\n  <table class=\"plan\">\n    <tr><th>Day</th><th>Focus</th><th>Also do</th></tr>\n    <tr><td>Thu 12 Nov</td><td>Sec 0 corrections · Sec 1 Creeds · Sec 5 Army basics</td><td>Ask the 1SG/PSG for the MOI date and chain-of-command names</td></tr>\n    <tr><td>Fri 13 Nov</td><td>Sec 3 Chain of command · Sec 22 2-12 / 4ID · Sec 23 Wars &amp; history</td><td>Fill in every blank in Sec 3</td></tr>\n    <tr><td>Sat 14 Nov</td><td>Sec 4 Personal · Sec 6 Leadership &amp; counseling · Sec 12 Benefits</td><td>Write your \"about yourself\" answer and say it out loud 5 times</td></tr>\n    <tr><td>Sun 15 Nov</td><td>Sec 7 Regs &amp; UCMJ · Sec 8 SHARP/EO/Suicide</td><td>Get the AGSU fitted and pressed</td></tr>\n    <tr><td>Mon 16 Nov</td><td>Sec 14 Tactics · Sec 15 Acronyms · Sec 13 Training &amp; CBRN</td><td>Have an NCO inspect your AGSU with a ruler</td></tr>\n    <tr><td>Tue 17 Nov</td><td>Sec 16 Your weapons · Sec 17 Weapon systems · Sec 18 Comms &amp; maintenance</td><td>Check your ERB/ORB matches your rack</td></tr>\n    <tr><td>Wed 18 Nov</td><td>Sec 10 ABCP · Sec 11 H2F · Sec 19 TCCC · Sec 9 Wear · Sec 20 Land nav · Sec 21 Drill</td><td>Full mock board in AGSU, with knocking and reporting</td></tr>\n    <tr><td>Thu 19 Nov</td><td>Review all \"Must know\" tags · Sec 24 Situational questions</td><td>Haircut. Light review only. Sleep 8 hours.</td></tr>\n    <tr><td><b>Fri 20 Nov</b></td><td><b>BOARD</b></td><td>Creed once in the morning. Eat. Arrive early.</td></tr>\n  </table>\n\n  <div class=\"grid2\">\n    <div class=\"card\"><h4>Before you leave the house</h4>\n      <ul class=\"check\">\n        <li>AGSU on, inspected, lint-rolled</li>\n        <li>Shoes shined. Spare shirt in the car.</li>\n        <li>Fresh haircut. Shaved that morning.</li>\n        <li>CAC / ID</li>\n        <li>Lint roller, small sewing kit</li>\n        <li>Water. Something light to eat.</li>\n      </ul></div>\n    <div class=\"card\"><h4>Outside the board room</h4>\n      <ul class=\"check\">\n        <li>Arrive 30+ minutes early</li>\n        <li>Final mirror check: brass, ribbons, gig line</li>\n        <li>Say the creed once in your head</li>\n        <li>Deep breaths. Slow down.</li>\n        <li>Phone off and out of your pockets</li>\n        <li>Knock once, firmly</li>\n      </ul></div>\n  </div>\n\n  <div class=\"callout c-local\"><div class=\"ttl\">Open items before 20 November</div>\n    <ul class=\"check\" style=\"margin:0\">\n      <li>Get the MOI: uniform details, reporting procedure, creed, topics</li>\n      <li>Confirm every name in Section 3</li>\n      <li>IVY 7, the CSM's and commander's philosophy, unit honors, company nickname</li>\n      <li>Your M4 zero, your ACOG model, your issued IFAK contents</li>\n      <li>Your unit SARC/VA, EOL, and chaplain names</li>\n      <li>Compare the creed text word for word against army.mil</li>\n    </ul></div>\n</div>\n"},{"key":"index","num":26,"title":"Publication Types, Index & Sources","category":"Library","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">26</div><div class=\"txt\"><h2>Publication Types, Index &amp; Sources</h2><div class=\"why\">Board-relevant publications only. Dates are the APD indexed dates from your original guide.</div></div></div>\n\n  <h3>Publication types <span class=\"tag t-new\">New</span></h3>\n  <div class=\"grid2\">\n  <table>\n    <tr><th style=\"width:20%\">Type</th><th>Full name &amp; purpose</th></tr>\n    <tr><td><b>ADP</b></td><td>Army Doctrine Publication: fundamental principles (the what and why)</td></tr>\n    <tr><td><b>FM</b></td><td>Field Manual: tactics, more detail than an ADP</td></tr>\n    <tr><td><b>ATP</b></td><td>Army Techniques Publication: techniques (the how)</td></tr>\n    <tr><td><b>TC</b></td><td>Training Circular: training guidance for tasks, weapons, drills</td></tr>\n    <tr><td><b>TM</b></td><td>Technical Manual: operating and maintaining equipment (-10 = operator)</td></tr>\n    <tr><td><b>STP / GTA</b></td><td>Soldier Training Publication / Graphic Training Aid</td></tr>\n    <tr><td><b>JP</b></td><td>Joint Publication: doctrine for all services</td></tr>\n  </table>\n  <table>\n    <tr><th style=\"width:20%\">Type</th><th>Full name &amp; purpose</th></tr>\n    <tr><td><b>AR</b></td><td>Army Regulation: mandatory policy</td></tr>\n    <tr><td><b>DA Pam</b></td><td>Department of the Army Pamphlet: procedures for carrying out an AR</td></tr>\n    <tr><td><b>AD</b></td><td>Army Directive: new Secretary of the Army policy, effective right away</td></tr>\n    <tr><td><b>DA Form</b></td><td>Department of the Army Form</td></tr>\n    <tr><td><b>ALARACT</b></td><td>All Army Activities message</td></tr>\n    <tr><td><b>APD</b></td><td>Army Publishing Directorate (armypubs.army.mil)</td></tr>\n    <tr><td><b>C1, C2</b></td><td>Change 1, Change 2 to a publication</td></tr>\n  </table>\n  </div>\n  <div class=\"callout c-tip\"><div class=\"ttl\">Doctrine order</div><b>ADP</b> (principles) → <b>FM</b> (tactics) → <b>ATP</b> (techniques). Each level adds detail. <b>ADRP</b> and <b>ATTP</b> are retired types, so don't cite them.</div>\n\n  <div class=\"grid2\">\n  <table>\n    <tr><th>Pub</th><th>Title</th><th>Date</th></tr>\n    <tr><td>ADP 1</td><td>The Army</td><td>31 Jul 2019</td></tr>\n    <tr><td>ADP 6-22</td><td>Army Leadership and the Profession (C2)</td><td>31 Jul 2019</td></tr>\n    <tr><td>ADP 7-0</td><td>Training</td><td>29 Apr 2024</td></tr>\n    <tr><td>ATP 3-21.8</td><td>Infantry Rifle Platoon and Squad (C1)</td><td>11 Jan 2024</td></tr>\n    <tr><td>ATP 3-21.9</td><td>Stryker Infantry Rifle Platoon and Squad</td><td>24 Jun 2025</td></tr>\n    <tr><td>ATP 4-02.11</td><td>Casualty Response, TCCC, and First Aid</td><td>23 Mar 2026</td></tr>\n    <tr><td>ATP 6-22.1</td><td>Counseling–Coaching–Mentoring</td><td>13 Feb 2024</td></tr>\n    <tr><td>ATP 7-22.01</td><td>Holistic Health and Fitness Testing</td><td>12 Mar 2026</td></tr>\n    <tr><td>ATP 7-22.02</td><td>H2F Drills and Exercises (C1)</td><td>1 Oct 2020</td></tr>\n    <tr><td>FM 7-22</td><td>Holistic Health and Fitness (C2)</td><td>1 Oct 2020</td></tr>\n    <tr><td>FM 6-22</td><td>Developing Leaders (C2)</td><td>1 Nov 2022</td></tr>\n    <tr><td>TC 3-21.5</td><td>Drill and Ceremonies</td><td>3 May 2021</td></tr>\n    <tr><td>TC 3-22.9</td><td>Rifle and Carbine (C1–C3)</td><td>13 May 2016</td></tr>\n    <tr><td>TC 3-22.249</td><td>Light Machine Gun M249</td><td>16 May 2017</td></tr>\n    <tr><td>TC 3-22.240</td><td>Medium Machine Gun</td><td>28 Apr 2017</td></tr>\n    <tr><td>TC 3-25.26</td><td>Map Reading and Land Navigation</td><td>15 Nov 2013</td></tr>\n    <tr><td>TC 7-21.13</td><td>The Soldier's Guide</td><td>17 Sep 2025</td></tr>\n    <tr><td>TC 7-22.7</td><td>The NCO Guide</td><td>19 Aug 2025</td></tr>\n    <tr><td>DA Pam 750-1</td><td>Army Materiel Maintenance Procedures</td><td>29 Apr 2026</td></tr>\n  </table>\n  <table>\n    <tr><th>Pub / Form</th><th>Title</th><th>Date</th></tr>\n    <tr><td>AR 600-20</td><td>Army Command Policy</td><td>15 Apr 2026</td></tr>\n    <tr><td>AR 600-52</td><td>SHARP Program</td><td>11 Feb 2025</td></tr>\n    <tr><td>AR 600-92</td><td>Army Suicide Prevention Program</td><td>4 Oct 2024</td></tr>\n    <tr><td>AR 600-8-19</td><td>Enlisted Promotions and Demotions</td><td>6 Mar 2026</td></tr>\n    <tr><td>AR 600-8-22</td><td>Military Awards</td><td>11 May 2026</td></tr>\n    <tr><td>AR 600-9</td><td>Army Body Composition Program</td><td>16 Jul 2019</td></tr>\n    <tr><td>AR 623-3</td><td>Evaluation Reporting System</td><td>14 Feb 2025</td></tr>\n    <tr><td>AR 670-1 / DA Pam 670-1</td><td>Wear and Appearance</td><td>26 Jan 2021</td></tr>\n    <tr><td>AR 350-1</td><td>Army Training and Leader Development</td><td>1 Jun 2025</td></tr>\n    <tr><td>AR 600-85</td><td>Army Substance Abuse Program</td><td>4 Oct 2024</td></tr>\n    <tr><td>AR 600-25</td><td>Salutes, Honors, and Courtesy</td><td>1 May 2026</td></tr>\n    <tr><td>AR 930-4</td><td>Army Emergency Relief</td><td>15 Apr 2026</td></tr>\n    <tr><td>AR 27-10</td><td>Military Justice</td><td>8 Jan 2025</td></tr>\n    <tr><td>DA Form 4856</td><td>Developmental Counseling Form</td><td>1 Mar 2023</td></tr>\n    <tr><td>DA Form 2166-9-1</td><td>NCOER (SGT)</td><td>1 Nov 2015</td></tr>\n    <tr><td>DA Form 5500</td><td>Body Composition Worksheet</td><td>1 Jul 2026</td></tr>\n    <tr><td>DA Form 7279 / 7746</td><td>EO &amp; Harassment / SH Complaint</td><td>Jul 2020 / Jan 2026</td></tr>\n    <tr><td>AD 2025-13, 2025-18, 2026-09</td><td>Grooming / appearance / religious accommodation</td><td>2025–2026</td></tr>\n    <tr><td>AD 2026-07 / 2026-13</td><td>Physical fitness standards / ABCP</td><td>17 Apr / 1 Jul 2026</td></tr>\n  </table>\n  </div>\n\n  <h3>Sources</h3>\n  <p class=\"src\">\n    <b>Original guide sources:</b> armypubs.army.mil · army.mil/values · army.mil/tellyourformation · army.mil/aft · CFT directive api.army.mil/e2/c/downloads/2026/04/29/858da01e/cft-army-directive.pdf · ATP 3-21.8 (home.army.mil/benning) · TC 3-22.9 / 3-22.249 / 3-22.240 (rdl.train.army.mil) · ATP 7-22.02 (benning.army.mil) · AR 600-52 (sharplearningportal.army.mil) · 4ID Green Book, Yellow Book, standards book (home.army.mil/carson) · TRADOC Pam 672-9.<br>\n    <b>Added in this revision:</b> 2-12 IN, 2SBCT 4ID (army.mil/article/289569; dvidshub.net) · Dockery Medal of Honor (army.mil/article/293359; army.mil/medalofhonor/dockery; 4thinfantry.org) · 2-12 lineage (globalsecurity.org/military/agency/army/2-12in.htm; verify at history.army.mil) · 4ID leadership (army.mil/article/286497; home.army.mil/carson 4ID leadership page) · HQDA principal officials roster (api.army.mil, Aug 2026) · CSA change (defensescoop.com, 2 Apr 2026) · SGT eligibility (HQDA cutoff-score memo, Feb 2026) · AFT combat standard (army.mil/aft) · AGSU ribbons/badges (army.mil/uniforms FAQ; DA Pam 670-1) · ICVV (Stryker variants references) · 2SBCT commander page (home.army.mil/carson/.../2sbct/brigade-commander).<br>\n    <b>Standard doctrine added from general knowledge, tagged VERIFY:</b> creed texts, counseling process, UCMJ articles, weapon data, 9-line, map colors, drill step lengths, NCO history.\n  </p>\n</div>\n"}],"start":{"key":"start","num":0,"title":"Start Here","html":"<div>\n  <div class=\"sec-head\"><div class=\"num\">0</div><div class=\"txt\"><h2>Start Here</h2><div class=\"why\">Board format, corrections to your old notes, and the order to study in.</div></div></div>\n\n  <div class=\"grid3\">\n    <div class=\"card dark\"><h4>The board</h4>Battalion board, 20 Nov 2026.<br>Uniform: <b>AGSU</b>.<br>Sequence: <b>Creed first</b>, then questions.</div>\n    <div class=\"card dark\"><h4>The panel</h4><b>President:</b> Battalion CSM.<br><b>Members:</b> 1SGs of A Co, B Co, C Co and HHC.<br>Every member gets a topic.</div>\n    <div class=\"card dark\"><h4>Still open</h4>MOI not issued yet. Once it is, check the reporting procedure, the creed you'll be asked for, and the topics against Section 0 of this guide.</div>\n  </div>\n\n  <h3>Corrections from your old notes</h3>\n  <table>\n    <tr><th style=\"width:34%\">Old note says</th><th style=\"width:38%\">Correct answer</th><th>Why it matters</th></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> 1-12 IN lineage (Co A, 1st Bn)</td><td><b>2-12 IN</b>: constituted 3 May 1861 as <b>Company B</b>, 1st Bn, 12th Infantry</td><td>That was the wrong battalion. You're 2-12. See Section 22.</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> SALUTE: U = Uniform</td><td>U = <b>Unit</b></td><td>ATP 3-21.8 para 1-25</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> OPORD para 5 = Command and Control</td><td>Para 5 = <b>Command and Signal</b></td><td>ATP 3-21.8 para 2-113</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> TC 4-02.1 is first aid</td><td><b>ATP 4-02.11</b> (23 Mar 2026) superseded it</td><td>Don't cite an obsolete TC</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> FM 3-25.26 land nav</td><td><b>TC 3-25.26</b> (15 Nov 2013)</td><td>Current APD index</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> FM 27-2 physical fitness</td><td><b>FM 7-22</b> and <b>ATP 7-22.02</b></td><td>FM 27-2 is not the PT reference</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> 3rd TCCC phase: \"combat casualty evac plan\"</td><td><b>Tactical Evacuation Care</b></td><td>The three phases are CUF, TFC and TACEVAC</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> Recovery Drill items 6 and 7 swapped</td><td>6 = <b>Groin Stretch</b>, 7 = <b>Calf Stretch</b></td><td>ATP 7-22.02 Ch 16</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> Shot process: \"steady position, aiming, breathing, trigger squeeze\"</td><td><b>Stability, Aim, Control, Movement</b></td><td>That's the old 4 fundamentals. TC 3-22.9 uses the new ones.</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> AR 600-20 is the SHARP reg</td><td><b>AR 600-52</b> (11 Feb 2025)</td><td>AR 600-20 Ch 6 = EO</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> AR 600-63 is suicide prevention</td><td><b>AR 600-92</b>. AR 600-63 is Army Health Promotion.</td><td>The dedicated regulation</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> DA Form 5501 for tape</td><td><b>DA Form 5500</b> only. 5501 is no longer used.</td><td>Army Directive 2026-13</td></tr>\n    <tr><td><span class=\"tag t-fixed\">Fixed</span> ADP 6-22 = \"Army Talent Management\"</td><td>ADP 6-22 = <b>Army Leadership and the Profession</b></td><td>Wrong title</td></tr>\n  </table>\n\n  <h3>Contents</h3>\n  \n\n  <div class=\"callout c-gold\"><div class=\"ttl\">Rule for every answer</div>Address the member who asked: \"First Sergeant, ...\" or \"Sergeant Major, ...\". Give the answer, then the reference if you know it. If you don't know, say <b>\"First Sergeant, I do not know the answer, but I will find out.\"</b> Never guess a number or paragraph. A confident wrong answer hurts you more than an honest \"I'll find out.\"</div>\n</div>\n"},"must":[{"section":"creeds","html":"<div class=\"creed\">\n    <div class=\"lead\"><span class=\"tag t-must\">Must know</span>&nbsp; The Creed of the Noncommissioned Officer</div>\n    <p><span class=\"key\">No one is more professional than I.</span> I am a noncommissioned officer, a leader of Soldiers. As a noncommissioned officer, I realize that I am a member of a time honored corps, which is known as \"The Backbone of the Army\". I am proud of the Corps of noncommissioned officers and will at all times conduct myself so as to bring credit upon the Corps, the military service and my country regardless of the situation in which I find myself. I will not use my grade or position to attain pleasure, profit, or personal safety.</p>\n    <p><span class=\"key\">Competence is my watchword.</span> My two basic responsibilities will always be uppermost in my mind—accomplishment of my mission and the welfare of my Soldiers. I will strive to remain technically and tactically proficient. I am aware of my role as a noncommissioned officer. I will fulfill my responsibilities inherent in that role. All Soldiers are entitled to outstanding leadership; I will provide that leadership. I know my Soldiers and I will always place their needs above my own. I will communicate consistently with my Soldiers and never leave them uninformed. I will be fair and impartial when recommending both rewards and punishment.</p>\n    <p><span class=\"key\">Officers of my unit will have maximum time to accomplish their duties;</span> they will not have to accomplish mine. I will earn their respect and confidence as well as that of my Soldiers. I will be loyal to those with whom I serve; seniors, peers, and subordinates alike. I will exercise initiative by taking appropriate action in the absence of orders. I will not compromise my integrity, nor my moral courage. I will not forget, nor will I allow my comrades to forget that we are professionals, noncommissioned officers, leaders!</p>\n  </div>"},{"section":"creeds","html":"<div class=\"creed lines\">\n      <div class=\"lead\"><span class=\"tag t-must\">Must know</span>&nbsp; The Soldier's Creed</div>\n      <p>I am an American Soldier.</p>\n      <p>I am a warrior and a member of a team.</p>\n      <p>I serve the people of the United States, and live the Army Values.</p>\n      <p class=\"key\">I will always place the mission first.</p>\n      <p class=\"key\">I will never accept defeat.</p>\n      <p class=\"key\">I will never quit.</p>\n      <p class=\"key\">I will never leave a fallen comrade.</p>\n      <p>I am disciplined, physically and mentally tough, trained and proficient in my warrior tasks and drills.</p>\n      <p>I always maintain my arms, my equipment and myself.</p>\n      <p>I am an expert and I am a professional.</p>\n      <p>I stand ready to deploy, engage, and destroy, the enemies of the United States of America in close combat.</p>\n      <p>I am a guardian of freedom and the American way of life.</p>\n      <p>I am an American Soldier.</p>\n    </div>"},{"section":"creeds","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Army Values: LDRSHIP</h4>\n        <div class=\"mnem\"><span><b>L</b>Loyalty</span><span><b>D</b>Duty</span><span><b>R</b>Respect</span><span><b>S</b>Selfless Service</span><span><b>H</b>Honor</span><span><b>I</b>Integrity</span><span><b>P</b>Personal Courage</span></div>\n      </div>"},{"section":"basics","html":"<div class=\"callout c-gold\"><div class=\"ttl\">Army mission <span class=\"tag t-must\">Must know</span></div>\n    \"To deploy, fight, and win our Nation's wars by providing ready, prompt, and sustained land dominance by Army forces across the full spectrum of conflict as part of the joint force.\" <span class=\"tag t-verify\">Verify</span> army.mil/about\n  </div>"},{"section":"leadership","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Army leadership</b> is the activity of influencing people by providing purpose, direction, and motivation to accomplish the mission and improve the organization. (ADP 6-22)</div></div>"},{"section":"leadership","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Attributes (what a leader IS)</h4>\n      <div class=\"mnem\"><span><b>C</b>Character</span><span><b>P</b>Presence</span><span><b>I</b>Intellect</span></div>\n      <span class=\"small\">Character: Army Values, empathy, Warrior Ethos/service ethos, discipline, humility. Presence: military and professional bearing, fitness, confidence, resilience. Intellect: mental agility, sound judgment, innovation, interpersonal tact, expertise. <span class=\"tag t-verify\">Verify</span> ADP 6-22 Ch 2–4</span></div>"},{"section":"leadership","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Competencies (what a leader DOES)</h4>\n      <div class=\"mnem\"><span><b>L</b>Leads</span><span><b>D</b>Develops</span><span><b>A</b>Achieves</span></div>\n      <span class=\"small\">Leads: others, builds trust, extends influence, leads by example, communicates. Develops: creates a positive environment, prepares self, develops others, stewards the profession. Achieves: gets results. <span class=\"tag t-verify\">Verify</span> ADP 6-22 Ch 5–7</span></div>"},{"section":"leadership","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Three categories:</b> Performance, Professional Growth, Event. (Ch 2, para 2-4)</div></div>"},{"section":"leadership","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>DA Form 4856</b>, Developmental Counseling Form, documents counseling.</div></div>"},{"section":"sharp","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>Ch 2 = sexual harassment. Ch 3 = sexual assault. Ch 9 = retaliation. Para 3-3 = restricted and unrestricted reporting.</div></div>"},{"section":"sharp","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>DA Form 7746</b> = Sexual Harassment Complaint (Jan 2026). <b>DA Form 7279</b> = Equal Opportunity and Harassment Complaint (Jul 2020). These are separate processes from each other and from sexual-assault reporting.</div></div>"},{"section":"sharp","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>If a Soldier may be at <b>immediate risk</b>, stay with them, call for emergency help (911, or 988 then press 1 for the Military Crisis Line), and escort them to qualified care: Behavioral Health, the ER, or the chaplain.</div></div>"},{"section":"wear","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>AR 670-1</b>, Wear and Appearance of Army Uniforms and Insignia. <b>DA Pam 670-1</b> is the detailed wear guide. <b>AR 670-1 Chapter 3</b> covers appearance and grooming.</div></div>"},{"section":"wear","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Facial hair:</b> Army Directives <b>2025-13</b> and <b>2026-09</b>. Male Soldiers are <b>clean-shaven</b> in uniform or on duty unless an approved medical exception or religious accommodation applies. Authorized mustaches are still permitted. An existing approved religious accommodation stays valid during its required review.</div></div>"},{"section":"promo","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>Chapter 3 covers <b>semi-centralized promotions</b> (SGT and SSG). Para 3-8 covers unit promotion boards. Para 3-12 covers board proceedings.</div></div>"},{"section":"h2f","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>FM 7-22</b>, Holistic Health and Fitness (1 Oct 2020, incl. C2). <b>Five domains:</b> Physical, Nutritional, Mental, Spiritual, Sleep Readiness.</div></div>"},{"section":"h2f","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> AFT: 5 events</h4>\n      <ol>\n        <li>3-Repetition Maximum <b>Deadlift</b> (MDL)</li>\n        <li><b>Hand-Release Push-Up</b> (HRP)</li>\n        <li><b>Sprint-Drag-Carry</b> (SDC)</li>\n        <li><b>Plank</b> (PLK)</li>\n        <li><b>Two-Mile Run</b> (2MR)</li>\n      </ol>\n      Replaced the ACFT on 1 Jun 2025. <b>Combat standard (11B): 350 total, minimum 60 per event, sex-neutral.</b> Enforced for the Regular Army since 1 Jan 2026. <span class=\"tag t-verify\">Verify</span> ATP 7-22.01.</div>"},{"section":"h2f","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> CFT: 7 continuous events</h4>\n      <ol>\n        <li>1-mile run</li>\n        <li>30 dead-stop push-ups</li>\n        <li>100-meter sprint</li>\n        <li>16 × 40-lb sandbag lifts to 65 inches</li>\n        <li>Two 40-lb water cans, 50 meters</li>\n        <li>25 m high crawl + 25 m rush</li>\n        <li>1-mile run</li>\n      </ol>\n      <b>Pass/fail on total time. The Army FAQ says 30 minutes or less.</b> <span class=\"tag t-verify\">Verify</span> uniform and event details in the directive.</div>"},{"section":"h2f","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Preparation Drill (Ch 3, para 3-1)</h4>\n      <ol><li>Bend and Reach</li><li>Rear Lunge</li><li>High Jumper</li><li>Rower</li><li>Squat Bender</li><li>Windmill</li><li>Forward Lunge</li><li>Prone Row</li><li>Bent-Leg Body Twist</li><li>Push-Up</li></ol></div>"},{"section":"h2f","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Recovery Drill (Ch 16)</h4>\n      <ol><li>Overhead Arm Pull</li><li>Rear Lunge</li><li>Extend and Flex</li><li>Thigh Stretch</li><li>Single-Leg Over</li><li><b>Groin Stretch</b> <span class=\"tag t-fixed\">Fixed</span></li><li><b>Calf Stretch</b> <span class=\"tag t-fixed\">Fixed</span></li><li>Hamstring Stretch</li></ol></div>"},{"section":"weapons","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Four functional elements</h4><div class=\"mnem\"><span><b>S</b>Stability</span><span><b>A</b>Aim</span><span><b>C</b>Control</span><span><b>M</b>Movement</span></div></div>"},{"section":"weapons","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Three phases</h4><div class=\"mnem\"><span><b>1</b>Pre-shot</span><span><b>2</b>Shot</span><span><b>3</b>Post-shot</span></div></div>"},{"section":"weapons","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Four weapon safety rules:</b> 1) Treat every weapon as loaded. 2) Never point a weapon at anything you don't intend to shoot. 3) Keep your finger straight and off the trigger until you're ready to fire. 4) Keep the weapon on safe until you intend to fire. <span class=\"tag t-verify\">Verify</span> TC 3-22.9.</div></div>"},{"section":"comms","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>PMCS</b> = Preventive Maintenance Checks and Services. Intervals: <b>Before, During, After</b> operation, plus <b>Weekly</b> and <b>Monthly</b>. Done from the operator's <b>-10 TM</b>.</div></div>"},{"section":"firstaid","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>ATP 4-02.11</b>, Casualty Response, Tactical Combat Casualty Care, and First Aid (23 Mar 2026). It <b>superseded TC 4-02.1</b>.</div></div>"},{"section":"landnav","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> 5 Major</h4>Hill · Saddle · Valley · Ridge · Depression<br><span class=\"small\">Cue: \"Hidden Valley Ranch Salad Dressing\" (different order, same 5).</span></div>"},{"section":"landnav","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> 3 Minor</h4>Draw · Spur · Cliff</div>"},{"section":"landnav","html":"<div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> 2 Supplementary</h4>Cut · Fill</div>"},{"section":"unit","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Constituted 3 May 1861</b> in the Regular Army as <b>Company B, 1st Battalion, 12th Infantry</b>. <b>Organized 20 October 1861 at Fort Hamilton, New York.</b> <span class=\"tag t-fixed\">Fixed</span> Your old notes had 1-12's lineage (Company A). <span class=\"tag t-verify\">Verify</span> the official CMH lineage certificate.</div></div>"},{"section":"unit","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>Motto: <b>\"Steadfast and Loyal.\"</b> Nicknames: <b>\"Ivy\"</b> (from the Roman numeral IV) and <b>\"Iron Horse.\"</b> <span class=\"tag t-verify\">Verify</span></div></div>"},{"section":"unit","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>WWII: landed first at <b>Utah Beach, 6 June 1944</b>. <b>BG Theodore Roosevelt Jr.</b> received the Medal of Honor for his leadership there. The CG spoke at the Utah Beach ceremony on 6 June 2026.</div></div>"},{"section":"wars","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>WWII:</b> The <b>8th, 12th and 22nd Infantry Regiments</b> made up 4ID. They landed first on <b>Utah Beach</b>. <b>BG Theodore Roosevelt Jr.</b> landed with the first wave and received the Medal of Honor. Then Cherbourg, the liberation of Paris, the <b>Hürtgen Forest</b> and the <b>Battle of the Bulge</b> in Luxembourg.</div></div>"},{"section":"wars","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>OIF:</b> 4ID Soldiers captured <b>Saddam Hussein</b> near Tikrit on <b>13 December 2003</b> (Operation Red Dawn).</div></div>"},{"section":"wars","html":"<div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>WWII:</b> one of 4ID's three infantry regiments. Landed at Utah Beach, fought in the Hürtgen Forest, and held the line in Luxembourg during the Battle of the Bulge.</div></div>"}],"plan":[{"date":"2026-11-12","sections":["corrections","creeds","basics"],"focus":"Sec 0 corrections · Sec 1 Creeds · Sec 5 Army basics","also":"Ask the 1SG/PSG for the MOI date and chain-of-command names"},{"date":"2026-11-13","sections":["coc","unit","wars"],"focus":"Sec 3 Chain of command · Sec 22 2-12 / 4ID · Sec 23 Wars & history","also":"Fill in every blank in Sec 3"},{"date":"2026-11-14","sections":["nco","leadership","benefits"],"focus":"Sec 4 Personal · Sec 6 Leadership & counseling · Sec 12 Benefits","also":"Write your \"about yourself\" answer and say it out loud 5 times"},{"date":"2026-11-15","sections":["regs","sharp"],"focus":"Sec 7 Regs & UCMJ · Sec 8 SHARP/EO/Suicide","also":"Get the AGSU fitted and pressed"},{"date":"2026-11-16","sections":["tactics","acronyms","training"],"focus":"Sec 14 Tactics · Sec 15 Acronyms · Sec 13 Training & CBRN","also":"Have an NCO inspect your AGSU with a ruler"},{"date":"2026-11-17","sections":["weapons","systems","comms"],"focus":"Sec 16 Your weapons · Sec 17 Weapon systems · Sec 18 Comms & maintenance","also":"Check your ERB/ORB matches your rack"},{"date":"2026-11-18","sections":["promo","h2f","firstaid","wear","landnav","drill"],"focus":"Sec 10 ABCP · Sec 11 H2F · Sec 19 TCCC · Sec 9 Wear · Sec 20 Land nav · Sec 21 Drill","also":"Full mock board in AGSU, with knocking and reporting"},{"date":"2026-11-19","sections":["scenarios"],"focus":"Review all \"Must know\" tags · Sec 24 Situational questions","also":"Haircut. Light review only. Sleep 8 hours."},{"date":"2026-11-20","sections":[],"focus":"BOARD","also":"Creed once in the morning. Eat. Arrive early."}],"pubs":[{"id":"ADP 1","title":"The Army","date":"31 Jul 2019"},{"id":"ADP 6-22","title":"Army Leadership and the Profession (C2)","date":"31 Jul 2019"},{"id":"ADP 7-0","title":"Training","date":"29 Apr 2024"},{"id":"ATP 3-21.8","title":"Infantry Rifle Platoon and Squad (C1)","date":"11 Jan 2024"},{"id":"ATP 3-21.9","title":"Stryker Infantry Rifle Platoon and Squad","date":"24 Jun 2025"},{"id":"ATP 4-02.11","title":"Casualty Response, TCCC, and First Aid","date":"23 Mar 2026"},{"id":"ATP 6-22.1","title":"Counseling–Coaching–Mentoring","date":"13 Feb 2024"},{"id":"ATP 7-22.01","title":"Holistic Health and Fitness Testing","date":"12 Mar 2026"},{"id":"ATP 7-22.02","title":"H2F Drills and Exercises (C1)","date":"1 Oct 2020"},{"id":"FM 7-22","title":"Holistic Health and Fitness (C2)","date":"1 Oct 2020"},{"id":"FM 6-22","title":"Developing Leaders (C2)","date":"1 Nov 2022"},{"id":"TC 3-21.5","title":"Drill and Ceremonies","date":"3 May 2021"},{"id":"TC 3-22.9","title":"Rifle and Carbine (C1–C3)","date":"13 May 2016"},{"id":"TC 3-22.249","title":"Light Machine Gun M249","date":"16 May 2017"},{"id":"TC 3-22.240","title":"Medium Machine Gun","date":"28 Apr 2017"},{"id":"TC 3-25.26","title":"Map Reading and Land Navigation","date":"15 Nov 2013"},{"id":"TC 7-21.13","title":"The Soldier's Guide","date":"17 Sep 2025"},{"id":"TC 7-22.7","title":"The NCO Guide","date":"19 Aug 2025"},{"id":"DA Pam 750-1","title":"Army Materiel Maintenance Procedures","date":"29 Apr 2026"},{"id":"AR 600-20","title":"Army Command Policy","date":"15 Apr 2026"},{"id":"AR 600-52","title":"SHARP Program","date":"11 Feb 2025"},{"id":"AR 600-92","title":"Army Suicide Prevention Program","date":"4 Oct 2024"},{"id":"AR 600-8-19","title":"Enlisted Promotions and Demotions","date":"6 Mar 2026"},{"id":"AR 600-8-22","title":"Military Awards","date":"11 May 2026"},{"id":"AR 600-9","title":"Army Body Composition Program","date":"16 Jul 2019"},{"id":"AR 623-3","title":"Evaluation Reporting System","date":"14 Feb 2025"},{"id":"AR 670-1 / DA Pam 670-1","title":"Wear and Appearance","date":"26 Jan 2021"},{"id":"AR 350-1","title":"Army Training and Leader Development","date":"1 Jun 2025"},{"id":"AR 600-85","title":"Army Substance Abuse Program","date":"4 Oct 2024"},{"id":"AR 600-25","title":"Salutes, Honors, and Courtesy","date":"1 May 2026"},{"id":"AR 930-4","title":"Army Emergency Relief","date":"15 Apr 2026"},{"id":"AR 27-10","title":"Military Justice","date":"8 Jan 2025"},{"id":"DA Form 4856","title":"Developmental Counseling Form","date":"1 Mar 2023"},{"id":"DA Form 2166-9-1","title":"NCOER (SGT)","date":"1 Nov 2015"},{"id":"DA Form 5500","title":"Body Composition Worksheet","date":"1 Jul 2026"},{"id":"DA Form 7279 / 7746","title":"EO & Harassment / SH Complaint","date":"Jul 2020 / Jan 2026"},{"id":"AD 2025-13, 2025-18, 2026-09","title":"Grooming / appearance / religious accommodation","date":"2025–2026"},{"id":"AD 2026-07 / 2026-13","title":"Physical fitness standards / ABCP","date":"17 Apr / 1 Jul 2026"}],"categories":[{"name":"Board & Basics","sections":["creeds","board","coc","nco","basics"]},{"name":"Leadership & Policy","sections":["leadership","regs","sharp","wear","promo","benefits"]},{"name":"Fitness & Training","sections":["h2f","training"]},{"name":"Soldier Skills","sections":["tactics","acronyms","weapons","systems","comms","firstaid","landnav","drill"]},{"name":"Unit & History","sections":["unit","wars"]},{"name":"Situational","sections":["scenarios"]},{"name":"Corrections","sections":["corrections"]}]};

<script>
const __m_store = (() => {
// Progress store: per-question stats, spaced review, favorites and free-text fields.
// Saved to localStorage under one key. Falls back to memory when storage is unavailable.
const KEY = 'steadfast.v1';
const INTERVAL = { 2: 2, 3: 3 }; // days until next review after reaching box 2 / 3

const empty = () => ({ items: {}, favs: [], fields: {} });

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function todayISO(now = new Date()) {
  const y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0'), d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function dueIds(state, today) {
  return Object.entries(state.items).filter(([, it]) => it.missed && it.due && it.due <= today).map(([id]) => id);
}

function createStore(storage = globalThis.localStorage) {
  let state = empty();
  let persistent = false;
  try {
    if (storage) {
      const raw = storage.getItem(KEY);
      if (raw) state = { ...empty(), ...JSON.parse(raw) };
      storage.setItem(KEY, JSON.stringify(state));
      persistent = true;
    }
  } catch { persistent = false; }

  const save = () => {
    if (!persistent) return;
    try { storage.setItem(KEY, JSON.stringify(state)); } catch { persistent = false; api.persistent = false; }
  };

  const api = {
    persistent,
    get: () => state,
    record(id, correct, today) {
      const it = state.items[id] || (state.items[id] = { seen: 0, right: 0, wrong: 0, streak: 0, missed: false, last: false, box: 0, due: null });
      it.seen++;
      it.last = correct;
      if (!correct) {
        it.wrong++; it.streak = 0; it.missed = true; it.box = 1; it.due = addDays(today, 1);
      } else {
        it.right++; it.streak++;
        if (it.missed) {
          it.box++;
          if (it.box > 3) { it.missed = false; it.due = null; it.box = 0; }
          else it.due = addDays(today, INTERVAL[it.box]);
        }
      }
      save();
    },
    toggleFav(id) {
      const i = state.favs.indexOf(id);
      if (i >= 0) state.favs.splice(i, 1); else state.favs.push(id);
      save();
      return i < 0;
    },
    setField(name, value) { state.fields[name] = value; save(); },
    reset() { state = empty(); save(); },
  };
  return api;
}

return { KEY, addDays, todayISO, dueIds, createStore };
})();

const __m_quiz = (() => {
// Quiz engine: choose questions, shuffle choices, interleave topics, grade, and summarize progress.
const { dueIds, todayISO } = __m_store;

function shuffle(arr, rand = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Reorders so no two neighbors share a section whenever another section still has items.
// Always takes from the section with the most items left (ties: earliest in the given order).
function interleave(items, sectionOf = (x) => x.section) {
  const groups = new Map();
  items.forEach((x) => { const k = sectionOf(x); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const out = [];
  let last = null;
  while (out.length < items.length) {
    let best = null;
    for (const [k, g] of groups) {
      if (!g.length || k === last) continue;
      if (!best || g.length > groups.get(best).length) best = k;
    }
    if (best === null) best = last; // only the last section has items left
    out.push(groups.get(best).shift());
    last = best;
  }
  return out;
}

const toTurn = (item, kind, rand) => (kind === 'mc' ? { item, kind, choices: shuffle(item.choices, rand) } : { item, kind });

function pickQuestions(bank, state, opts, rand = Math.random) {
  const { sections, source = 'all', mode = 'mixed', count = 10, today = todayISO() } = opts;
  let pool = bank;
  if (sections && sections.length) pool = pool.filter((i) => sections.includes(i.section));
  if (source === 'missed') pool = pool.filter((i) => state.items[i.id]?.missed);
  if (source === 'favs') pool = pool.filter((i) => state.favs.includes(i.id));
  if (source === 'due') { const due = new Set(dueIds(state, today)); pool = pool.filter((i) => due.has(i.id)); }
  if (mode === 'mc') pool = pool.filter((i) => i.mc);
  let picked = shuffle(pool, rand);
  if (count !== 'all') picked = picked.slice(0, count);
  return interleave(picked, (i) => i.section).map((i) => toTurn(i, mode === 'typed' || !i.mc ? 'typed' : 'mc', rand));
}

function pickBoardSim(bank, rand = Math.random) {
  const regular = shuffle(bank.filter((i) => i.section !== 'scenarios'), rand);
  const chosen = [];
  const used = new Set();
  for (const it of regular) {
    if (chosen.length === 13) break;
    if (!used.has(it.section)) { chosen.push(it); used.add(it.section); }
  }
  const scen = shuffle(bank.filter((i) => i.section === 'scenarios'), rand).slice(0, 2);
  return interleave(shuffle([...chosen, ...scen], rand), (i) => i.section).map((item) => ({ item, kind: 'typed' }));
}

const gradeMC = (turn, choice) => choice === turn.item.a;

function sectionProgress(bank, state) {
  const out = {};
  for (const i of bank) {
    const p = out[i.section] || (out[i.section] = { total: 0, seen: 0, mastered: 0 });
    p.total++;
    const s = state.items[i.id];
    if (s && s.seen) p.seen++;
    if (s && s.last === true) p.mastered++;
  }
  return out;
}

function daysUntil(dateISO, now = new Date()) {
  const [y, m, d] = todayISO(now).split('-').map(Number);
  const [ty, tm, td] = dateISO.split('-').map(Number);
  return Math.max(0, Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(y, m - 1, d)) / 86400000));
}

return { shuffle, interleave, pickQuestions, pickBoardSim, gradeMC, sectionProgress, daysUntil };
})();

const __m_ui = (() => {
// Small DOM helpers shared by views.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}

const TAG_LABEL = { must: 'Must know', know: 'Know', bonus: 'Bonus', verify: 'Verify', local: 'Local', fixed: 'Fixed', new: 'New' };
const tagHTML = (tags = []) => tags.filter((t) => TAG_LABEL[t] && t !== 'new').map((t) => `<span class="tag t-${t}">${TAG_LABEL[t]}</span>`).join('');

function view(root, name, ...kids) {
  root.replaceChildren(el('div', { 'data-view': name }, ...kids));
  window.scrollTo(0, 0);
}

const topbar = (sub) => el('header', { class: 'topbar' }, el('div', { class: 'brand', html: 'STEAD<span>FAST</span>' }), el('small', {}, sub || 'Board Prep · 2-12 IN'));

// The study sections shown on Topics/Home/Progress: numbered guide sections except Library-only ones, plus Corrections.
function studySections(library) {
  const list = library.sections.filter((s) => s.category !== 'Library').map(({ key, num, title, category }) => ({ key, num, title, category }));
  list.push({ key: 'corrections', num: 0, title: 'Corrections to old notes', category: 'Corrections' });
  return list;
}

function meter(frac) {
  return el('span', { class: 'right' }, el('span', { class: 'meter' }, el('i', { style: `width:${Math.round(frac * 100)}%` })), el('span', { class: 'pct' }, `${Math.round(frac * 100)}%`));
}

return { esc, el, tagHTML, view, topbar, studySections, meter };
})();

const __m_session = (() => {
const { el, view, topbar, esc, tagHTML } = __m_ui;
const { gradeMC } = __m_quiz;
const { todayISO } = __m_store;

const LETTERS = 'ABCD';

function header(ctx, turn, i, n, title) {
  const favs = ctx.store.get().favs;
  const on = favs.includes(turn.item.id);
  const btn = el('button', { class: 'fav-btn', 'aria-label': on ? 'Remove favorite' : 'Add favorite', 'aria-pressed': String(on) }, on ? '★' : '☆');
  btn.onclick = () => { const now = ctx.store.toggleFav(turn.item.id); btn.textContent = now ? '★' : '☆'; btn.setAttribute('aria-pressed', String(now)); btn.setAttribute('aria-label', now ? 'Remove favorite' : 'Add favorite'); };
  return el('div', { class: 'qhead' }, el('span', {}, `Q ${i + 1}/${n} · ${title}`), btn);
}

function sectionTitle(ctx, key) {
  if (key === 'corrections') return 'Corrections';
  return ctx.library.sections.find((s) => s.key === key)?.title || key;
}

const modelAnswer = (item) => el('div', { class: 'ans model', html: `<h4>Model answer</h4>${esc(item.a)} ${tagHTML(item.tags)}` });

function render(root, ctx) {
  const s = ctx.session;
  if (!s.turns.length) {
    return view(root, 'session', topbar(s.label), el('div', { class: 'empty' }, 'Nothing here yet.'), el('button', { class: 'btn', onclick: () => ctx.go('#/home') }, 'Home'));
  }
  const turn = s.turns[s.i];
  const last = s.i === s.turns.length - 1;
  const next = () => { if (last) ctx.go('#/results'); else { s.i++; render(root, ctx); } };
  const record = (ok) => { ctx.store.record(turn.item.id, ok, todayISO()); s.results.push({ item: turn.item, ok }); };
  const nextBtn = () => el('button', { class: 'btn gold', onclick: next }, last ? 'See results →' : 'Next →');

  const card = el('div', { class: 'qcard' }, el('div', { class: 'qtext' }, turn.item.q));
  const after = el('div', {});

  if (turn.kind === 'mc') {
    const buttons = turn.choices.map((c, k) => el('button', { class: 'btn choice', html: `<b>${LETTERS[k]}</b> ${esc(c)}` }));
    buttons.forEach((b, k) => b.addEventListener('click', () => {
      if (after.childElementCount) return;
      const ok = gradeMC(turn, turn.choices[k]);
      buttons.forEach((x, j) => { x.disabled = true; if (turn.choices[j] === turn.item.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      record(ok);
      after.append(el('div', { class: 'reveal' }, el('div', { class: `verdict ${ok ? 'ok' : 'bad'}` }, ok ? 'Correct' : 'Not quite'), modelAnswer(turn.item)), el('div', { class: 'actions' }, nextBtn()));
    }));
    card.append(el('div', { class: 'choices' }, buttons));
  } else {
    const box = el('textarea', { placeholder: 'Type your answer (or leave blank and say it out loud)', 'aria-label': 'Your answer' });
    const check = el('button', { class: 'btn gold' }, 'Check answer');
    check.onclick = () => {
      box.readOnly = true; check.remove();
      const grade = (ok) => { record(ok); next(); };
      after.append(el('div', { class: 'reveal' },
        el('div', { class: 'ans', html: `<h4>You wrote</h4>${esc(box.value.trim() || '(said it out loud)')}` }),
        modelAnswer(turn.item)),
        el('div', { class: 'actions two' },
          el('button', { class: 'btn ok', onclick: () => grade(true) }, '✅ I got it'),
          el('button', { class: 'btn bad', onclick: () => grade(false) }, '❌ I missed it')));
    };
    card.append(el('div', { class: 'say' }, 'Say it out loud first, then type or tap Check.'), box, el('div', { class: 'actions' }, check));
  }
  card.append(after);
  view(root, 'session', topbar(s.label), header(ctx, turn, s.i, s.turns.length, sectionTitle(ctx, turn.item.section)), card);
}

return { sectionTitle, modelAnswer, render };
})();

const __m_home = (() => {
const { el, view, topbar, studySections, meter } = __m_ui;
const { daysUntil, sectionProgress, pickQuestions, pickBoardSim } = __m_quiz;
const { dueIds, todayISO } = __m_store;

const BOARD_DATE = '2026-11-20';

function todaysPlan(plan, today) {
  return plan.find((d) => d.date === today) || plan.find((d) => d.date > today) || plan[plan.length - 1];
}

function render(root, ctx) {
  const { bank, library, store } = ctx;
  const state = store.get();
  const today = todayISO();
  const days = daysUntil(BOARD_DATE);
  const due = dueIds(state, today).length;
  const missed = Object.values(state.items).filter((i) => i.missed).length;
  const favs = state.favs.length;
  const prog = sectionProgress(bank, state);
  const sections = studySections(library);
  const plan = todaysPlan(library.plan, today);
  const byKey = Object.fromEntries(sections.map((s) => [s.key, s]));

  const start = (opts, label) => ctx.startSession(pickQuestions(bank, state, { today, ...opts }), label);

  view(root, 'home',
    topbar(),
    !store.persistent && el('div', { class: 'banner' }, "Progress won't be saved on this device."),
    el('section', { class: 'hero' },
      el('div', { class: 'count' }, days === 0 ? 'BOARD DAY' : `${days} ${days === 1 ? 'DAY' : 'DAYS'}`, el('small', {}, '▸ 20 NOV')),
      el('p', {}, 'Battalion board · AGSU · Creed first, then questions.'),
      el('button', { class: 'btn primary', onclick: () => start({ source: 'all', mode: 'mc', count: 10 }, 'Quick 10') }, 'Quick 10'),
    ),
    el('div', { class: 'grid2' },
      el('button', { class: 'btn tile due', onclick: () => due && start({ source: 'due', mode: 'mixed', count: 'all' }, 'Due today'), disabled: !due }, el('b', {}, `Due today (${due})`), el('small', {}, 'Spaced review')),
      el('button', { class: 'btn tile', onclick: () => ctx.startBoard(pickBoardSim(bank)) }, el('b', {}, 'Board Sim'), el('small', {}, '15 Qs · no hints')),
      el('button', { class: 'btn tile missed', onclick: () => missed && start({ source: 'missed', mode: 'mixed', count: 'all' }, 'Missed'), disabled: !missed }, el('b', {}, `Missed (${missed})`), el('small', {}, 'Every miss so far')),
      el('button', { class: 'btn tile fav', onclick: () => favs && start({ source: 'favs', mode: 'mixed', count: 'all' }, 'Favorites'), disabled: !favs }, el('b', {}, `Favorites (${favs})`), el('small', {}, 'Starred questions')),
    ),
    el('button', { class: 'btn ghost', style: 'margin-top:10px', onclick: () => ctx.go('#/test') }, 'Full Session →'),
    plan && el('div', { class: 'eyebrow' }, `Today's plan · ${plan.date.slice(8)} Nov`),
    plan && el('div', { class: 'card' },
      el('div', { class: 'muted' }, plan.focus),
      el('div', { class: 'chips' }, plan.sections.filter((k) => byKey[k]).map((k) => el('button', { class: 'chip', onclick: () => ctx.go(`#/topic/${k}`) }, `${byKey[k].num || '0'} · ${byKey[k].title}`))),
      plan.also && el('div', { class: 'muted', style: 'margin-top:8px' }, '+ ' + plan.also),
    ),
    el('div', { class: 'eyebrow' }, 'Progress by section'),
    sections.map((s) => {
      const p = prog[s.key] || { total: 0, mastered: 0 };
      return el('button', { class: 'prog-row', 'data-cat': s.category, onclick: () => ctx.go(`#/topic/${s.key}`) },
        el('span', { class: 'bar' }), el('span', { class: 'num' }, s.num || '0'),
        el('span', {}, el('div', { class: 'row-title' }, s.title)),
        meter(p.total ? p.mastered / p.total : 0));
    }),
  );
}

return { BOARD_DATE, render };
})();

const __m_topics = (() => {
const { el, view, topbar, studySections, meter } = __m_ui;
const { sectionProgress, pickQuestions } = __m_quiz;
const { todayISO } = __m_store;

function render(root, ctx) {
  const { bank, library, store } = ctx;
  const prog = sectionProgress(bank, store.get());
  const sections = studySections(library);
  let active = ctx.topicsTab || 'All';
  const list = el('div', {});
  const tabs = el('div', { class: 'cat-tabs', role: 'tablist' });

  const draw = () => {
    tabs.replaceChildren(...['All', ...library.categories.map((c) => c.name)].map((name) =>
      el('button', { role: 'tab', 'aria-selected': String(name === active), onclick: () => { active = ctx.topicsTab = name; draw(); } }, name)));
    list.replaceChildren(...sections.filter((s) => active === 'All' || s.category === active).map((s) => {
      const p = prog[s.key] || { total: 0, mastered: 0 };
      return el('button', { class: 'topic-row', 'data-cat': s.category, onclick: () => ctx.go(`#/topic/${s.key}`) },
        el('span', { class: 'bar' }), el('span', { class: 'num' }, s.num || '0'),
        el('span', {}, el('div', { class: 'row-title' }, s.title), el('div', { class: 'row-sub' }, `${p.total} Qs · `, el('span', { class: 'cat-label' }, s.category))),
        meter(p.total ? p.mastered / p.total : 0));
    }));
  };
  draw();
  view(root, 'topics', topbar(), el('h2', {}, 'Study Topics'), el('div', { class: 'eyebrow' }, `${sections.length} topics · ${bank.length} questions`), tabs, list);
}

function renderTopic(root, ctx, key) {
  const { bank, library, store } = ctx;
  const s = studySections(library).find((x) => x.key === key);
  if (!s) return ctx.go('#/topics');
  const items = bank.filter((i) => i.section === key);
  const mcCount = items.filter((i) => i.mc).length;
  const start = (mode) => ctx.startSession(pickQuestions(bank, store.get(), { sections: [key], source: 'all', mode, count: 'all', today: todayISO() }), s.title);
  view(root, 'topic', topbar(),
    el('div', { 'data-cat': s.category }, el('span', { class: 'cat-label' }, s.category)),
    el('h2', {}, `${s.num || '0'} · ${s.title}`),
    el('div', { class: 'eyebrow' }, `${items.length} questions · ${mcCount} multiple choice`),
    el('div', { class: 'actions' },
      el('button', { class: 'btn gold', onclick: () => start('mc'), disabled: !mcCount }, 'Multiple choice'),
      el('button', { class: 'btn', onclick: () => start('typed'), disabled: !items.length }, 'Type answers'),

      key === 'corrections' && el('button', { class: 'btn ghost', onclick: () => ctx.go('#/library/start') }, 'Read Start Here'),
    ));
}

return { render, renderTopic };
})();

const __m_test = (() => {
const { el, view, topbar } = __m_ui;
const { pickQuestions } = __m_quiz;
const { todayISO } = __m_store;

const seg = (options, value, onPick) => el('div', { class: 'seg' }, options.map(([v, label]) =>
  el('button', { 'aria-pressed': String(v === value), onclick: () => onPick(v) }, label)));

function render(root, ctx) {
  const o = ctx.testOpts || (ctx.testOpts = { mode: 'mc', source: 'all', cats: null, count: 10 });

  const sectionsFor = (cats) => (cats ? library.categories.filter((c) => cats.includes(c.name)).flatMap((c) => c.sections) : null);
  const opts = () => ({ sections: sectionsFor(o.cats), source: o.source, mode: o.mode, count: 'all', today: todayISO() });

  const rerender = () => render(root, ctx);

  const allBox = el('input', { type: 'checkbox', id: 'cat-all', checked: !o.cats });

  const catBoxes = library.categories.map((c, i) => {

    return el('label', { for: `cat-${i}`, 'data-cat': c.name }, box, el('span', { class: 'bar', style: 'height:18px' }), c.name);

  view(root, 'test', topbar(),
    el('h2', {}, 'Test Mode'),
    el('div', { class: 'eyebrow' }, 'Simulate your promotion board'),
    el('div', { class: 'howto' }, el('b', {}, 'How it works'), 'Mixed topics, shuffled. Multiple choice is scored for you. Typed answers: say it out loud, then grade yourself honestly.'),
    el('div', { class: 'setrow' }, el('label', { class: 'eyebrow' }, 'Format'), seg([['mc', 'Multiple choice'], ['typed', 'Typed'], ['mixed', 'Mixed']], o.mode, (v) => { o.mode = v; rerender(); })),
    el('div', { class: 'setrow' }, el('label', { class: 'eyebrow' }, 'Source'), seg([['all', 'All'], ['due', 'Due'], ['missed', 'Missed'], ['favs', 'Favorites']], o.source, (v) => { o.source = v; rerender(); })),
    el('div', { class: 'setrow' }, el('label', { class: 'eyebrow' }, 'Topics'), el('div', { class: 'checks' }, el('label', { for: 'cat-all' }, allBox, el('b', {}, 'All topics')), catBoxes)),
    el('div', { class: 'setrow' }, el('label', { class: 'eyebrow' }, `Questions · ${available} available`), seg([[10, '10'], [20, '20'], [30, '30'], ['all', 'All']], o.count, (v) => { o.count = v; rerender(); })),
    !available && el('div', { class: 'empty' }, 'Nothing here yet.'),
    el('div', { class: 'actions' },
      el('button', { class: 'btn gold', disabled: !available, onclick: () => {
        const turns = pickQuestions(bank, store.get(), { ...opts(), count: o.count });
        ctx.startSession(turns, `Test · ${n} Qs`);
      } }, 'Begin test →'),
      el('button', { class: 'btn ghost', onclick: () => ctx.go('#/topics') }, 'Study by topic instead')));
}

return { render };
})();

const __m_library = (() => {
const { el, view, topbar, esc } = __m_ui;

function row(num, title, sub, hash, ctx) {
  return el('button', { class: 'topic-row lib-row', onclick: () => ctx.go(hash) },
    el('span', { class: 'bar', style: 'background:var(--gold)' }), el('span', { class: 'num' }, num),
    el('span', {}, el('div', { class: 'row-title' }, title), sub && el('div', { class: 'row-sub' }, sub)), el('span', { class: 'pct' }, '›'));
}

function wrapTables(node) {
  node.querySelectorAll('table').forEach((t) => { const w = el('div', { class: 'tblwrap' }); t.replaceWith(w); w.append(t); });
}

// Turn the guide's blank cells and write-in box into inputs saved on this device.
function bindFields(node, key, store) {
  const fields = store.get().fields;
  if (key === 'coc') {
    node.querySelectorAll('table').forEach((t, ti) => t.querySelectorAll('tr').forEach((tr, ri) => tr.querySelectorAll('td.blank').forEach((td, ci) => {
      const name = `coc.t${ti}.r${ri}.c${ci}`;
      const label = (tr.querySelector('td')?.textContent || 'Name').trim();
      const input = el('input', { type: 'text', name, value: fields[name] || '', placeholder: 'Confirmed name', 'aria-label': label });
      input.addEventListener('input', () => store.setField(name, input.value));
      td.replaceChildren(input);
    })));
  }
  if (key === 'nco') {
    const card = [...node.querySelectorAll('.card')].find((c) => /Write your version here/.test(c.textContent));
    const lines = card && card.querySelector('div[style]');
    if (lines) {
      const ta = el('textarea', { name: 'intro', placeholder: 'Specialist ___, 11B, Team Leader in 2nd Platoon, C Company, 2-12 Infantry...', 'aria-label': 'About yourself' });
      ta.value = fields.intro || '';
      ta.addEventListener('input', () => store.setField('intro', ta.value));
      lines.replaceWith(ta);
    }
  }
}

function page(root, ctx, title, body) {
  view(root, 'library-page', topbar('Library'),
    el('button', { class: 'chip', style: 'margin-bottom:12px', onclick: () => ctx.go('#/library') }, '‹ Library'),
    title && el('h2', { style: 'margin-bottom:12px' }, title), body);
}

function render(root, ctx, key) {
  const { library, store } = ctx;
  if (!key) {
    return view(root, 'library', topbar(),
      el('h2', {}, 'Library'), el('div', { class: 'eyebrow' }, 'Read the source. Know the answers.'),
      row('★', 'Must know review', `${library.must.length} items for 19 Nov`, '#/library/must', ctx),
      row('0', 'Start Here', 'Board format and corrections', '#/library/start', ctx),
      library.sections.map((s) => row(String(s.num), s.title, s.category === 'Library' ? 'Reference' : s.category, `#/library/${s.key}`, ctx)),
      row('§', 'Official publications', `${library.pubs.length} pubs · armypubs.army.mil`, '#/library/pubs', ctx));
  }
  if (key === 'must') {
    const titleOf = Object.fromEntries(library.sections.map((s) => [s.key, `${s.num} · ${s.title}`]));
    return page(root, ctx, 'Must know review', el('div', { class: 'lib' },
      library.must.map((m) => el('div', { class: 'must-block' }, el('div', { class: 'eyebrow', style: 'margin:14px 0 4px' }, titleOf[m.section]), el('div', { html: m.html })))));
  }
  if (key === 'pubs') {
    return page(root, ctx, 'Official publications', el('div', { class: 'lib' },
      el('p', { class: 'small' }, 'Check every fact against the current version on ', el('a', { href: 'https://armypubs.army.mil/', target: '_blank', rel: 'noopener' }, 'armypubs.army.mil'), '.'),
      el('div', { class: 'tblwrap' }, el('table', { html: '<tr><th>Pub</th><th>Title</th><th>Date</th></tr>' + library.pubs.map((p) => `<tr><td><b>${esc(p.id)}</b></td><td>${esc(p.title)}</td><td>${esc(p.date)}</td></tr>`).join('') }))));
  }
  const sec = key === 'start' ? library.start : library.sections.find((s) => s.key === key);
  if (!sec) return ctx.go('#/library');
  const body = el('div', { class: 'lib', html: sec.html });
  wrapTables(body);
  bindFields(body, key, store);
  page(root, ctx, null, body);
}

return { render };
})();

const __m_progress = (() => {
const { el, view, topbar, studySections, meter } = __m_ui;
const { sectionProgress } = __m_quiz;
const { dueIds, todayISO } = __m_store;

function render(root, ctx) {
  const { bank, library, store } = ctx;
  const state = store.get();
  const prog = sectionProgress(bank, state);
  const seen = Object.values(prog).reduce((a, p) => a + p.seen, 0);
  const mastered = Object.values(prog).reduce((a, p) => a + p.mastered, 0);
  const missed = Object.values(state.items).filter((i) => i.missed).length;
  const due = dueIds(state, todayISO()).length;
  const stat = (label, value) => el('div', { class: 'card' }, el('div', { class: 'eyebrow', style: 'margin:0' }, label), el('div', { class: 'row-title', style: 'font-size:24px' }, value));

  view(root, 'progress', topbar(),
    el('h2', {}, 'Progress'),
    !store.persistent && el('div', { class: 'banner', style: 'margin-top:10px' }, "Progress won't be saved on this device."),
    el('div', { class: 'grid2' }, stat('Seen', `${seen} / ${bank.length}`), stat('Mastered', `${mastered}`), stat('Missed', `${missed}`), stat('Due today', `${due}`)),
    el('div', { class: 'eyebrow' }, 'By section · mastered = last answer right'),
    studySections(library).map((s) => {
      const p = prog[s.key] || { total: 0, seen: 0, mastered: 0 };
      return el('button', { class: 'topic-row progress-row', 'data-cat': s.category, onclick: () => ctx.go(`#/topic/${s.key}`) },
        el('span', { class: 'bar' }), el('span', { class: 'num' }, s.num || '0'),
        el('span', {}, el('div', { class: 'row-title' }, s.title), el('div', { class: 'row-sub' }, `${p.seen}/${p.total} seen · ${p.mastered} mastered`)),
        meter(p.total ? p.mastered / p.total : 0));
    }),
    el('div', { class: 'actions', style: 'margin:18px 0' },
      el('button', { class: 'btn bad', onclick: () => { if (confirm('Reset all progress, favorites and saved names?')) { store.reset(); render(root, ctx); } } }, 'Reset progress')));
}

return { render };
})();

const __m_results = (() => {
const { el, view, topbar, esc } = __m_ui;
const { modelAnswer } = __m_session;

function render(root, ctx) {
  const s = ctx.session;
  const res = s.results;
  const right = res.filter((r) => r.ok).length;
  const missed = res.filter((r) => !r.ok);
  view(root, 'results', topbar(s.label),
    el('div', { class: 'score' }, el('b', {}, right), el('span', {}, ` / ${res.length}`), el('div', { class: 'eyebrow' }, `${s.label} · ${res.length ? Math.round((right / res.length) * 100) : 0}%`)),
    missed.length ? el('div', { class: 'eyebrow' }, `Missed (${missed.length}) · back tomorrow for review`) : el('div', { class: 'empty' }, 'Clean sweep. 🎖️'),
    el('div', { class: 'missed-list' }, missed.map((r) => el('div', { class: 'card', style: 'margin-bottom:8px' }, el('div', { class: 'row-title', html: esc(r.item.q) }), modelAnswer(r.item)))),
    el('div', { class: 'actions' },
      missed.length && el('button', { class: 'btn gold', onclick: () => ctx.startSession(missed.map((r) => ({ item: r.item, kind: 'typed' })), 'Retry missed') }, 'Retry missed'),
      el('button', { class: 'btn', onclick: () => ctx.go('#/home') }, 'Home')));
}

return { render };
})();

const __m_board = (() => {
const { el, view, topbar, esc } = __m_ui;
const { todayISO } = __m_store;
const { modelAnswer, sectionTitle } = __m_session;

function render(root, ctx) {
  const s = ctx.session;
  if (s.i >= s.turns.length) return review(root, ctx);
  const turn = s.turns[s.i];
  const last = s.i === s.turns.length - 1;
  const box = el('textarea', { placeholder: 'Answer like you would to the board', 'aria-label': 'Your answer' });
  box.value = s.answers[s.i] || '';
  view(root, 'board', topbar('Board Simulation'),
    el('div', { class: 'qhead' }, el('span', {}, `${s.i + 1} / ${s.turns.length} · ${sectionTitle(ctx, turn.item.section)}`)),
    el('div', { class: 'qcard' },
      el('div', { class: 'qtext' }, turn.item.q),
      el('div', { class: 'say' }, 'Say it out loud first, then type or tap Next. No answers until the end.'),
      box,
      el('div', { class: 'actions' }, el('button', { class: 'btn gold', onclick: () => { s.answers[s.i] = box.value; s.i++; render(root, ctx); } }, last ? 'Finish →' : 'Next →'))));
}

function review(root, ctx) {
  const s = ctx.session;
  s.results = s.results || [];
  const graded = new Map();
  const done = el('button', { class: 'btn gold', disabled: true, onclick: () => {
    s.results = s.turns.map((t, i) => ({ item: t.item, ok: graded.get(i) }));
    ctx.go('#/results');
  } }, 'See results →');
  const rows = s.turns.map((t, i) => {
    const btns = el('div', { class: 'actions two' });
    const grade = (ok) => {
      if (!graded.has(i)) ctx.store.record(t.item.id, ok, todayISO());
      else if (graded.get(i) !== ok) ctx.store.record(t.item.id, ok, todayISO());
      graded.set(i, ok);
      btns.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ok === String(ok))));
      done.disabled = graded.size < s.turns.length;
    };
    btns.append(el('button', { class: 'btn ok', 'data-ok': 'true', onclick: () => grade(true) }, '✅ I got it'), el('button', { class: 'btn bad', 'data-ok': 'false', onclick: () => grade(false) }, '❌ I missed it'));
    return el('div', { class: 'card review-row', style: 'margin-bottom:10px' },
      el('div', { class: 'qhead' }, el('span', {}, `${i + 1} · ${sectionTitle(ctx, t.item.section)}`)),
      el('div', { class: 'row-title' }, t.item.q),
      el('div', { class: 'reveal' }, el('div', { class: 'ans', html: `<h4>You wrote</h4>${esc((s.answers[i] || '').trim() || '(said it out loud)')}` }), modelAnswer(t.item)),
      btns);
  });
  view(root, 'board-review', topbar('Board Simulation'), el('h2', {}, 'Review your answers'), el('div', { class: 'eyebrow' }, 'Grade each one honestly'), rows, el('div', { class: 'actions' }, done));
}

return { render };
})();

const __m_app = (() => {
// App entry: load data, wire the store, route by hash.
const { createStore } = __m_store;
const home = __m_home;
const topics = __m_topics;
const test = __m_test;
const library = __m_library;
const progress = __m_progress;
const session = __m_session;
const results = __m_results;
const board = __m_board;

const root = document.getElementById('app');

async function loadData() {
  if (window.__BANK__ && window.__LIBRARY__) return [window.__BANK__, window.__LIBRARY__];
  const [b, l] = await Promise.all([fetch('data/bank.json'), fetch('data/library.json')]);
  return [await b.json(), await l.json()];
}

const ctx = {
  store: createStore(),
  session: null,
  go(hash) { if (location.hash === hash) route(); else location.hash = hash; },
  startSession(turns, label) { ctx.session = { turns, label, i: 0, results: [] }; ctx.go('#/session'); },
  startBoard(turns) { ctx.session = { turns, label: 'Board Sim', i: 0, answers: [], board: true }; ctx.go('#/board'); },
};

function route() {
  const [, name = 'home', arg] = location.hash.replace(/^#\/?/, '#/').split('/');
  const tab = { topic: 'topics', session: 'test', results: 'test', board: 'home' }[name] || name;
  document.querySelectorAll('nav.tabs a').forEach((a) => a.classList.toggle('active', a.dataset.tab === tab));
  const needsSession = ['session', 'results', 'board'].includes(name);
  if (needsSession && !ctx.session) return ctx.go('#/home');
  switch (name) {
    case 'topics': return topics.render(root, ctx);
    case 'topic': return topics.renderTopic(root, ctx, arg);
    case 'test': return test.render(root, ctx);
    case 'library': return library.render(root, ctx, arg);
    case 'progress': return progress.render(root, ctx);
    case 'session': return session.render(root, ctx);
    case 'results': return results.render(root, ctx);
    case 'board': return board.render(root, ctx);
    default: return home.render(root, ctx);
  }
}

loadData().then(([bank, lib]) => {
  ctx.bank = bank;
  ctx.library = lib;
  window.addEventListener('hashchange', route);
  if (!location.hash) location.hash = '#/home'; else route();
});

return {  };
})();
</script>
