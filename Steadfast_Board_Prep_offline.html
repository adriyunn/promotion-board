<style>
:root {
  --bg: #121412; --panel: #1b1e1b; --panel2: #232723; --line: #2e332e;
  --ink: #f2f3ef; --muted: #9aa197; --gold: #f2c200; --gold-soft: #3a3210;
  --ivy: #2f5d3a; --ivy-dark: #1d3b25; --ivy-soft: #1f2f22;
  --red: #e0554b; --red-soft: #3a1d1b; --green: #49b265; --green-soft: #18301f;
  --amber: #f0a43a; --blue: #6f9be0;
  --cat-board: #f2c200; --cat-lead: #f0a43a; --cat-fit: #49b265; --cat-skills: #6f9be0;
  --cat-unit: #b48be0; --cat-sit: #4fc3c3; --cat-corr: #e0554b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.4; padding-bottom: 76px; }
h1, h2, h3 { font-family: "Inter Display", "Inter", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
a { color: var(--gold); }

#app { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.topbar { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 10px; border-bottom: 2px solid var(--gold); margin-bottom: 14px; }
.brand { font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; letter-spacing: 0.06em; font-size: 18px; }
.brand span { color: var(--gold); }
.topbar small { color: var(--muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
.eyebrow { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin: 18px 0 8px; }
.banner { background: var(--red-soft); color: #ffd5d1; border-left: 4px solid var(--red); padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }

/* Hero */
.hero { background: var(--gold); color: #141414; border-radius: 12px; padding: 16px; }
.hero .count { font-family: "Inter Display", sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.hero .count small { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; margin-left: 6px; }
.hero p { margin: 6px 0 12px; font-weight: 600; font-size: 14px; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; letter-spacing: 0.04em; cursor: pointer; padding: 10px 14px; text-align: center; }
.btn:active { transform: scale(0.99); }
.btn.primary { background: #141414; color: var(--gold); border: none; text-transform: uppercase; }
.btn.gold { background: var(--gold); color: #141414; border: none; text-transform: uppercase; }
.btn.ghost { background: transparent; border: 1px solid var(--gold); color: var(--gold); text-transform: uppercase; }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.tile { text-align: left; align-items: flex-start; flex-direction: column; gap: 2px; min-height: 64px; }
.tile b { font-size: 15px; }
.tile small { color: var(--muted); font-weight: 600; letter-spacing: 0; }
.tile.due { border-color: var(--gold); }
.tile.missed { background: var(--red-soft); border-color: #5a2a26; }
.tile.fav { background: var(--gold-soft); border-color: #5c4d12; }

/* Plan card */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card h3 { font-size: 15px; margin-bottom: 4px; }
.card .muted { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

/* Progress rows */
.prog-row, .topic-row { display: grid; grid-template-columns: 4px 28px 1fr auto; align-items: center; gap: 10px; padding: 11px 6px 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; min-height: 48px; }
.bar { width: 4px; height: 30px; border-radius: 2px; background: var(--muted); }
.num { color: var(--muted); font-weight: 800; font-size: 13px; text-align: right; }
.row-title { font-weight: 700; font-size: 15px; }
.row-sub { color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
.meter { width: 64px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); }
.pct { color: var(--muted); font-size: 12px; font-weight: 700; min-width: 34px; text-align: right; }
.right { display: flex; align-items: center; gap: 8px; }

[data-cat="Board & Basics"] { --cat: var(--cat-board); }
[data-cat="Leadership & Policy"] { --cat: var(--cat-lead); }
[data-cat="Fitness & Training"] { --cat: var(--cat-fit); }
[data-cat="Soldier Skills"] { --cat: var(--cat-skills); }
[data-cat="Unit & History"] { --cat: var(--cat-unit); }
[data-cat="Situational"] { --cat: var(--cat-sit); }
[data-cat="Corrections"] { --cat: var(--cat-corr); }
[data-cat] .bar { background: var(--cat); }
.cat-label { color: var(--cat); font-weight: 800; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

/* Category tabs */
.cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; scrollbar-width: none; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 13px; min-height: 40px; cursor: pointer; }
.cat-tabs button[aria-selected="true"] { background: var(--gold); color: #141414; border-color: var(--gold); }

/* Session */
.qhead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.qhead .fav-btn { background: none; border: none; font-size: 24px; color: var(--gold); min-width: 44px; min-height: 44px; cursor: pointer; }
.qcard { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 10px; padding: 16px; }
.qtext { font-size: 19px; font-weight: 750; line-height: 1.35; }
.choices { display: grid; gap: 8px; margin-top: 14px; }
.choice { text-align: left; justify-content: flex-start; font-weight: 600; letter-spacing: 0; line-height: 1.35; }
.choice b { color: var(--gold); margin-right: 4px; }
.choice.right { background: var(--green-soft); border-color: var(--green); }
.choice.wrong { background: var(--red-soft); border-color: var(--red); }
.say { color: var(--gold); font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
textarea, input[type="text"] { width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; }
textarea { min-height: 110px; resize: vertical; }
.reveal { margin-top: 14px; display: grid; gap: 8px; }
.ans { border-radius: 8px; padding: 10px 12px; background: var(--panel2); border-left: 4px solid var(--muted); font-size: 15px; }
.ans.model { border-left-color: var(--green); }
.ans h4 { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.verdict { font-weight: 800; }
.verdict.ok { color: var(--green); } .verdict.bad { color: var(--red); }
.actions { display: grid; gap: 8px; margin-top: 14px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.btn.ok { background: var(--green-soft); border-color: var(--green); }
.btn.bad { background: var(--red-soft); border-color: var(--red); }

/* Results */
.score { text-align: center; padding: 20px 0 6px; }
.score b { font-family: "Inter Display", sans-serif; font-size: 52px; color: var(--gold); }
.score span { color: var(--muted); font-weight: 700; }
.missed-list .ans { margin-bottom: 8px; }

/* Forms */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 800; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #141414; border-color: var(--gold); }
.setrow { margin-bottom: 14px; }
.setrow label.eyebrow { display: block; margin: 0 0 6px; }
.howto { background: var(--gold); color: #141414; border-radius: 10px; padding: 12px 14px; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.howto b { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 3px; }
.empty { color: var(--muted); text-align: center; padding: 10px; font-weight: 700; }
.checks { display: grid; gap: 4px; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.checks label { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
.checks input { width: 20px; height: 20px; accent-color: var(--gold); }

/* Tags */
.tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; vertical-align: 1px; margin-left: 4px; white-space: nowrap; }
.t-must { background: var(--gold); color: #1a1a1a; }
.t-know { background: var(--ivy); color: #fff; }
.t-bonus { background: #3a3f3a; color: #d5d8d2; }
.t-verify { background: #3a2a10; color: var(--amber); border: 1px solid #6b4a17; }
.t-local { background: #16233a; color: var(--blue); border: 1px solid #2e4570; }
.t-fixed { background: var(--red); color: #fff; }
.t-new { background: var(--green-soft); color: #9fe0b0; border: 1px solid #2f5d3a; }

/* Tab bar */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: #0c0d0c; border-top: 2px solid var(--gold); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 9px; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; min-height: 56px; justify-content: center; }
nav.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
nav.tabs a.active { color: var(--gold); }

/* Library content (guide HTML) */
.lib { font-size: 15px; }
.lib .sec-head { background: var(--ivy-dark); border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 56px 1fr; margin-bottom: 12px; }
.lib .sec-head .num { background: var(--gold); color: #141414; font-family: "Inter Display", sans-serif; font-weight: 900; font-size: 26px; display: flex; align-items: center; justify-content: center; text-align: center; }
.lib .sec-head .txt { padding: 10px 12px; }
.lib .sec-head h2 { font-size: 19px; }
.lib .sec-head .why { color: #cfe0d2; font-size: 13px; margin-top: 2px; }
.lib h3 { font-size: 16px; color: var(--gold); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.lib h4 { margin: 0 0 4px; }
.lib p { margin: 0 0 8px; }
.lib .grid2, .lib .grid3 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.lib .card, .lib .creed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.lib .card.dark { background: var(--ivy-dark); }
.lib .creed { font-family: Georgia, "Liberation Serif", serif; font-size: 16px; line-height: 1.55; border-top: 4px solid var(--gold); }
.lib .creed .lead { font-family: "Inter", sans-serif; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.lib .creed .key { background: var(--gold-soft); }
.lib .fact { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.lib .callout { border-left: 4px solid var(--muted); background: var(--panel); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.lib .callout .ttl { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
.lib .c-fix { border-color: var(--red); } .lib .c-fix .ttl { color: var(--red); }
.lib .c-verify { border-color: var(--amber); } .lib .c-verify .ttl { color: var(--amber); }
.lib .c-tip { border-color: var(--green); } .lib .c-tip .ttl { color: var(--green); }
.lib .c-local { border-color: var(--blue); } .lib .c-local .ttl { color: var(--blue); }
.lib .c-gold { border-color: var(--gold); } .lib .c-gold .ttl { color: var(--gold); }
.lib .mnem { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.lib .mnem span { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font-size: 14px; }
.lib .mnem span b { color: var(--gold); margin-right: 4px; }
.lib .qa-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 12px; }
.lib .qa-title { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; margin: 4px 0; }
.lib .qa { padding: 7px 0; border-top: 1px solid var(--line); }
.lib .qa .q { font-weight: 700; color: var(--gold); }
.lib .tblwrap { overflow-x: auto; }
.lib table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 6px 0 12px; }
.lib th { background: var(--ivy-dark); text-align: left; padding: 6px 8px; font-size: 12px; }
.lib td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lib td.blank input { min-width: 140px; padding: 8px; }
.lib .script { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; background: #0c0d0c; border-radius: 8px; padding: 10px; line-height: 1.6; }
.lib .script .you { color: var(--gold); } .lib .script .brd { color: #9fd3a9; } .lib .script .act { color: var(--muted); font-style: italic; }
.lib .toc, .lib .small, .lib .src { color: var(--muted); font-size: 13px; }
.lib .check { list-style: none; padding-left: 0; }
.lib .check li::before { content: "☐ "; color: var(--gold); }
.lib textarea { margin-top: 6px; }
.choice[disabled] { opacity: 1; cursor: default; }
.choice[disabled]:not(.right):not(.wrong) { opacity: 0.45; }

</style>
</head>

<script>
window.__BANK__ = [{"id":"creeds-01","section":"creeds","category":"Board & Basics","q":"Name the Army Values.","a":"Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, Personal Courage. LDRSHIP.","tags":[],"mc":true,"choices":["Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, Personal Courage. LDRSHIP.","Loyalty, Duty, Respect, Service, Honesty, Integrity, Professionalism. LDRSHIP.","Leadership, Discipline, Respect, Selfless Service, Honor, Initiative, Pride. LDRSHIP.","Loyalty, Discipline, Readiness, Sacrifice, Honor, Integrity, Perseverance. LDRSHIP."]},{"id":"creeds-02","section":"creeds","category":"Board & Basics","q":"What are the two basic responsibilities of an NCO?","a":"Accomplishment of the mission and the welfare of Soldiers. (NCO Creed, paragraph 2)","tags":[],"mc":true,"choices":["Accomplishment of the mission and the welfare of Soldiers. (NCO Creed, paragraph 2)","Accomplishment of the mission and the training of Soldiers. (NCO Creed, paragraph 2)","Maintaining standards and enforcing discipline. (NCO Creed, paragraph 2)","Supporting the officers of the unit and the welfare of Soldiers. (NCO Creed, paragraph 3)"]},{"id":"creeds-03","section":"creeds","category":"Board & Basics","q":"What is the Warrior Ethos?","a":"I will always place the mission first. I will never accept defeat. I will never quit. I will never leave a fallen comrade.","tags":[],"mc":true,"choices":["I will always place the mission first. I will never accept defeat. I will never quit. I will never leave a fallen comrade.","I will always place my Soldiers first. I will never accept defeat. I will never quit. I will never leave a fallen comrade.","I will always place the mission first. I will never accept failure. I will never retreat. I will never leave a fallen comrade.","I will always complete the mission. I will never surrender. I will never quit. I will always maintain my arms and equipment."]},{"id":"creeds-04","section":"creeds","category":"Board & Basics","q":"What publication covers Army leadership and the profession?","a":"ADP 6-22, Army Leadership and the Profession.","tags":[],"mc":true,"choices":["ADP 6-22, Army Leadership and the Profession.","ADP 6-0, Mission Command.","FM 6-22, Developing Leaders.","AR 600-100, Army Profession and Leadership Policy."]},{"id":"creeds-05","section":"creeds","category":"Board & Basics","q":"Which Army Value is the hardest for you to live, and why?","a":"Pick one honestly, such as selfless service when you're tired. Give an example and what you do about it.","tags":[],"mc":false},{"id":"creeds-06","section":"creeds","category":"Board & Basics","q":"What does \"time honored corps\" mean to you?","a":"The NCO Corps dates to 1775. It's a tradition of leaders who carry out the mission and take care of Soldiers. Now you're joining it.","tags":[],"mc":false},{"id":"creeds-07","section":"creeds","category":"Board & Basics","q":"Define integrity.","a":"Do what is right, legally and morally. Being honest in word and deed, even when no one is watching.","tags":[],"mc":true,"choices":["Do what is right, legally and morally. Being honest in word and deed, even when no one is watching.","Bear true faith and allegiance to the Constitution, the Army, your unit and other Soldiers.","Fulfill your obligations and accept responsibility for your actions.","Live up to the Army Values in everything you do."]},{"id":"creeds-08","section":"creeds","category":"Board & Basics","q":"Define selfless service.","a":"Put the welfare of the Nation, the Army and your subordinates before your own.","tags":[],"mc":true,"choices":["Put the welfare of the Nation, the Army and your subordinates before your own.","Fulfill your obligations, do your duty and accept responsibility.","Treat people as they should be treated.","Put the welfare of your team before the mission."]},{"id":"creeds-09","section":"creeds","category":"Board & Basics","q":"Define personal courage.","a":"Face fear, danger or adversity, both physical and moral.","tags":[],"mc":true,"choices":["Face fear, danger or adversity, both physical and moral.","Do what is right, legally and morally.","Fulfill your obligations, even when no one is watching.","Never quit, even when the mission is lost."]},{"id":"board-01","section":"board","category":"Board & Basics","q":"How do you report to the board?","a":"Knock once, enter when told, march to about 2 paces in front of the president, halt, and say \"Sergeant Major, Specialist ___ reports to the President of the Board.\" Salute only if the MOI says to.","tags":["local"],"mc":true,"choices":["Knock once, enter when told, march to about 2 paces in front of the president, halt, and say \"Sergeant Major, Specialist ___ reports to the President of the Board.\" Salute only if the MOI says to.","Knock twice, walk to the president's desk, salute, and say \"Sergeant Major, I'm here for the board.\"","Wait outside until called by name, then sit down in the empty chair and state your name.","Enter without knocking, stand at parade rest, and say \"Specialist ___ reporting as ordered.\""]},{"id":"board-02","section":"board","category":"Board & Basics","q":"How do you sit once you're told to take your seat?","a":"Back straight and off the chair back, feet flat, hands palms down on your thighs.","tags":[],"mc":true,"choices":["Back straight and off the chair back, feet flat, hands palms down on your thighs.","Back against the chair, legs crossed at the ankle, hands folded in your lap.","At parade rest while seated, hands behind your back.","Leaning slightly forward, elbows on your knees, to show you're engaged."]},{"id":"board-03","section":"board","category":"Board & Basics","q":"What do you say if you don't know an answer?","a":"\"First Sergeant, I do not know the answer, but I will find out.\"","tags":[],"mc":true,"choices":["\"First Sergeant, I do not know the answer, but I will find out.\"","\"First Sergeant, I believe the answer is...\" and give your best guess.","\"Next question, First Sergeant.\"","\"First Sergeant, that wasn't in my study guide.\""]},{"id":"board-04","section":"board","category":"Board & Basics","q":"What do you say if you didn't hear the question?","a":"\"First Sergeant, could you repeat the question?\"","tags":[],"mc":true,"choices":["\"First Sergeant, could you repeat the question?\"","\"What, First Sergeant?\"","\"Say again, over.\"","Answer the part of the question you heard."]},{"id":"board-05","section":"board","category":"Board & Basics","q":"Are ribbons authorized on the AGSU shirt?","a":"No. Ribbons go on the AGSU coat only. DA Pam 670-1","tags":["verify"],"mc":true,"choices":["No. Ribbons go on the AGSU coat only. DA Pam 670-1","Yes, centered 1/8 inch above the left pocket.","Yes, but only the top row.","Only unit awards."]},{"id":"board-06","section":"board","category":"Board & Basics","q":"Are miniature badges authorized on the AGSU?","a":"No. Miniature badges are not authorized on the AGSU, and only one badge goes on each pocket.","tags":[],"mc":true,"choices":["No. Miniature badges are not authorized on the AGSU, and only one badge goes on each pocket.","Yes, on the left pocket only.","Yes, if you have more than two badges.","Only for combat badges."]},{"id":"coc-01","section":"coc","category":"Board & Basics","q":"What is the NCO support channel?","a":"The channel from the SMA down to the first-line leader. It parallels and reinforces the chain of command. NCOs use it to pass information, standards, and individual training and welfare issues. AR 600-20, Ch 2.","tags":["verify"],"mc":true,"choices":["The channel from the SMA down to the first-line leader. It parallels and reinforces the chain of command. NCOs use it to pass information, standards, and individual training and welfare issues. AR 600-20, Ch 2.","The channel from the commander down to the platoon leader that issues lawful orders. AR 600-20, Ch 2.","The channel from the SMA to the CSMs only, used for policy changes. AR 600-25.","The staff channel NCOs use to coordinate supply and maintenance. AR 600-20, Ch 4."]},{"id":"coc-02","section":"coc","category":"Board & Basics","q":"Why is it important to know your chain of command?","a":"So you know who gives orders and who is responsible, and so issues get routed to the right level.","tags":[],"mc":false},{"id":"coc-03","section":"coc","category":"Board & Basics","q":"What's the difference between the chain of command and the NCO support channel?","a":"The chain of command issues orders and holds command authority. The NCO support channel backs up the chain, focusing on standards, training and Soldier care.","tags":[],"mc":true,"choices":["The chain of command issues orders and holds command authority. The NCO support channel backs up the chain, focusing on standards, training and Soldier care.","They're the same thing with different names.","The NCO support channel issues orders. The chain of command handles Soldier care.","The chain of command is for officers only. The NCO support channel is for enlisted only."]},{"id":"coc-04","section":"coc","category":"Board & Basics","q":"Who is the senior enlisted leader of 4ID?","a":"The Division CSM (last reported: CSM Waylon D. Petty).","tags":["verify"],"mc":true,"choices":["The Division CSM (last reported: CSM Waylon D. Petty).","The Division Commander (last reported: MG Patrick J. Ellis).","The Sergeant Major of the Army (SMA Michael R. Weimer).","The 2SBCT Command Sergeant Major."]},{"id":"nco-01","section":"nco","category":"Board & Basics","q":"Who was the first Sergeant Major of the Army?","a":"SMA William O. Wooldridge, 1966.","tags":[],"mc":true,"choices":["SMA William O. Wooldridge, 1966.","SMA Silas L. Copeland, 1970.","SMA William G. Bainbridge, 1975.","SMA George W. Dunaway, 1968."]},{"id":"nco-02","section":"nco","category":"Board & Basics","q":"What is the \"Backbone of the Army\"?","a":"The NCO Corps.","tags":[],"mc":true,"choices":["The NCO Corps.","The Officer Corps.","The Infantry.","The Warrant Officer Corps."]},{"id":"nco-03","section":"nco","category":"Board & Basics","q":"What is the NCO Guide?","a":"TC 7-22.7, The Noncommissioned Officer Guide.","tags":[],"mc":true,"choices":["TC 7-22.7, The Noncommissioned Officer Guide.","TC 7-21.13, The Soldier's Guide.","FM 6-22, Developing Leaders.","ATP 6-22.1, Counseling."]},{"id":"nco-04","section":"nco","category":"Board & Basics","q":"Where do you see yourself in 5 years?","a":"A realistic goal: squad leader and SSG, ALC complete, college progress, and developing Soldiers.","tags":[],"mc":false},{"id":"nco-05","section":"nco","category":"Board & Basics","q":"What makes a good team leader?","a":"Leading by example, knowing your Soldiers, enforcing standards consistently, and training your team to be ready to take your job.","tags":[],"mc":false},{"id":"basics-01","section":"basics","category":"Board & Basics","q":"What is the Army's mission?","a":"To deploy, fight, and win our Nation's wars by providing ready, prompt, and sustained land dominance by Army forces across the full spectrum of conflict as part of the joint force.","tags":[],"mc":true,"choices":["To deploy, fight, and win our Nation's wars by providing ready, prompt, and sustained land dominance by Army forces across the full spectrum of conflict as part of the joint force.","To defend the Constitution of the United States against all enemies, foreign and domestic, as part of the joint force.","To organize, train and equip forces for prompt and sustained combat on land, at sea and in the air.","To deploy, fight, and win our Nation's wars by providing ready forces for homeland defense and disaster relief."]},{"id":"basics-02","section":"basics","category":"Board & Basics","q":"How many Soldiers are in a fire team? A squad?","a":"A fire team has 4. A squad has 9: the squad leader and two fire teams.","tags":[],"mc":true,"choices":["A fire team has 4. A squad has 9: the squad leader and two fire teams.","A fire team has 3. A squad has 9: the squad leader and two fire teams.","A fire team has 4. A squad has 12: the squad leader and three fire teams.","A fire team has 5. A squad has 11: the squad leader and two fire teams."]},{"id":"basics-03","section":"basics","category":"Board & Basics","q":"What's the difference between a CPL and a SPC?","a":"Both are E-4. The CPL is an NCO with NCO authority and responsibilities. The SPC is not.","tags":[],"mc":true,"choices":["Both are E-4. The CPL is an NCO with NCO authority and responsibilities. The SPC is not.","The SPC is senior to the CPL in pay grade.","The CPL is E-5. The SPC is E-4.","There is no difference. Both have NCO authority."]},{"id":"basics-04","section":"basics","category":"Board & Basics","q":"What are the three Army components?","a":"Regular Army, Army National Guard, Army Reserve.","tags":[],"mc":true,"choices":["Regular Army, Army National Guard, Army Reserve.","Active Army, Army Reserve, Army Civilians.","Regular Army, Army National Guard, Coast Guard.","Active Duty, Inactive Ready Reserve, Retired Reserve."]},{"id":"basics-05","section":"basics","category":"Board & Basics","q":"What does the flag stand for?","a":"13 stripes for the original colonies. 50 stars for the states.","tags":[],"mc":true,"choices":["13 stripes for the original colonies. 50 stars for the states.","13 stripes for the states. 50 stars for the original colonies.","13 stripes for the original colonies. 50 stars for the Army's campaigns.","12 stripes for the original colonies. 50 stars for the states."]},{"id":"basics-06","section":"basics","category":"Board & Basics","q":"What do you do when the anthem plays outdoors and you're in uniform?","a":"Face the flag or the music, stand at attention, and salute from the first note to the last.","tags":[],"mc":true,"choices":["Face the flag or the music, stand at attention, and salute from the first note to the last.","Stand at parade rest facing the music until the last note.","Stand at attention facing the flag. No salute outdoors.","Salute only if an officer is present, otherwise stand at attention."]},{"id":"leadership-01","section":"leadership","category":"Leadership & Policy","q":"Define leadership.","a":"Influencing people by providing purpose, direction, and motivation to accomplish the mission and improve the organization.","tags":[],"mc":true,"choices":["Influencing people by providing purpose, direction, and motivation to accomplish the mission and improve the organization.","Influencing people by giving orders, enforcing standards and correcting deficiencies.","Accomplishing the mission by managing people, time and resources.","Providing purpose, direction and discipline to accomplish the mission and take care of Soldiers."]},{"id":"leadership-02","section":"leadership","category":"Leadership & Policy","q":"Name the three leader attributes and the three competencies.","a":"Attributes: Character, Presence, Intellect. Competencies: Leads, Develops, Achieves.","tags":[],"mc":true,"choices":["Attributes: Character, Presence, Intellect. Competencies: Leads, Develops, Achieves.","Attributes: Leads, Develops, Achieves. Competencies: Character, Presence, Intellect.","Attributes: Character, Discipline, Intellect. Competencies: Leads, Trains, Achieves.","Attributes: Integrity, Presence, Judgment. Competencies: Leads, Develops, Communicates."]},{"id":"leadership-03","section":"leadership","category":"Leadership & Policy","q":"What are the three categories of counseling?","a":"Performance, professional growth, and event.","tags":[],"mc":true,"choices":["Performance, professional growth, and event.","Performance, disciplinary, and event.","Initial, quarterly, and event.","Performance, professional growth, and crisis."]},{"id":"leadership-04","section":"leadership","category":"Leadership & Policy","q":"What form is used for counseling? For a SGT's NCOER?","a":"DA Form 4856. DA Form 2166-9-1.","tags":[],"mc":true,"choices":["DA Form 4856. DA Form 2166-9-1.","DA Form 2166-9-1. DA Form 4856.","DA Form 4187. DA Form 2166-9-1A.","DA Form 4856. DA Form 2166-9-1A."]},{"id":"leadership-05","section":"leadership","category":"Leadership & Policy","q":"When should you do an initial counseling?","a":"When a Soldier first arrives (reception and integration), and within the first 30 days of a rating period. AR 623-3","tags":["verify"],"mc":true,"choices":["When a Soldier first arrives (reception and integration), and within the first 30 days of a rating period. AR 623-3","Only when there's a problem with the Soldier's performance.","Within the first 90 days of the rating period.","At the end of the rating period, before the NCOER is written."]},{"id":"leadership-06","section":"leadership","category":"Leadership & Policy","q":"What are the levels of leadership?","a":"Direct, organizational, and strategic. A team leader works at the direct level. ADP 6-22.","tags":["verify"],"mc":true,"choices":["Direct, organizational, and strategic. A team leader works at the direct level. ADP 6-22.","Team, squad, and platoon.","Direct, indirect, and strategic.","Tactical, operational, and strategic."]},{"id":"leadership-07","section":"leadership","category":"Leadership & Policy","q":"What's the difference between counseling, coaching and mentoring?","a":"Counseling: a leader and subordinate review performance and potential. Coaching: guiding someone to improve a specific skill. Mentoring: a voluntary, long-term relationship between someone more experienced and someone less experienced, for development.","tags":[],"mc":true,"choices":["Counseling: a leader and subordinate review performance and potential. Coaching: guiding someone to improve a specific skill. Mentoring: a voluntary, long-term relationship between someone more experienced and someone less experienced, for development.","They're the same thing. All three are done on DA Form 4856.","Counseling is voluntary. Coaching is formal. Mentoring is done only by the rater.","Counseling is for problems only. Coaching is for awards. Mentoring is for promotions."]},{"id":"leadership-08","section":"leadership","category":"Leadership & Policy","q":"What should a counseling plan of action include?","a":"Specific actions, who is responsible, and a deadline, so the Soldier knows exactly what to do to improve.","tags":[],"mc":true,"choices":["Specific actions, who is responsible, and a deadline, so the Soldier knows exactly what to do to improve.","A summary of what the Soldier did wrong.","The leader's opinion and the Soldier's signature only.","The Soldier's NCOER rating and next PCS date."]},{"id":"leadership-09","section":"leadership","category":"Leadership & Policy","q":"What is the NCOER rating chain for a SGT?","a":"Rater, senior rater, and supplementary reviewer, if one applies. AR 623-3.","tags":["verify"],"mc":true,"choices":["Rater, senior rater, and supplementary reviewer, if one applies. AR 623-3.","Team leader, squad leader, and platoon sergeant.","Rater, senior rater, and the battalion CSM.","Squad leader, first sergeant, and commander."]},{"id":"leadership-10","section":"leadership","category":"Leadership & Policy","q":"What does it mean to lead by example?","a":"Meeting every standard you enforce: PT, appearance, timeliness. Soldiers do what they see.","tags":[],"mc":false},{"id":"regs-01","section":"regs","category":"Leadership & Policy","q":"What regulation covers Army Command Policy?","a":"AR 600-20.","tags":[],"mc":true,"choices":["AR 600-20.","AR 600-52.","AR 600-8-22.","AR 600-25."]},{"id":"regs-02","section":"regs","category":"Leadership & Policy","q":"What is AER?","a":"Army Emergency Relief. It provides financial help to Soldiers and their families. AR 930-4.","tags":[],"mc":true,"choices":["Army Emergency Relief. It provides financial help to Soldiers and their families. AR 930-4.","Army Equal Rights. It handles EO complaints. AR 600-20.","Army Emergency Response. It handles crisis evacuations. AR 525-93.","Army Education Resources. It provides tuition help. AR 621-5."]},{"id":"regs-03","section":"regs","category":"Leadership & Policy","q":"What do BOSS and MWR stand for?","a":"Better Opportunities for Single Soldiers; Morale, Welfare, and Recreation.","tags":[],"mc":true,"choices":["Better Opportunities for Single Soldiers; Morale, Welfare, and Recreation.","Battalion Operations for Single Soldiers; Military Welfare and Recreation.","Better Opportunities for Soldier Success; Morale, Wellness, and Readiness.","Basic Opportunities for Single Soldiers; Military, Welfare, and Readiness."]},{"id":"regs-04","section":"regs","category":"Leadership & Policy","q":"What does a flag do?","a":"It suspends favorable personnel actions such as promotion, awards, and schools. AR 600-8-2.","tags":[],"mc":true,"choices":["It suspends favorable personnel actions such as promotion, awards, and schools. AR 600-8-2.","It removes the Soldier from the promotion list permanently. AR 600-8-19.","It records a court-martial on the Soldier's record. AR 27-10.","It marks a Soldier for an award. AR 600-8-22."]},{"id":"regs-05","section":"regs","category":"Leadership & Policy","q":"What article of the UCMJ covers nonjudicial punishment?","a":"Article 15.","tags":[],"mc":true,"choices":["Article 15.","Article 31.","Article 32.","Article 92."]},{"id":"regs-06","section":"regs","category":"Leadership & Policy","q":"What regulation covers leave?","a":"AR 600-8-10. Soldiers earn 2.5 days per month.","tags":[],"mc":true,"choices":["AR 600-8-10. Soldiers earn 2.5 days per month.","AR 600-8-19. Soldiers earn 30 days per quarter.","AR 600-8-10. Soldiers earn 2 days per month.","AR 600-20. Soldiers earn 2.5 days per month."]},{"id":"regs-07","section":"regs","category":"Leadership & Policy","q":"What does a flag do to promotions?","a":"It suspends favorable actions, including promotion. AR 600-8-2.","tags":[],"mc":true,"choices":["It suspends favorable actions, including promotion. AR 600-8-2.","Nothing. Promotions continue while flagged.","It lowers the Soldier's promotion points by half. AR 600-8-19.","It delays promotion by 30 days only. AR 600-8-2."]},{"id":"regs-08","section":"regs","category":"Leadership & Policy","q":"What are the types of discharge?","a":"Administrative: honorable, general, other than honorable. Punitive (court-martial only): bad conduct and dishonorable.","tags":[],"mc":true,"choices":["Administrative: honorable, general, other than honorable. Punitive (court-martial only): bad conduct and dishonorable.","Administrative: honorable, bad conduct, dishonorable. Punitive: general and other than honorable.","Only honorable and dishonorable.","Administrative: honorable, general, entry-level. Punitive: other than honorable only."]},{"id":"regs-09","section":"regs","category":"Leadership & Policy","q":"Can a Soldier be punished for self-referring to ASAP?","a":"Self-referral is encouraged and handled differently from command or test-based referrals. AR 600-85 limited use policy.","tags":["verify"],"mc":true,"choices":["Self-referral is encouraged and handled differently from command or test-based referrals. AR 600-85 limited use policy.","Yes. Any substance referral results in an automatic Article 15.","Yes. Self-referral starts an automatic separation.","No, because ASAP records are destroyed after 30 days."]},{"id":"regs-10","section":"regs","category":"Leadership & Policy","q":"What article covers sexual assault?","a":"Article 120, UCMJ.","tags":[],"mc":true,"choices":["Article 120, UCMJ.","Article 128, UCMJ.","Article 134, UCMJ.","Article 92, UCMJ."]},{"id":"sharp-01","section":"sharp","category":"Leadership & Policy","q":"What regulation covers SHARP?","a":"AR 600-52.","tags":[],"mc":true,"choices":["AR 600-52.","AR 600-20.","AR 600-92.","AR 600-63."]},{"id":"sharp-02","section":"sharp","category":"Leadership & Policy","q":"What are the two reporting options for sexual assault?","a":"Restricted and unrestricted. A SARC or VA explains eligibility and exceptions.","tags":[],"mc":true,"choices":["Restricted and unrestricted. A SARC or VA explains eligibility and exceptions.","Formal and informal. Your squad leader explains the options.","Confidential and anonymous. Your chaplain explains the options.","Restricted and unrestricted. Your commander decides which applies."]},{"id":"sharp-03","section":"sharp","category":"Leadership & Policy","q":"What form records a sexual harassment complaint?","a":"DA Form 7746.","tags":[],"mc":true,"choices":["DA Form 7746.","DA Form 7279.","DA Form 4856.","DA Form 2823."]},{"id":"sharp-04","section":"sharp","category":"Leadership & Policy","q":"What form is used for a formal EO complaint?","a":"DA Form 7279.","tags":[],"mc":true,"choices":["DA Form 7279.","DA Form 7746.","DA Form 2823.","DA Form 4187."]},{"id":"sharp-05","section":"sharp","category":"Leadership & Policy","q":"What does ACE stand for?","a":"Ask, Care, Escort.","tags":[],"mc":true,"choices":["Ask, Care, Escort.","Assess, Comfort, Escort.","Ask, Comfort, Evacuate.","Act, Care, Engage."]},{"id":"sharp-06","section":"sharp","category":"Leadership & Policy","q":"Who is your unit SARC/VA and EOL?","a":"Know the names and where the contact info is posted on the company board.","tags":["local"],"mc":false},{"id":"sharp-07","section":"sharp","category":"Leadership & Policy","q":"Who can take a restricted report?","a":"A SARC, a SHARP VA, or healthcare personnel. AR 600-52 para 3-3.","tags":["verify"],"mc":true,"choices":["A SARC, a SHARP VA, or healthcare personnel. AR 600-52 para 3-3.","Any NCO in the chain of command.","A SARC, a SHARP VA, or the company commander.","Military police or CID."]},{"id":"sharp-08","section":"sharp","category":"Leadership & Policy","q":"What is retaliation?","a":"Taking or threatening adverse action, ostracism or maltreatment against someone for reporting. It's prohibited. AR 600-52 Ch 9.","tags":[],"mc":true,"choices":["Taking or threatening adverse action, ostracism or maltreatment against someone for reporting. It's prohibited. AR 600-52 Ch 9.","Reporting a sexual assault through the chain of command. AR 600-52 Ch 3.","Corrective training given for misconduct. AR 600-20 Ch 4.","Filing a false report. AR 600-52 Ch 2."]},{"id":"sharp-09","section":"sharp","category":"Leadership & Policy","q":"Who is your SHARP representative?","a":"Know your SARC and VA by name and where their info is posted.","tags":["local"],"mc":false},{"id":"sharp-10","section":"sharp","category":"Leadership & Policy","q":"What are the warning signs of suicide?","a":"Talking about death or hopelessness, giving away possessions, withdrawing, increased alcohol use, sudden mood changes, and relationship, legal or financial trouble.","tags":[],"mc":true,"choices":["Talking about death or hopelessness, giving away possessions, withdrawing, increased alcohol use, sudden mood changes, and relationship, legal or financial trouble.","Asking for leave, studying for promotion, and working out more.","Only someone who openly says they want to die.","Being late to formation and failing an AFT."]},{"id":"wear-01","section":"wear","category":"Leadership & Policy","q":"What is the regulation for wear and appearance?","a":"AR 670-1, with wear details in DA Pam 670-1.","tags":[],"mc":true,"choices":["AR 670-1, with wear details in DA Pam 670-1.","AR 600-20, with wear details in DA Pam 600-35.","AR 670-1, with wear details in TC 3-21.5.","DA Pam 670-1, with wear details in AR 600-25."]},{"id":"wear-02","section":"wear","category":"Leadership & Policy","q":"What chapter of AR 670-1 covers grooming?","a":"Chapter 3.","tags":[],"mc":true,"choices":["Chapter 3.","Chapter 1.","Chapter 4.","Chapter 6."]},{"id":"wear-03","section":"wear","category":"Leadership & Policy","q":"What is the facial hair standard?","a":"Clean-shaven in uniform or on duty unless an approved medical exception or religious accommodation applies.","tags":[],"mc":true,"choices":["Clean-shaven in uniform or on duty unless an approved medical exception or religious accommodation applies.","Mustaches and beards are authorized in uniform if neatly trimmed.","Clean-shaven only in garrison. Beards are allowed in the field.","Clean-shaven unless a commander approves a temporary beard."]},{"id":"wear-04","section":"wear","category":"Leadership & Policy","q":"Where do ribbons go on your AGSU coat?","a":"Centered 1/8 inch above the left breast pocket, highest precedence on the wearer's right.","tags":[],"mc":true,"choices":["Centered 1/8 inch above the left breast pocket, highest precedence on the wearer's right.","Centered 1/8 inch above the right breast pocket, highest precedence on the wearer's left.","Centered 1/4 inch above the left breast pocket, highest precedence on the wearer's left.","On the AGSU shirt, centered above the left pocket."]},{"id":"wear-05","section":"wear","category":"Leadership & Policy","q":"What are the three 4ID tactical uniform configurations?","a":"Ivy Duty, Ivy Light, Ivy Ready (4ID Green Book).","tags":[],"mc":true,"choices":["Ivy Duty, Ivy Light, Ivy Ready (4ID Green Book).","Ivy Basic, Ivy Field, Ivy Combat (4ID Green Book).","Ivy Duty, Ivy Field, Ivy Ready (4ID Yellow Book).","Ivy Light, Ivy Heavy, Ivy Ready (4ID Standards Book)."]},{"id":"wear-06","section":"wear","category":"Leadership & Policy","q":"Where is the nameplate worn on your AGSU?","a":"Know the exact answer from DA Pam 670-1 for your uniform and be ready to show it.","tags":["local"],"mc":false},{"id":"wear-07","section":"wear","category":"Leadership & Policy","q":"Can Soldiers wear wireless earbuds in uniform?","a":"Check the current AR 670-1 and Army Directive updates. Don't answer from memory.","tags":["verify"],"mc":false},{"id":"wear-08","section":"wear","category":"Leadership & Policy","q":"Who is responsible for a Soldier's appearance?","a":"The Soldier first, then first-line leaders who inspect and correct.","tags":[],"mc":true,"choices":["The Soldier first, then first-line leaders who inspect and correct.","The first sergeant only.","The company commander.","The unit supply sergeant."]},{"id":"promo-01","section":"promo","category":"Leadership & Policy","q":"What regulation covers enlisted promotions?","a":"AR 600-8-19, Enlisted Promotions and Demotions.","tags":[],"mc":true,"choices":["AR 600-8-19, Enlisted Promotions and Demotions.","AR 600-8-22, Military Awards.","AR 600-8-19, Enlisted Assignments.","AR 623-3, Evaluation Reporting System."]},{"id":"promo-02","section":"promo","category":"Leadership & Policy","q":"What is the ABCP pass standard?","a":"Waist divided by height must be less than 0.550. 0.550 fails. (AD 2026-13)","tags":[],"mc":true,"choices":["Waist divided by height must be less than 0.550. 0.550 fails. (AD 2026-13)","Waist divided by height must be 0.550 or less. Round to two decimals. (AD 2026-13)","Body fat percentage must be under 22%. (AR 600-9)","Waist divided by height must be less than 0.500. (AD 2026-13)"]},{"id":"promo-03","section":"promo","category":"Leadership & Policy","q":"Does a high AFT score exempt a Soldier from ABCP?","a":"No.","tags":[],"mc":true,"choices":["No.","Yes, any score of 540 or higher.","Yes, a combat-standard pass of 350.","Yes, if the Soldier scored 80 or more on every event."]},{"id":"promo-04","section":"promo","category":"Leadership & Policy","q":"What form records the body composition assessment?","a":"DA Form 5500.","tags":[],"mc":true,"choices":["DA Form 5500.","DA Form 5501.","DA Form 705.","DA Form 3349."]},{"id":"promo-05","section":"promo","category":"Leadership & Policy","q":"What's the difference between the primary and secondary zone?","a":"The primary zone has longer TIS and TIG requirements. The secondary zone lets top performers be recommended earlier, at the commander's discretion.","tags":[],"mc":true,"choices":["The primary zone has longer TIS and TIG requirements. The secondary zone lets top performers be recommended earlier, at the commander's discretion.","The secondary zone requires more time in service than the primary zone.","There is no difference. Both have the same TIS and TIG.","The primary zone is for E-5. The secondary zone is for E-6."]},{"id":"promo-06","section":"promo","category":"Leadership & Policy","q":"What system tracks promotion points now?","a":"IPPS-A, the Integrated Personnel and Pay System–Army.","tags":["verify"],"mc":true,"choices":["IPPS-A, the Integrated Personnel and Pay System–Army.","EMILPO, the Electronic Military Personnel Office.","DTMS, the Digital Training Management System.","GCSS-Army."]},{"id":"promo-07","section":"promo","category":"Leadership & Policy","q":"What is the highest award for valor?","a":"The Medal of Honor.","tags":[],"mc":true,"choices":["The Medal of Honor.","The Distinguished Service Cross.","The Silver Star.","The Bronze Star Medal with V device."]},{"id":"promo-08","section":"promo","category":"Leadership & Policy","q":"What form is a recommendation for award?","a":"DA Form 638.","tags":["verify"],"mc":true,"choices":["DA Form 638.","DA Form 4187.","DA Form 2823.","DA Form 4856."]},{"id":"h2f-01","section":"h2f","category":"Fitness & Training","q":"Name the five H2F domains.","a":"Physical, nutritional, mental, spiritual, and sleep readiness.","tags":[],"mc":true,"choices":["Physical, nutritional, mental, spiritual, and sleep readiness.","Physical, nutritional, mental, emotional, and family readiness.","Physical, spiritual, social, mental, and financial readiness.","Strength, endurance, mobility, nutrition, and sleep."]},{"id":"h2f-02","section":"h2f","category":"Fitness & Training","q":"Name the five AFT events.","a":"Deadlift, hand-release push-up, sprint-drag-carry, plank, two-mile run.","tags":[],"mc":true,"choices":["Deadlift, hand-release push-up, sprint-drag-carry, plank, two-mile run.","Deadlift, standing power throw, hand-release push-up, sprint-drag-carry, two-mile run.","Deadlift, hand-release push-up, leg tuck, plank, two-mile run.","Deadlift, push-up, sit-up, sprint-drag-carry, two-mile run."]},{"id":"h2f-03","section":"h2f","category":"Fitness & Training","q":"What's the AFT combat standard?","a":"350 total points with at least 60 on each event.","tags":[],"mc":true,"choices":["350 total points with at least 60 on each event.","300 total points with at least 60 on each event.","350 total points with at least 70 on each event.","360 total points with at least 60 on each event."]},{"id":"h2f-04","section":"h2f","category":"Fitness & Training","q":"Does a CFT failure in November 2026 trigger adverse action?","a":"Not on its own. AD 2026-07 gives a one-year implementation period from 17 Apr 2026.","tags":[],"mc":true,"choices":["Not on its own. AD 2026-07 gives a one-year implementation period from 17 Apr 2026.","Yes. Any CFT failure starts a flag right away.","Yes, after a single retest failure within 30 days.","Not on its own. The implementation period ended on 1 Jan 2026."]},{"id":"h2f-05","section":"h2f","category":"Fitness & Training","q":"What are the last three exercises of the Recovery Drill?","a":"Groin Stretch, Calf Stretch, Hamstring Stretch.","tags":[],"mc":true,"choices":["Groin Stretch, Calf Stretch, Hamstring Stretch.","Calf Stretch, Groin Stretch, Hamstring Stretch.","Single-Leg Over, Calf Stretch, Hamstring Stretch.","Thigh Stretch, Groin Stretch, Hamstring Stretch."]},{"id":"h2f-06","section":"h2f","category":"Fitness & Training","q":"What does H2F stand for?","a":"Holistic Health and Fitness.","tags":[],"mc":true,"choices":["Holistic Health and Fitness.","Holistic Health and Fitness Framework.","Human Health and Fitness.","Health, Hydration and Fitness."]},{"id":"h2f-07","section":"h2f","category":"Fitness & Training","q":"What are the first three Preparation Drill exercises?","a":"Bend and Reach, Rear Lunge, High Jumper.","tags":[],"mc":true,"choices":["Bend and Reach, Rear Lunge, High Jumper.","Bend and Reach, High Jumper, Rear Lunge.","Rear Lunge, Bend and Reach, Windmill.","Bend and Reach, Rower, Squat Bender."]},{"id":"h2f-08","section":"h2f","category":"Fitness & Training","q":"What does the AFT minimum per event mean for you?","a":"As 11B, I need at least 60 on each event and 350 total under the combat standard.","tags":[],"mc":false},{"id":"h2f-09","section":"h2f","category":"Fitness & Training","q":"Who is on the H2F performance team?","a":"Strength coaches, athletic trainers, physical therapists, dietitians, and cognitive performance specialists.","tags":["verify"],"mc":true,"choices":["Strength coaches, athletic trainers, physical therapists, dietitians, and cognitive performance specialists.","Only the unit master fitness trainer.","Drill sergeants and the battalion surgeon.","The company commander and first sergeant."]},{"id":"benefits-01","section":"benefits","category":"Leadership & Policy","q":"A Soldier wants to start college. Where do you send them?","a":"To the Education Center to set up Tuition Assistance through ArmyIgnitED. It's governed by AR 621-5.","tags":[],"mc":true,"choices":["To the Education Center to set up Tuition Assistance through ArmyIgnitED. It's governed by AR 621-5.","To the S1 to request a GI Bill transfer.","To the career counselor to reenlist for college.","To ACS to apply for an AER education loan."]},{"id":"benefits-02","section":"benefits","category":"Leadership & Policy","q":"What does the government contribute under BRS?","a":"1% automatically, plus matching up to 5% total when the Soldier contributes 5% to the TSP.","tags":[],"mc":true,"choices":["1% automatically, plus matching up to 5% total when the Soldier contributes 5% to the TSP.","Nothing until the Soldier reaches 20 years.","A flat 3% automatic contribution with no matching.","1% automatically, plus matching up to 10% total."]},{"id":"benefits-03","section":"benefits","category":"Leadership & Policy","q":"What's the maximum SGLI coverage?","a":"$500,000.","tags":[],"mc":true,"choices":["$500,000.","$400,000.","$250,000.","$1,000,000."]},{"id":"benefits-04","section":"benefits","category":"Leadership & Policy","q":"What does ATC stand for in MRT?","a":"Activatin  make a tentative plan; initiate movement; conduct reconnaissance; complete the plan; issue the order; supervise and refine.","tags":[],"mc":true,"choices":["Receive the mission; issue a WARNORD; make a tentative plan; initiate movement; conduct reconnaissance; complete the plan; issue the order; supervise and refine.","Receive the mission; make a tentative plan; issue a WARNORD; initiate movement; conduct reconnaissance; complete the plan; issue the order; supervise and refine.","Receive the mission; issue a WARNORD; make a tentative plan; conduct reconnaissance; initiate movement; complete the plan; issue the order; supervise and refine.","Receive the mission; issue a WARNORD; make a tentative plan; initiate movement; conduct reconnaissance; issue the order; complete the plan; rehearse."]},{"id":"tactics-02","section":"tactics","category":"Soldier Skills","q":"What are the five paragraphs of an OPORD?","a":"Situation, Mission, Execution, Sustainment, Command and Signal.","tags":[],"mc":true,"choices":["Situation, Mission, Execution, Sustainment, Command and Signal.","Situation, Mission, Execution, Sustainment, Command and Control.","Situation, Mission, Enemy, Support, Command and Signal.","Mission, Situation, Execution, Service Support, Communications."]},{"id":"tactics-03","section":"tactics","category":"Soldier Skills","q":"When do you use bounding overwatch?","a":"When enemy contact is expected.","tags":[],"mc":true,"choices":["When enemy contact is expected.","When enemy contact is unlikely.","When enemy contact is possible.","Only when breaking contact."]},{"id":"tactics-04","section":"tactics","category":"Soldier Skills","q":"What does the U in SALUTE stand for?","a":"Unit.","tags":[],"mc":true,"choices":["Unit.","Uniform.","Unknown.","Unit leader."]},{"id":"tactics-05","section":"tactics","category":"Soldier Skills","q":"What is a WARNORD?","a":"A warning order gives subordinates early information so they can start preparing.","tags":[],"mc":true,"choices": Combat, ambush, and raid patrols.","Reconnaissance, presence, and logistics patrols.","Area, zone, and route patrols."]},{"id":"tactics-11","section":"tactics","category":"Soldier Skills","q":"What are the forms of maneuver?","a":"Envelopment, flank attack, frontal attack, infiltration, penetration, turning movement. ADP 3-90.","tags":["verify"],"mc":true,"choices":["Envelopment, flank attack, frontal attack, infiltration, penetration, turning movement. ADP 3-90.","Attack, defend, delay, withdraw, retreat, retire.","Envelopment, flank attack, frontal attack, raid, ambush, movement to contact.","Wedge, file, column, line, echelon, vee."]},{"id":"tactics-12","section":"tactics","category":"Soldier Skills","q":"What is a team leader's role in a Stryker squad dismount?","a":"Control the fire team, keep it in formation and contact, and execute the squad leader's plan.","tags":[],"mc":false},{"id":"acronyms-01","section":"acronyms","category":"Soldier Skills","q":"What is an ORP?","a":"Objective Rally Point. It's where the unit halts out of sight, sound and small-arms range of the objective to make final preparations.","tags":[],"mc":true,"choices":["Objective Rally Point. It's where the unit halts out of sight, sound and small-arms range of the objective to make final preparations.","Operational Readiness Point. Where vehicles are inspected before the mission.","Objective Reaction Point. Where the unit reacts to contact on the objective.","Objective Rally Point. It's where the unit consolidates after the objective is seized."]},{"id":"acronyms-02","section":"acronyms","category":"Soldier Skills","q":"What's the difference between CASEVAC and MEDEVAC?","a":"MEDEVAC uses a dedicated medical platform with medical care en route. CASEVAC uses any available, non-medical vehicle.","tags":[],"mc":true,"choices":["MEDEVAC uses a dedicated medical platform with medical care en route. CASEVAC uses any available, non-medical vehicle.","They're the same thing.","CASEVAC uses a dedicated medical platform. MEDEVAC uses any available vehicle.","MEDEVAC is for KIA. CASEVAC is for WIA."]},{"id":"acronyms-03","section":"acronyms","category":"Soldier Skills","q":"What is a FRAGORD?","a":"A fragmentary order, which changes an existing order.","tags":[],"mc":true,"choices":["A fragmentary order, which changes an existing order.","A final order, which is the complete five-paragraph order.","A frag grenade order for a direct fire plan.","A warning order sent to start preparation."]},{"id":"acronyms-04","section":"acronyms","category":"Soldier Skills","q":"What does LD stand for?","a":"Line of Departure. It's where the attack begins and is crossed at a set time.","tags":[],"mc":true,"choices":["Line of Departure. It's where the attack begins and is crossed at a set time.","Line of Defense. It's the main defensive line.","Limit of Departure. It's the farthest point of the attack.","Logistics Drop. It's where resupply is delivered."]},{"id":"acronyms-05","section":"acronyms","category":"Soldier Skills","q":"What are PCCs and PCIs?","a":"Pre-combat checks and pre-combat inspections. Leaders confirm Soldiers and equipment are ready before the mission.","tags":[],"mc":true,"choices":["Pre-combat checks and pre-combat inspections. Leaders confirm Soldiers and equipment are ready before the mission.","Personnel Count Checks and Personnel Count Inspections, done at formation.","Post-combat checks and post-combat inspections, done after the mission.","Pre-convoy checks and pre-convoy inspections, done only for vehicles."]},{"id":"acronyms-06","section":"acronyms","category":"Soldier Skills","q":"What is an FPL?","a":"A Final Protective Line: the line where a machine gun's grazing fire stops an enemy assault.","tags":[],"mc":true,"choices":["A Final Protective Line: the line where a machine gun's grazing fire stops an enemy assault.","A Final Phase Line: the last control measure before the objective.","A Fire Planning Line: where indirect fire is plotted.","A Forward Patrol Line: the farthest point a patrol may go."]},{"id":"weapons-01","section":"weapons","category":"Soldier Skills","q":"Name the four functional elements of the shot process.","a":"Stability, aim, control, and movement.","tags":[],"mc":true,"choices":["Stability, aim, control, and movement.","Steady position, aiming, breathing, trigger squeeze.","Stability, aim, breathing, movement.","Stance, aim, control, follow-through."]},{"id":"weapons-02","section":"weapons","category":"Soldier Skills","q":"What are the three phases of the shot process?","a":"Pre-shot, shot, and post-shot.","tags":[],"mc":true,"choices":["Pre-shot, shot, and post-shot.","Load, fire, clear.","Pre-shot, shot, and follow-through.","Aim, fire, assess."]},{"id":"weapons-03","section":"weapons","category":"Soldier Skills","q":"What is the max effective range of the M4 for a point target?","a":"500 meters (area 600 m), per TC 3-22.9.","tags":["verify"],"mc":true,"choices":["500 meters (area 600 m), per TC 3-22.9.","600 meters (area 800 m), per TC 3-22.9.","300 meters (area 500 m), per TC 3-22.9.","550 meters (area 3,600 m), per TC 3-22.9."]},{"id":"weapons-04","section":"weapons","category":"Soldier Skills","q":"How much does the M240B weigh?","a":"27.1 pounds, per TC 3-22.240 Table 2-1.","tags":[],"mc":true,"choices":["27.1 pounds, per TC 3-22.240 Table 2-1.","17 pounds, per TC 3-22.240.","22.3 pounds, per TC 3-22.240.","38 pounds, per TC 3-22.240."]},{"id":"weapons-05","section":"weapons","category":"Soldier Skills","q":"Why verify a range figure against the platform?","a":"Because it varies with weapon variant, firing support (bipod or tripod), ammunition, and configuration.","tags":[],"mc":false},{"id":"weapons-06","section":"weapons","category":"Soldier Skills","q":"What are the four rules of weapon safety?","a":"Treat every weapon as loaded; never point it at anything you don't intend to shoot; keep your finger off the trigger until ready to fire; keep the weapon on safe until you intend t s-02","section":"systems","category":"Soldier Skills","q":"What does TOW stand for?","a":"Tube-launched, Optically tracked, Wire-guided.","tags":[],"mc":true,"choices":["Tube-launched, Optically tracked, Wire-guided.","Tube-launched, Optically targeted, Weapon-guided.","Tactical Ordnance, Wire-guided.","Tube-launched, Ordnance tracked, Wire-guided."]},{"id":"systems-03","section":"systems","category":"Soldier Skills","q":"What is the kill radius of an M67 grenade?","a":"5 meters. The casualty radius is 15 meters.","tags":[],"mc":true,"choices":["5 meters. The casualty radius is 15 meters.","15 meters. The casualty radius is 5 meters.","10 meters. The casualty radius is 30 meters.","5 meters. The casualty radius is 50 meters."]},{"id":"systems-04","section":"systems","category":"Soldier Skills","q":"What is written on the front of a Claymore?","a":"\"FRONT TOWARD ENEMY.\"","tags":[],"mc":true,"choices":["\"FRONT TOWARD ENEMY.\"","\"THIS SIDE TOWARD ENEMY.\"","\"FRONT TOWARDS ENEMY.\"","\"DANGER - FRONT.\""]},{"id":"systems-05","section":"systems","category":"Soldier Skills","q":"What mortar does the Stryker MCV carry?","a":"The M121 120 mm mortar.","tags":[],"mc":true,"choices":["The M121 120 mm mortar.","The M224 60 mm mortar.","The M252 81 mm mortar.","The M120 120 mm towed mortar."]},{"id":"systems-06","section":"systems","category":"Soldier Skills","q":"What's the max effective range of the AT4?","a":"About 300 meters.","tags":[],"mc":true,"choices":["About 300 meters.","About 1,000 meters.","About 2,100 meters.","About 150 meters."]},{"id":"comms-01","section":"comms","category":"Soldier Skills","q":"What does PMCS stand for, and what are the intervals?","a":"Preventive Maintenance Checks and Services. Before, during, after, weekly, and monthly.","tags":[],"mc":true,"choices":["Preventive Maintenance Checks and Services. Before, during, after, weekly, and monthly.","Preventive Maintenance Checks and Services. Daily, weekly, and monthly only.","Primary Maintenance Checks and Schedules. Before and after operation only.","Preventive Maintenance Control System. Weekly and quarterly."]},{"id":"comms-02","section":"comms","category":"Soldier Skills","q":"What form is used to record faults?","a":"DA Form 5988-E. DA Form 2404 is the manual version.","tags":[],"mc":true,"choices":["DA Form 5988-E. DA Form 2404 is the manual version.","DA Form 2062. DA Form 2404 is the electronic version.","DA Form 5988-E. DA Form 2062 is the manual version.","DA Form 2404. DA Form 5988-E is for weapons only."]},{"id":"comms-03","section":"comms","category":"Soldier Skills","q":"What's the difference between ROGER and WILCO?","a":"ROGER means I received it. WILCO means I received it, understand it, and will comply.","tags":[],"mc":true,"choices":["ROGER means I received it. WILCO means I received it, understand it, and will comply.","ROGER means I will comply. WILCO means I received it.","They mean the same thing.","ROGER ends the transmission. WILCO asks for a reply."]},{"id":"comms-04","section":"comms","category":"Soldier Skills","q":"What does PACE stand for?","a":"Primary, Alternate, Contingency, Emergency.","tags":[],"mc":true,"choices":["Primary, Alternate, Contingency, Emergency.","Primary, Alternate, Communications, Emergency.","Plan, Alternate, Contingency, Execute.","Primary, Auxiliary, Contingency, Emergency."]},{"id":"comms-05","section":"comms","category":"Soldier Skills","q":"What is a hand receipt?","a":"DA Form 2062. It shows who is responsible for property.","tags":[],"mc":true,"choices":["DA Form 2062. It shows who is responsible for property.","DA Form 5988-E. It shows equipment faults.","DD Form 200. It shows lost property.","DA Form 2404. It shows inspection results."]},{"id":"comms-06","section":"comms","category":"Soldier Skills","q":"What does SINCGARS stand for?","a":"Single Channel Ground and Airborne Radio System.","tags":[],"mc":true,"choices":["Single Channel Ground and Airborne Radio System.","Single Channel Ground and Air Radio Set.","Secure Integrated Network Communications Ground and Airborne Radio System.","Single Channel Global Area Radio System."]},{"id":"firstaid-01","section":"firstaid","category":"Soldier Skills","q":"What replaced TC 4-02.1?","a":"ATP 4-02.11, Casualty Response, Tactical Combat Casualty Care, and First Aid.","tags":[],"mc":true,"choices":["ATP 4-02.11, Casualty Response, Tactical Combat Casualty Care, and First Aid.","TC 4-02.3, Field Hygiene and Sanitation.","ATP 4-02.2, Medical Evacuation.","FM 4-25.11, First Aid."]},{"id":"firstaid-02","section":"firstaid","category":"Soldier Skills","q":"Name the three phases of TCCC.","a":"Care Under Fire, Tactical Field Care, Tactical Evacuation Care.","tags":[],"mc":true,"choices":["Care Under Fire, Tactical Field Care, Tactical Evacuation Care.","Care Under Fire, Tactical Field Care, Combat Casualty Evacuation Plan.","Self-Aid, Buddy Aid, Combat Lifesaver.","Care Under Fire, Casualty Collection, Medical Evacuation."]},{"id":"firstaid-03","section":"firstaid","category":"Soldier Skills","q":"What does MARCH stand for?","a":"Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head injury.","tags":[],"mc":true,"choices":["Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head injury.","Massive hemorrhage, Airway, Respiration, Casualty evacuation, Head injury.","Mechanism of injury, Airway, Respiration, Circulation, Hydration.","Massive hemorrhage, Assessment, Respiration, Care, Hypothermia."]},{"id":"firstaid-04","section":"firstaid","category":"Soldier Skills","q":"What is line 1 of a 9-line?","a":"Location of the pickup site.","tags":[],"mc":true,"choices":["Location of the pickup site.","Radio frequency, call sign and suffix.","Number of patients by precedence.","Special equipment required."]},{"id":"firstaid-05","section":"firstaid","category":"Soldier Skills","q":"Where do you place a tourniquet in Care Under Fire?","a":"High and tight on the injured limb. ATP 4-02.11.","tags":["verify"],"mc":true,"choices":["High and tight on the injured limb. ATP 4-02.11.","2 to 3 inches above the wound, directly on the skin.","Directly on top of the wound.","Below the wound, toward the hand or foot."]},{"id":"firstaid-06","section":"firstaid","category":"Soldier Skills","q":"What is the most preventable cause of death on the battlefield?","a":"Bleeding from an extremity (massive hemorrhage).","tags":[],"mc":true,"choices":["Bleeding from an extremity (massive hemorrhage).","Tension pneumothorax.","Airway obstruction.","Hypothermia."]},{"id":"firstaid-07","section":"firstaid","category":"Soldier Skills","q":"What's in your IFAK?","a":"Know your issued contents: tourniquet, pressure dressing, hemostatic gauze, nasopharyngeal airway, chest seal, etc.","tags":["local"],"mc":false},{"id":"firstaid-08","section":"firstaid","category":"Soldier Skills","q":"What does precedence A, Urgent, mean?","a":"Evacuate within 1 hour.","tags":[],"mc":true,"choices":["Evacuate within 1 hour.","Evacuate within 2 hours.","Evacuate within 4 hours.","Evacuate within 24 hours."]},{"id":"landnav-01","section":"landnav","category":"Soldier Skills","q":"Name the five major terrain features.","a":"Hill, saddle, valley, ridge, depression.","tags":[],"mc":true,"choices":["Hill, saddle, valley, ridge, depression.","Hill, saddle, valley, ridge, draw.","Hill, spur, valley, ridge, depression.","Hill, saddle, cliff, ridge, depression."]},{"id":"landnav-02","section":"landnav","category":"Soldier Skills","q":"Minor and supplementary?","a":"Minor: draw, spur, cliff. Supplementary: cut, fill.","tags":[],"mc":true,"choices":["Minor: draw, spur, cliff. Supplementary: cut, fill.","Minor: cut, fill, cliff. Supplementary: draw, spur.","Minor: draw, spur, depression. Supplementary: cut, fill.","Minor: saddle, spur, cliff. Supplementary: cut, draw."]},{"id":"landnav-03","section":"landnav","category":"Soldier Skills","q":"An 8-digit grid is accurate to how many meters?","a":"10 meters.","tags":[],"mc":true,"choices":["10 meters.","100 meters.","1 meter.","1,000 meters."]},{"id":"landnav-04","section":"landnav","category":"Soldier Skills","q":"What are the three norths?","a":"True, magnetic, and grid north.","tags":[],"mc":true,"choices":["True, magnetic, and grid north.","True, magnetic, and compass north.","Grid, magnetic, and polar north.","True, grid, and declination north."]},{"id":"landnav-05","section":"landnav","category":"Soldier Skills","q":"What is the scale of a standard military map?","a":"1:50,000.","tags":[],"mc":true,"choices":["1:50,000.","1:25,000.","1:100,000.","1:250,000."]},{"id":"landnav-06","section":"landnav","category":"Soldier Skills","q":"What do you use to determine your location?","a":"Resection, using two or more known points.","tags":[],"mc":false},{"id":"landnav-07","section":"landnav","category":"Soldier Skills","q":"How many mils in a circle?","a":"6,400.","tags":[],"mc":true,"choices":["6,400.","3,600.","6,000.","360."]},{"id":"drill-01","section":"drill","category":"Soldier Skills","q":"What manual covers drill and ceremonies?","a":"TC 3-21.5.","tags":[],"mc":true,"choices":["TC 3-21.5.","FM 3-21.5.","AR 600-25.","TC 7-21.13."]},{"id":"drill-02","section":"drill","category":"Soldier Skills","q":"What regulation covers salutes and honors?","a":"AR 600-25, Salutes, Honors, and Courtesy.","tags":[],"mc":true,"choices":["AR 600-25, Salutes, Honors, and Courtesy.","AR 670-1, Wear and Appearance.","TC 3-21.5, Drill and Ceremonies.","AR 600-20, Army Command Policy."]},{"id":"drill-03","section":"drill","category":"Soldier Skills","q":"What are the two parts of most drill commands?","a":"The preparatory command and the command of execution.","tags":[],"mc":true,"choices":["The preparatory command and the command of execution.","The supplementary command and the directive.","The preparatory command and the combined command.","The command of execution and the directive."]},{"id":"drill-04","section":"drill","category":"Soldier Skills","q":"How long is a quick-time step, and at what cadence?","a":"30 inches at 120 steps per minute.","tags":[],"mc":true,"choices":["30 inches at 120 steps per minute.","30 inches at 180 steps per minute.","15 inches at 120 steps per minute.","36 inches at 120 steps per minute."]},{"id":"drill-05","section":"drill","category":"Soldier Skills","q":"Name the four rest positions.","a":"Parade rest, stand at ease, at ease, rest.","tags":[],"mc":true,"choices":["Parade rest, stand at ease, at ease, rest.","Parade rest, at ease, rest, fall out.","Attention, parade rest, at ease, rest.","Parade rest, stand at ease, rest, fall out."]},{"id":"drill-06","section":"drill","category":"Soldier Skills","q":"When do you not salute?","a":"Indoors (except when formally reporting), in the field or under tactical conditions, or when both hands are full. AR 600-25.","tags":["verify"],"mc":true,"choices":["Indoors (except when formally reporting), in the field or under tactical conditions, or when both hands are full. AR 600-25.","Never inside a vehicle, and never to an NCO.","Only when an officer is in civilian clothes.","Outdoors in uniform when passing an officer."]},{"id":"drill-07","section":"drill","category":"Soldier Skills","q":"What is the double-time cadence?","a":"180 steps per minute, 30 inches.","tags":[],"mc":true,"choices":["180 steps per minute, 30 inches.","120 steps per minute, 30 inches.","180 steps per minute, 15 inches.","160 steps per minute, 36 inches."]},{"id":"unit-01","section":"unit","category":"Unit & History","q":"How was 2-12 Infantry constituted?","a":"On 3 May 1861 in the Regular Army as Company B, 1st Battalion, 12th Infantry. Organized 20 Oct 1861 at Fort Hamilton, New York.","tags":[],"mc":true,"choices":["On 3 May 1861 in the Regular Army as Company B, 1st Battalion, 12th Infantry. Organized 20 Oct 1861 at Fort Hamilton, New York.","On 3 May 1861 in the Regular Army as Company A, 1st Battalion, 12th Infantry. Organized 20 Oct 1861 at Fort Hamilton, New York.","On 14 June 1775 as Company B, 12th Continental Regiment. Organized at Fort Hamilton, New York.","On 10 Dec 1917 as part of the 4th Infantry Division. Organized at Camp Greene, North Carolina."]},{"id":"unit-02","section":"unit","category":"Unit & History","q":"Who is the most recent Medal of Honor recipient from your company?","a":"MAJ (Ret.) Nicholas Dockery, a C Co, 2-12 IN platoon leader in Kapisa Province, Afghanistan. Presented 18 June 2026.","tags":[],"mc":true,"choices":["MAJ (Ret.) Nicholas Dockery, a C Co, 2-12 IN platoon leader in Kapisa Province, Afghanistan. Presented 18 June 2026.","BG Theodore Roosevelt Jr., at Utah Beach. Presented in 1944.","SSG Travis Atkins, a 4ID Soldier in Iraq. Presented in 2019.","SFC Alwyn Cashe, a 3ID Soldier in Iraq. Presented in 2021."]},{"id":"unit-03","section":"unit","category":"Unit & History","q":"What is the 2-12 IN nickname?","a":"Lethal Warriors.","tags":[],"mc":true,"choices":["Lethal Warriors.","Warhorse.","Raiders.","Iron Brigade."]},{"id":"unit-04","section":"unit","category":"Unit & History","q":"What brigade are you in, and what is its nickname?","a":"2nd Stryker Brigade Combat Team, \"Warhorse.\"","tags":[],"mc":true,"choices":["2nd Stryker Brigade Combat Team, \"Warhorse.\"","1st Stryker Brigade Combat Team, \"Raider.\"","2nd Stryker Brigade Combat Team, \"Lethal Warriors.\"","3rd Armored Brigade Combat Team, \"Iron Brigade.\""]},{"id":"unit-05","section":"unit","category":"Unit & History","q":"Why the ivy leaf on the 4ID patch?","a":"\"Ivy\" sounds like the Roman numeral IV. Ivy leaves stand for tenacity and fidelity.","tags":["verify"],"mc":true,"choices":["\"Ivy\" sounds like the Roman numeral IV. Ivy leaves stand for tenacity and fidelity.","The division was founded at Ivy, Virginia.","The ivy leaf stands for the four campaigns of World War I.","It honors the Ivy League officers who formed the division."]},{"id":"unit-06","section":"unit","category":"Unit & History","q":"What makes 4ID unique right now?","a":"It's converting to the Army's only all-Stryker infantry division.","tags":[],"mc":true,"choices":["It's converting to the Army's only all-Stryker infantry division.","It's the Army's only airborne Stryker division.","It's converting to the Army's only all-armored division.","It's the only division based outside the continental U.S."]},{"id":"wars-01","section":"wars","category":"Unit & History","q":"Where did 4ID land on D-Day?","a":"Utah Beach, 6 June 1944. It was the first division ashore there.","tags":[],"mc":true,"choices":["Utah Beach, 6 June 1944. It was the first division ashore there.","Omaha Beach, 6 June 1944. It was the first division ashore there.","Utah Beach, 6 June 1944. It landed in the second wave behind the 1st ID.","Juno Beach, 6 June 1944, with Canadian forces."]},{"id":"wars-02","section":"wars","category":"Unit & History","q":"Who received the Medal of Honor for Utah Beach?","a":"BG Theodore Roosevelt Jr.","tags":[],"mc":true,"choices":["BG Theodore Roosevelt Jr.","GEN Omar Bradley.","BG Norman Cota.","SGT Alvin York."]},{"id":"wars-03","section":"wars","category":"Unit & History","q":"Which 4ID unit captured Saddam Hussein, and when?","a":"4ID Soldiers, near Tikrit, 13 December 2003, during Operation Red Dawn.","tags":[],"mc":true,"choices":["4ID Soldiers, near Tikrit, 13 December 2003, during Operation Red Dawn.","101st Airborne Soldiers, near Baghdad, 13 December 2003, during Operation Iraqi Freedom.","4ID Soldiers, near Tikrit, 13 December 2004, during Operation Desert Fox.","Special Forces Soldiers, near Mosul, 22 July 2003, during Operation Red Dawn."]},{"id":"wars-04","section":"wars","category":"Unit & History","q":"What were 4ID's three infantry regiments in WWII?","a":"The 8th, 12th and 22nd Infantry Regiments.","tags":[],"mc":true,"choices":["The 8th, 12th and 22nd Infantry Regiments.","The 8th, 16th and 22nd Infantry Regiments.","The 12th, 18th and 26th Infantry Regiments.","The 1st, 12th and 22nd Infantry Regiments."]},{"id":"wars-05","section":"wars","category":"Unit & History","q":"What does OEF stand for? OIF?","a":"Operation Enduring Freedom (Afghanistan). Operation Iraqi Freedom (Iraq).","tags":[],"mc":true,"choices":["Operation Enduring Freedom (Afghanistan). Operation Iraqi Freedom (Iraq).","Operation Enduring Freedom (Iraq). Operation Iraqi Freedom (Afghanistan).","Operation Endless Freedom (Afghanistan). Operation Iraqi Force (Iraq).","Operation Enduring Force (Afghanistan). Operation Inherent Freedom (Iraq)."]},{"id":"wars-06","section":"wars","category":"Unit & History","q":"When did the Revolutionary War start?","a":"1775. The Army's birthday is 14 June 1775.","tags":[],"mc":true,"choices":["1775. The Army's birthday is 14 June 1775.","1776. The Army's birthday is 4 July 1776.","1775. The Army's birthday is 10 November 1775.","1781. The Army's birthday is 14 June 1781."]},{"id":"scenarios-01","section":"scenarios","category":"Situational","q":"Your Soldier is late to formation for the second time.","a":"Talk to them privately to find out why. Do event counseling on a DA Form 4856 with a plan of action. Apply corrective training if appropriate. Inform your squad leader. Follow up. If it keeps happening, it moves up the chain.","tags":[],"mc":false},{"id":"scenarios-02","section":"scenarios","category":"Situational","q":"A Soldier from another unit walks past you out of uniform standard.","a":"Make an on-the-spot correction, professionally and respectfully. Every NCO enforces standards, not just the ones in their own unit.","tags":[],"mc":false},{"id":"scenarios-03","section":"scenarios","category":"Situational","q":"Your Soldier failed the AFT.","a":"Find out why: injury, preparation, or effort. Build a plan with them (H2F resources, extra PT). Counsel and document. Follow your chain's policy on flags and retests.","tags":[],"mc":false},{"id":"scenarios-04","section":"scenarios","category":"Situational","q":"Your Soldier failed the ABCP waist-to-height check.","a":"Ma
