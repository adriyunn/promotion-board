s with the education center, finance or ArmyIgnitED before you quote them.</div>\n\n  <h3>Education</h3>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Tuition Assistance (TA)</h4>Pays tuition for off-duty college courses through <b>ArmyIgnitED</b>. It has a per-credit-hour cap and an annual cap. Governed by <b>AR 621-5</b>, the Army Continuing Education System. Start at the installation <b>Education Center</b>.</div>\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Credentialing Assistance (CA)</h4>Pays for civilian certifications and licenses related to your career, also through ArmyIgnitED.</div>\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> GI Bill</h4>The <b>Post-9/11 GI Bill</b> pays for education after qualifying service. It can be transferred to dependents if you meet the service requirements.</div>\n    <div class=\"card\"><h4><span class=\"tag t-bonus\">Bonus</span> SkillBridge</h4>Civilian job training during your last 180 days of service, with commander approval.</div>\n  </div>\n\n  <h3>Pay, retirement &amp; insurance</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>BRS (Blended Retirement System):</b> the Government puts in 1% automatically and matches your <b>Thrift Savings Plan (TSP)</b> contributions up to 4% more, for <b>5% total</b> when you contribute 5%. It also includes a pension after 20 years and continuation pay mid-career. <span class=\"tag t-verify\">Verify</span></div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>SGLI (Servicemembers' Group Life Insurance):</b> low-cost life insurance, maximum <b>$500,000</b>. Keep your beneficiaries current through <b>SOES</b>. <span class=\"tag t-verify\">Verify</span></div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>AER (Army Emergency Relief):</b> no-interest loans and grants for emergencies such as rent, car repair or emergency travel. AR 930-4.</div></div>\n\n  <h3>Support resources</h3>\n  <table>\n    <tr><th style=\"width:28%\">Resource</th><th>What it does</th></tr>\n    <tr><td><b>ACS</b> (Army Community Service)</td><td>Financial readiness, relocation, EFMP, family advocacy, employment readiness</td></tr>\n    <tr><td><b>Chaplain / Unit Ministry Team</b></td><td>Spiritual support and confidential counseling (privileged communication)</td></tr>\n    <tr><td><b>Behavioral Health</b> (Embedded BH)</td><td>Mental health care. Self-referral is encouraged.</td></tr>\n    <tr><td><b>MFLC</b> (Military &amp; Family Life Counselor)</td><td>Short-term, non-medical counseling. No records kept.</td></tr>\n    <tr><td><b>Military OneSource</b></td><td>24/7 phone and online counseling, tax help and resources</td></tr>\n    <tr><td><b>ASAP</b> (Army Substance Abuse Program)</td><td>Prevention and treatment. AR 600-85.</td></tr>\n    <tr><td><b>Military Crisis Line</b></td><td>Dial <b>988, then press 1</b></td></tr>\n    <tr><td><b>BOSS / MWR</b></td><td>Single Soldier programs. Recreation and quality-of-life activities.</td></tr>\n  </table>\n\n  <h3>Resilience: Master Resilience Training (MRT) <span class=\"tag t-verify\">Verify</span></h3>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Six MRT competencies</h4>\n      <div class=\"mnem\"><span><b>1</b>Self-Awareness</span><span><b>2</b>Self-Regulation</span><span><b>3</b>Optimism</span><span><b>4</b>Mental Agility</span><span><b>5</b>Strengths of Character</span><span><b>6</b>Connection</span></div></div>\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Core MRT skills</h4>\n      Hunt the Good Stuff · <b>ATC</b> (Activating event → Thoughts → Consequences) · Avoid Thinking Traps · Detect Icebergs · Energy Management · Problem Solving · Put It in Perspective · Real-Time Resilience · Character Strengths · Assertive Communication · Active Constructive Responding · Effective Praise</div>\n  </div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>The Army's resilience program is <b>R2</b> (Ready and Resilient). MRT is part of it, and so are the <b>H2F</b> mental and spiritual domains.</div></div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">A Soldier wants to start college. Where do you send them?</div><div class=\"a\">To the Education Center to set up Tuition Assistance through ArmyIgnitED. It's governed by AR 621-5.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does the government contribute under BRS?</div><div class=\"a\">1% automatically, plus matching up to 5% total when the Soldier contributes 5% to the TSP.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the maximum SGLI coverage?</div><div class=\"a\">$500,000.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does ATC stand for in MRT?</div><div class=\"a\">Activating event, Thoughts, Consequences.</div></div>\n    <div class=\"qa\"><div class=\"q\">Name the six MRT competencies.</div><div class=\"a\">Self-awareness, self-regulation, optimism, mental agility, strengths of character, connection.</div></div>\n    <div class=\"qa\"><div class=\"q\">Where can a Soldier get confidential counseling with no records?</div><div class=\"a\">The chaplain (privileged communication) or an MFLC.</div></div>\n  </div>\n</div>\n"},{"key":"training","num":13,"title":"Training, Risk Management & CBRN","category":"Fitness & Training","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">13</div><div class=\"txt\"><h2>Training, Risk Management &amp; CBRN</h2><div class=\"why\">Sergeants plan and run training. The board wants to see you can do it safely and to standard.</div></div></div>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>8-Step Training Model <span class=\"tag t-must\">Must know</span></h3>\n      <ol>\n        <li>Plan the training</li>\n        <li>Train and certify leaders</li>\n        <li>Recon the training site</li>\n        <li>Issue the order</li>\n        <li>Rehearse</li>\n        <li>Execute</li>\n        <li>Conduct an After Action Review (AAR)</li>\n        <li>Retrain</li>\n      </ol>\n      <span class=\"small\"><span class=\"tag t-verify\">Verify</span> FM 7-0, Training (14 Jun 2021). ADP 7-0 covers training principles. AR 350-1 is the training regulation.</span>\n\n      <h3>After Action Review <span class=\"tag t-know\">Know</span></h3>\n      <ol>\n        <li>What was supposed to happen?</li>\n        <li>What happened?</li>\n        <li>Why did it happen?</li>\n        <li>What do we sustain, and what do we improve?</li>\n      </ol>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>AARs can be <b>formal</b> or <b>informal</b>. They focus on performance against the standard, not on blaming people.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Crawl–Walk–Run:</b> learn the task, practice it, then perform it under realistic conditions.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div><b>METL</b> = Mission Essential Task List: the tasks the unit must be able to do for its mission. Task proficiency ratings: <b>T</b> (trained), <b>P</b> (practiced), <b>U</b> (untrained). <span class=\"tag t-verify\">Verify</span> FM 7-0.</div></div>\n    </div>\n    <div>\n      <h3>Risk Management: ATP 5-19 <span class=\"tag t-must\">Must know</span></h3>\n      <ol>\n        <li>Identify the hazards</li>\n        <li>Assess the hazards</li>\n        <li>Develop controls and make risk decisions</li>\n        <li>Implement controls</li>\n        <li>Supervise and evaluate</li>\n      </ol>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Document it on <b>DD Form 2977</b>, the Deliberate Risk Assessment Worksheet. Risk levels: <b>Extremely High, High, Medium, Low</b>. <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Safety program: <b>AR 385-10</b>. Range safety: <b>AR 385-63</b>.</div></div>\n\n      <h3>OPSEC: AR 530-1</h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>OPSEC</b> = Operations Security: protecting critical information from adversaries. That includes social media, unit movements, photos, and duty schedules.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>OPSEC process: identify critical information, analyze threats, analyze vulnerabilities, assess risk, apply countermeasures. <span class=\"tag t-verify\">Verify</span></div></div>\n    </div>\n  </div>\n\n  <h3>CBRN: FM 3-11 (10 Apr 2025)</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>CBRN</b> = Chemical, Biological, Radiological, and Nuclear.</div></div>\n  <table>\n    <tr><th>MOPP level <span class=\"tag t-verify\">Verify</span></th><th>Overgarment</th><th>Boots</th><th>Mask</th><th>Gloves</th></tr>\n    <tr><td><b>MOPP Ready</b></td><td colspan=\"4\">Gear is within 2 hours of reach</td></tr>\n    <tr><td><b>MOPP 0</b></td><td colspan=\"4\">Gear is carried or immediately available. Nothing is worn.</td></tr>\n    <tr><td><b>MOPP 1</b></td><td>Worn</td><td>Carried</td><td>Carried</td><td>Carried</td></tr>\n    <tr><td><b>MOPP 2</b></td><td>Worn</td><td>Worn</td><td>Carried</td><td>Carried</td></tr>\n    <tr><td><b>MOPP 3</b></td><td>Worn</td><td>Worn</td><td>Worn</td><td>Carried</td></tr>\n    <tr><td><b>MOPP 4</b></td><td>Worn</td><td>Worn</td><td>Worn</td><td>Worn</td></tr>\n  </table>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>MOPP</b> = Mission Oriented Protective Posture. If you suspect a chemical attack: <b>stop breathing, put on your mask, clear and check it, give the alarm \"GAS, GAS, GAS\"</b>, then go to MOPP 4. You have 9 seconds to mask. <span class=\"tag t-verify\">Verify</span></div></div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Name the 8-step training model.</div><div class=\"a\">Plan; train and certify leaders; recon the site; issue the order; rehearse; execute; conduct the AAR; retrain.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the four parts of an AAR?</div><div class=\"a\">What was supposed to happen, what happened, why it happened, and what to sustain or improve.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the five steps of risk management?</div><div class=\"a\">Identify hazards; assess hazards; develop controls and make risk decisions; implement controls; supervise and evaluate.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form documents a deliberate risk assessment?</div><div class=\"a\">DD Form 2977.</div></div>\n    <div class=\"qa\"><div class=\"q\">What do you wear in MOPP 4?</div><div class=\"a\">Everything: overgarment, boots, mask and gloves.</div></div>\n    <div class=\"qa\"><div class=\"q\">What regulation covers OPSEC?</div><div class=\"a\">AR 530-1.</div></div>\n  </div>\n</div>\n"},{"key":"tactics","num":14,"title":"Infantry Tactics & the Stryker","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">14</div><div class=\"txt\"><h2>Infantry Tactics &amp; the Stryker</h2><div class=\"why\">You're an 11B team leader and former driver. Expect the 1SGs to go deep here.</div></div></div>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>Troop Leading Procedures: ATP 3-21.8 para 2-16</h3>\n      <ol>\n        <li>Receive the mission</li>\n        <li>Issue a warning order (WARNORD)</li>\n        <li>Make a tentative plan</li>\n        <li>Initiate movement</li>\n        <li>Conduct reconnaissance</li>\n        <li>Complete the plan</li>\n        <li>Issue the order</li>\n        <li>Supervise and refine</li>\n      </ol>\n      <h3>Five-paragraph OPORD: para 2-113</h3>\n      <div class=\"mnem\"><span><b>S</b>Situation</span><span><b>M</b>Mission</span><span><b>E</b>Execution</span><span><b>S</b>Sustainment</span><span><b>C</b>Command &amp; Signal</span></div>\n      <p>The <b>mission statement</b> answers who, what, when, where, and why.</p>\n    </div>\n    <div>\n      <h3>METT-TC (I)</h3>\n      <p><b>M</b>ission · <b>E</b>nemy · <b>T</b>errain and weather · <b>T</b>roops and support available · <b>T</b>ime available · <b>C</b>ivil considerations · <b>(I)</b> informational considerations, integrated into the other variables.</p>\n      <h3>OAKOC: terrain analysis (para 2-63)</h3>\n      <p><b>O</b>bservation and fields of fire · <b>A</b>venues of approach · <b>K</b>ey terrain · <b>O</b>bstacles · <b>C</b>over and concealment</p>\n      <h3>SALUTE: spot report (para 1-25)</h3>\n      <p><b>S</b>ize · <b>A</b>ctivity · <b>L</b>ocation · <b>U</b>nit <span class=\"tag t-fixed\">Fixed</span> · <b>T</b>ime · <b>E</b>quipment</p>\n    </div>\n  </div>\n\n  <h3>Movement &amp; patrolling</h3>\n  <table>\n    <tr><th>Technique (para 3-75)</th><th>When</th></tr>\n    <tr><td><b>Traveling</b></td><td>Contact unlikely</td></tr>\n    <tr><td><b>Traveling overwatch</b></td><td>Contact possible</td></tr>\n    <tr><td><b>Bounding overwatch</b></td><td>Contact expected</td></tr>\n  </table>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Five principles of patrolling:</b> Planning, Reconnaissance, Security, Control, Common Sense. ATP 3-21.8 <b>Chapter 7</b> covers patrols. Section III covers combat patrols: raids, ambushes, and security patrols.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Engagement area development (7 steps):</b> identify enemy avenues of approach, determine the enemy scheme of maneuver, decide where to kill the enemy, integrate obstacles, emplace weapons systems, integrate indirect fires, rehearse.</div></div>\n\n  <h3>Team leader tools <span class=\"tag t-new\">New</span></h3>\n  <div class=\"grid3\">\n    <div class=\"card\"><h4>Fire team</h4>4 Soldiers: <b>Team Leader, Automatic Rifleman, Grenadier, Rifleman.</b> The TL leads by example: \"Follow me and do as I do.\" <span class=\"tag t-verify\">Verify</span></div>\n    <div class=\"card\"><h4>Fire command: ADDRAC</h4><b>A</b>lert · <b>D</b>irection · <b>D</b>escription · <b>R</b>ange · <b>A</b>ssignment/method of fire · <b>C</b>ommand to open fire <span class=\"tag t-verify\">Verify</span></div>\n    <div class=\"card\"><h4>Contingency plan: GOTWA</h4><b>G</b>oing · <b>O</b>thers you're taking · <b>T</b>ime you'll be gone · <b>W</b>hat to do if you don't return · <b>A</b>ctions on contact</div>\n    <div class=\"card\"><h4>LACE report</h4><b>L</b>iquid · <b>A</b>mmunition · <b>C</b>asualties · <b>E</b>quipment. Sent up after contact or during consolidation.</div>\n    <div class=\"card\"><h4>Fire team formations</h4><b>Wedge</b> (basic) and <b>file</b>. Squad formations: column, line, file. <span class=\"tag t-verify\">Verify</span></div>\n    <div class=\"card\"><h4>Battle drills</h4>React to contact · Break contact · React to ambush (near/far) · Knock out a bunker · Enter and clear a room · Enter a trench. <span class=\"tag t-verify\">Verify</span> current list in ATP 3-21.8.</div>\n  </div>\n\n  <h3>The Stryker (ICVV) <span class=\"tag t-new\">New</span></h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>ATP 3-21.9</b>, Stryker Infantry Rifle Platoon and Squad (24 Jun 2025), is the Stryker companion to ATP 3-21.8.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>ICVV</b> = Infantry Carrier Vehicle, <b>Double V-Hull</b> (M1256). It's the DVH version of the M1126 ICV. The V-shaped hull deflects IED blast. Crew of <b>2 (driver and vehicle commander)</b>, carrying a <b>9-Soldier infantry squad</b>. Armed with a Remote Weapon Station (M2 .50 cal or Mk 19). <span class=\"tag t-verify\">Verify</span> TM and unit config.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>PMCS:</b> Before, During, After, Weekly, Monthly, per the vehicle's -10 operator TM. Faults go on <b>DA Form 5988-E</b>. Maintenance policy is in <b>DA Pam 750-1</b> (29 Apr 2026). <span class=\"tag t-verify\">Verify</span></div></div>\n  <div class=\"callout c-tip\"><div class=\"ttl\">Use your experience</div>You were a driver. If you're asked about the Stryker, talk about PMCS, dispatch, the 5988-E, and ground guides. \"I've been a driver\" is a strong answer when you can show you know the standard.</div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">List the eight TLPs.</div><div class=\"a\">Receive the mission; issue a WARNORD; make a tentative plan; initiate movement; conduct reconnaissance; complete the plan; issue the order; supervise and refine.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the five paragraphs of an OPORD?</div><div class=\"a\">Situation, Mission, Execution, Sustainment, Command and Signal.</div></div>\n    <div class=\"qa\"><div class=\"q\">When do you use bounding overwatch?</div><div class=\"a\">When enemy contact is expected.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does the U in SALUTE stand for?</div><div class=\"a\">Unit.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is a WARNORD?</div><div class=\"a\">A warning order gives subordinates early information so they can start preparing.</div></div>\n    <div class=\"qa\"><div class=\"q\">What ATP covers the Stryker platoon and squad?</div><div class=\"a\">ATP 3-21.9.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the form for recording vehicle faults?</div><div class=\"a\">DA Form 5988-E.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What are the four steps of a battle drill react to contact?</div><div class=\"a\">React, locate, suppress, and then the leader decides to assault, flank or break contact. <span class=\"tag t-verify\">Verify</span> ATP 3-21.8.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between cover and concealment?</div><div class=\"a\">Cover protects you from fire. Concealment only hides you from observation.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the three types of patrols?</div><div class=\"a\">Combat, reconnaissance, and security patrols. <span class=\"tag t-verify\">Verify</span></div></div>\n    <div class=\"qa\"><div class=\"q\">What are the forms of maneuver?</div><div class=\"a\">Envelopment, flank attack, frontal attack, infiltration, penetration, turning movement. <span class=\"tag t-verify\">Verify</span> ADP 3-90.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is a team leader's role in a Stryker squad dismount?</div><div class=\"a\">Control the fire team, keep it in formation and contact, and execute the squad leader's plan.</div></div>\n  </div>\n</div>\n"},{"key":"acronyms","num":15,"title":"Infantry Acronyms","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">15</div><div class=\"txt\"><h2>Infantry Acronyms</h2><div class=\"why\">If a 1SG says \"What's an ORP?\", give the full term and one line on what it's for.</div></div></div>\n\n  <div class=\"callout c-tip\"><div class=\"ttl\">How to answer</div>\"First Sergeant, ORP stands for Objective Rally Point. It's a point out of sight, sound and small-arms range of the objective, where the unit makes final preparations before actions on the objective.\"</div>\n\n  <div class=\"grid2\">\n  <div>\n  <h3>Control measures &amp; graphics</h3>\n  <table>\n    <tr><th style=\"width:18%\">Term</th><th>Meaning</th></tr>\n    <tr><td><b>AA</b></td><td>Assembly Area</td></tr>\n    <tr><td><b>AO</b></td><td>Area of Operations</td></tr>\n    <tr><td><b>ABF</b></td><td>Attack by Fire (position)</td></tr>\n    <tr><td><b>SBF</b></td><td>Support by Fire (position)</td></tr>\n    <tr><td><b>BP</b></td><td>Battle Position</td></tr>\n    <tr><td><b>EA</b></td><td>Engagement Area</td></tr>\n    <tr><td><b>LD</b></td><td>Line of Departure</td></tr>\n    <tr><td><b>LOA</b></td><td>Limit of Advance</td></tr>\n    <tr><td><b>PL</b></td><td>Phase Line</td></tr>\n    <tr><td><b>PLD</b></td><td>Probable Line of Deployment</td></tr>\n    <tr><td><b>OBJ</b></td><td>Objective</td></tr>\n    <tr><td><b>ORP</b></td><td>Objective Rally Point</td></tr>\n    <tr><td><b>RP</b></td><td>Release Point (or Rally Point)</td></tr>\n    <tr><td><b>SP</b></td><td>Start Point</td></tr>\n    <tr><td><b>TRP</b></td><td>Target Reference Point</td></tr>\n    <tr><td><b>FPL</b></td><td>Final Protective Line</td></tr>\n    <tr><td><b>FPF</b></td><td>Final Protective Fire</td></tr>\n    <tr><td><b>NAI</b></td><td>Named Area of Interest</td></tr>\n    <tr><td><b>LP / OP</b></td><td>Listening Post / Observation Post</td></tr>\n    <tr><td><b>LZ / PZ</b></td><td>Landing Zone / Pickup Zone</td></tr>\n    <tr><td><b>MSR</b></td><td>Main Supply Route</td></tr>\n    <tr><td><b>CP</b></td><td>Command Post (or Checkpoint)</td></tr>\n    <tr><td><b>FLOT</b></td><td>Forward Line of Own Troops</td></tr>\n    <tr><td><b>FEBA</b></td><td>Forward Edge of the Battle Area</td></tr>\n  </table>\n  </div>\n  <div>\n  <h3>Orders, planning &amp; intel</h3>\n  <table>\n    <tr><th style=\"width:18%\">Term</th><th>Meaning</th></tr>\n    <tr><td><b>TLP</b></td><td>Troop Leading Procedures</td></tr>\n    <tr><td><b>OPORD</b></td><td>Operation Order</td></tr>\n    <tr><td><b>WARNORD</b></td><td>Warning Order</td></tr>\n    <tr><td><b>FRAGORD</b></td><td>Fragmentary Order: a change to an existing order</td></tr>\n    <tr><td><b>CONOP</b></td><td>Concept of the Operation</td></tr>\n    <tr><td><b>COA</b></td><td>Course of Action</td></tr>\n    <tr><td><b>CCIR</b></td><td>Commander's Critical Information Requirements</td></tr>\n    <tr><td><b>PIR</b></td><td>Priority Intelligence Requirements</td></tr>\n    <tr><td><b>FFIR</b></td><td>Friendly Force Information Requirements</td></tr>\n    <tr><td><b>EEFI</b></td><td>Essential Elements of Friendly Information</td></tr>\n    <tr><td><b>ROE</b></td><td>Rules of Engagement</td></tr>\n    <tr><td><b>SOI</b></td><td>Signal Operating Instructions</td></tr>\n    <tr><td><b>PCC / PCI</b></td><td>Pre-Combat Checks / Pre-Combat Inspections</td></tr>\n    <tr><td><b>QRF</b></td><td>Quick Reaction Force</td></tr>\n    <tr><td><b>ISR</b></td><td>Intelligence, Surveillance, and Reconnaissance</td></tr>\n    <tr><td><b>BMNT</b></td><td>Beginning of Morning Nautical Twilight</td></tr>\n    <tr><td><b>EENT</b></td><td>End of Evening Nautical Twilight</td></tr>\n    <tr><td><b>TTP</b></td><td>Tactics, Techniques, and Procedures</td></tr>\n  </table>\n\n  <h3>Casualties &amp; reports</h3>\n  <table>\n    <tr><th style=\"width:18%\">Term</th><th>Meaning</th></tr>\n    <tr><td><b>CASEVAC</b></td><td>Casualty Evacuation (non-medical vehicle)</td></tr>\n    <tr><td><b>MEDEVAC</b></td><td>Medical Evacuation (dedicated medical platform)</td></tr>\n    <tr><td><b>CCP</b></td><td>Casualty Collection Point</td></tr>\n    <tr><td><b>KIA / WIA</b></td><td>Killed / Wounded in Action</td></tr>\n    <tr><td><b>EPW</b></td><td>Enemy Prisoner of War. Handle with the <b>5 S's and T</b>: Search, Silence, Segregate, Safeguard, Speed to the rear, Tag. <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>IED / UXO</b></td><td>Improvised Explosive Device / Unexploded Ordnance</td></tr>\n    <tr><td><b>LACE</b></td><td>Liquid, Ammunition, Casualties, Equipment</td></tr>\n    <tr><td><b>SALUTE</b></td><td>Size, Activity, Location, Unit, Time, Equipment</td></tr>\n  </table>\n  </div>\n  </div>\n\n  <h3>Memory aids</h3>\n  <div class=\"grid3\">\n    <div class=\"card\"><h4>METT-TC (I)</h4>Mission, Enemy, Terrain &amp; weather, Troops &amp; support available, Time, Civil considerations, Informational considerations</div>\n    <div class=\"card\"><h4>OAKOC</h4>Observation &amp; fields of fire, Avenues of approach, Key terrain, Obstacles, Cover &amp; concealment</div>\n    <div class=\"card\"><h4>GOTWA</h4>Going, Others, Time, What if I don't return, Actions on contact</div>\n    <div class=\"card\"><h4>ADDRAC</h4>Alert, Direction, Description, Range, Assignment, Control (command to fire)</div>\n    <div class=\"card\"><h4>MARCH</h4>Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head</div>\n    <div class=\"card\"><h4>SMEAC</h4>Situation, Mission, Execution, Admin/Sustainment, Command &amp; Signal: the 5-paragraph OPORD</div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What is an ORP?</div><div class=\"a\">Objective Rally Point. It's where the unit halts out of sight, sound and small-arms range of the objective to make final preparations.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between CASEVAC and MEDEVAC?</div><div class=\"a\">MEDEVAC uses a dedicated medical platform with medical care en route. CASEVAC uses any available, non-medical vehicle.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is a FRAGORD?</div><div class=\"a\">A fragmentary order, which changes an existing order.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does LD stand for?</div><div class=\"a\">Line of Departure. It's where the attack begins and is crossed at a set time.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are PCCs and PCIs?</div><div class=\"a\">Pre-combat checks and pre-combat inspections. Leaders confirm Soldiers and equipment are ready before the mission.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is an FPL?</div><div class=\"a\">A Final Protective Line: the line where a machine gun's grazing fire stops an enemy assault.</div></div>\n  </div>\n</div>\n"},{"key":"weapons","num":16,"title":"Weapons: M4/ACOG, M320, M249, M240B","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">16</div><div class=\"txt\"><h2>Weapons: M4/ACOG, M320, M249, M240B</h2><div class=\"why\">Your weapon, your old weapons, and the platoon's guns. Expect \"tell me about your weapon.\"</div></div></div>\n\n  <div class=\"callout c-verify\"><div class=\"ttl\">Numbers come with a caveat</div>Range, rate, and weight figures change with the weapon variant, ammunition, and mount. The figures below are the standard published ones. Check them against the TC on your issued system. If a board member's number differs, say: <b>\"First Sergeant, per TC 3-22.9 for my weapon, it's... I'll confirm against the TC.\"</b></div>\n\n  <h3>Shot process: TC 3-22.9</h3>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Four functional elements</h4><div class=\"mnem\"><span><b>S</b>Stability</span><span><b>A</b>Aim</span><span><b>C</b>Control</span><span><b>M</b>Movement</span></div></div>\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Three phases</h4><div class=\"mnem\"><span><b>1</b>Pre-shot</span><span><b>2</b>Shot</span><span><b>3</b>Post-shot</span></div></div>\n  </div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Four weapon safety rules:</b> 1) Treat every weapon as loaded. 2) Never point a weapon at anything you don't intend to shoot. 3) Keep your finger straight and off the trigger until you're ready to fire. 4) Keep the weapon on safe until you intend to fire. <span class=\"tag t-verify\">Verify</span> TC 3-22.9.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Cycle of function (8 steps):</b> Feeding, Chambering, Locking, Firing, Unlocking, Extracting, Ejecting, Cocking.</div></div>\n\n  <h3>Weapon data <span class=\"tag t-verify\">Verify</span></h3>\n  <table>\n    <tr><th>Weapon</th><th>Reference</th><th>Max effective (point)</th><th>Max effective (area)</th><th>Max range</th><th>Notes</th></tr>\n    <tr><td><b>M4/M4A1 carbine</b> (yours)</td><td>TC 3-22.9</td><td>500 m</td><td>600 m</td><td>3,600 m</td><td>5.56 mm. Gas-operated, air-cooled, magazine-fed, shoulder-fired.</td></tr>\n    <tr><td><b>M320 grenade launcher</b></td><td>TC 3-22.31</td><td>150 m</td><td>350 m</td><td>400 m</td><td>40 mm low-velocity. Round arms roughly 14–38 m from the muzzle.</td></tr>\n    <tr><td><b>M249 SAW</b></td><td>TC 3-22.249</td><td>600 m bipod / 800 m tripod</td><td>800 m bipod / 1,000 m tripod</td><td>3,600 m</td><td>5.56 mm, belt- or magazine-fed.</td></tr>\n    <tr><td><b>M240B</b></td><td>TC 3-22.240</td><td>800 m (tripod)</td><td>1,800 m (tripod)</td><td>3,725 m</td><td>7.62 mm, <b>27.1 lb</b> (Table 2-1). <span class=\"tag t-must\">Must</span> in your old notes, already checked.</td></tr>\n  </table>\n\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Your optic: ACOG / M150 RCO</h4>\n      <b>M150 Rifle Combat Optic</b> (Trijicon ACOG). <b>4× magnification.</b> Has an illuminated chevron reticle and a <b>bullet drop compensator</b> with stadia lines for ranges out to 800 m. Know how you zero it and the dimensions you zero at. <span class=\"tag t-verify\">Verify</span> TC 3-22.9 optic chapter and the unit's zero standard.</div>\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Malfunctions</h4>\n      Know <b>immediate action</b> and <b>remedial action</b> as written in your current TC. Don't recite older acronyms like \"SPORTS\" unless you know your TC still uses them. Be ready to say what a stoppage, malfunction, and misfire are. <span class=\"tag t-verify\">Verify</span> TC 3-22.9.</div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Name the four functional elements of the shot process.</div><div class=\"a\">Stability, aim, control, and movement.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the three phases of the shot process?</div><div class=\"a\">Pre-shot, shot, and post-shot.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the max effective range of the M4 for a point target?</div><div class=\"a\">500 meters (area 600 m), per TC 3-22.9. <span class=\"tag t-verify\">Verify</span></div></div>\n    <div class=\"qa\"><div class=\"q\">How much does the M240B weigh?</div><div class=\"a\">27.1 pounds, per TC 3-22.240 Table 2-1.</div></div>\n    <div class=\"qa\"><div class=\"q\">Why verify a range figure against the platform?</div><div class=\"a\">Because it varies with weapon variant, firing support (bipod or tripod), ammunition, and configuration.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What are the four rules of weapon safety?</div><div class=\"a\">Treat every weapon as loaded; never point it at anything you don't intend to shoot; keep your finger off the trigger until ready to fire; keep the weapon on safe until you intend to fire.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the 8 steps of the cycle of function?</div><div class=\"a\">Feeding, chambering, locking, firing, unlocking, extracting, ejecting, cocking.</div></div>\n    <div class=\"qa\"><div class=\"q\">What magnification is your ACOG?</div><div class=\"a\">4x (M150 RCO).</div></div>\n    <div class=\"qa\"><div class=\"q\">Tell me about your weapon.</div><div class=\"a\">M4 carbine, 5.56 mm, gas-operated, air-cooled, magazine-fed, shoulder-fired. 500 m point, 600 m area. Your optic and zero. TC 3-22.9.</div></div>\n  </div>\n</div>\n"},{"key":"systems","num":17,"title":"Infantry Weapon Systems","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">17</div><div class=\"txt\"><h2>Infantry Weapon Systems</h2><div class=\"why\">Every weapon in an infantry company and a Stryker battalion. Know what each is for and its basic numbers.</div></div></div>\n\n  <div class=\"callout c-verify\"><div class=\"ttl\">All figures: verify against the TC or TM</div>These are standard published figures, and they vary by model, mount and round. On the board, give the reference along with the number. If you aren't sure: \"First Sergeant, I'd confirm that in TC ___.\"</div>\n\n  <h3>Small arms &amp; machine guns</h3>\n  <table>\n    <tr><th>System</th><th>Caliber</th><th>Max effective range</th><th>Max range</th><th>Key facts</th></tr>\n    <tr><td><b>M4 / M4A1</b> carbine</td><td>5.56 mm</td><td>500 m point / 600 m area</td><td>3,600 m</td><td>TC 3-22.9</td></tr>\n    <tr><td><b>M17 / M18</b> pistol (MHS)</td><td>9 mm</td><td>50 m</td><td>—</td><td>Modular Handgun System, replaced the M9</td></tr>\n    <tr><td><b>XM7</b> rifle (NGSW)</td><td>6.8 mm</td><td>—</td><td>—</td><td>Next Generation Squad Weapon, being fielded to replace the M4 in close-combat units. Know if your unit has it.</td></tr>\n    <tr><td><b>M249</b> SAW</td><td>5.56 mm</td><td>600 m point / 800 m area (bipod)</td><td>3,600 m</td><td>TC 3-22.249. Belt- or magazine-fed.</td></tr>\n    <tr><td><b>XM250</b> (NGSW-AR)</td><td>6.8 mm</td><td>—</td><td>—</td><td>Automatic rifle replacing the M249 in some units</td></tr>\n    <tr><td><b>M110A1</b> SDMR</td><td>7.62 mm</td><td>About 600 m</td><td>—</td><td>Squad Designated Marksman Rifle</td></tr>\n    <tr><td><b>M240B / L</b> MMG</td><td>7.62 mm</td><td>800 m point / 1,800 m area (tripod)</td><td>3,725 m</td><td>TC 3-22.240. M240B weighs 27.1 lb. The M240L is lighter.</td></tr>\n    <tr><td><b>M2A1</b> .50 cal HMG</td><td>.50 cal (12.7 mm)</td><td>About 1,830 m (area)</td><td>About 6,800 m</td><td>\"Ma Deuce.\" Mounted in the Stryker RWS.</td></tr>\n  </table>\n\n  <h3>Grenades, launchers &amp; anti-armor</h3>\n  <table>\n    <tr><th>System</th><th>Type</th><th>Effective range</th><th>Key facts</th></tr>\n    <tr><td><b>M320</b></td><td>40 mm grenade launcher</td><td>150 m point / 350 m area</td><td>TC 3-22.31. Max range about 400 m.</td></tr>\n    <tr><td><b>Mk 19</b></td><td>40 mm automatic grenade launcher</td><td>About 1,500 m point / 2,212 m area</td><td>Belt-fed, high-velocity 40 mm. Mounted in the Stryker RWS.</td></tr>\n    <tr><td><b>M67</b></td><td>Fragmentation hand grenade</td><td>Throw about 40 m</td><td>Kill radius 5 m, casualty radius 15 m. Fuze delay 4–5 seconds.</td></tr>\n    <tr><td><b>M18A1 Claymore</b></td><td>Directional anti-personnel mine</td><td>About 50 m optimum</td><td>About 700 steel balls in a 60° fan. Danger area to the rear. \"FRONT TOWARD ENEMY.\"</td></tr>\n    <tr><td><b>M136 AT4</b></td><td>84 mm, single-shot, disposable</td><td>About 300 m</td><td>Light anti-armor and bunker weapon. Watch the backblast area.</td></tr>\n    <tr><td><b>M3 / M3E1 MAAWS</b></td><td>84 mm recoilless rifle (Carl Gustaf)</td><td>Up to about 1,000 m by round</td><td>Reusable. Multiple round types: HEAT, HE, smoke, illumination.</td></tr>\n    <tr><td><b>FGM-148 Javelin</b></td><td>Anti-tank guided missile</td><td>About 2,500 m (longer with the newer CLU)</td><td>\"Fire and forget.\" <b>Top-attack</b> and <b>direct-attack</b> modes. Has a CLU (Command Launch Unit).</td></tr>\n    <tr><td><b>TOW</b></td><td>Wire-guided anti-tank missile</td><td>About 3,750 m</td><td>Tube-launched, Optically tracked, Wire-guided. On some Stryker ATGM vehicles.</td></tr>\n  </table>\n\n  <h3>Mortars (indirect fire)</h3>\n  <table style=\"width:75%\">\n    <tr><th>System</th><th>Caliber</th><th>Where</th></tr>\n    <tr><td><b>M224</b></td><td>60 mm</td><td>Company</td></tr>\n    <tr><td><b>M252</b></td><td>81 mm</td><td>Battalion</td></tr>\n    <tr><td><b>M120 / M121</b></td><td>120 mm</td><td>Battalion. The <b>M121</b> mounts in the Stryker Mortar Carrier Vehicle (MCV).</td></tr>\n  </table>\n\n  <h3>Stryker family</h3>\n  <table>\n    <tr><th>Variant</th><th>Role</th></tr>\n    <tr><td><b>ICV / ICVV</b></td><td>Infantry Carrier Vehicle, double V-hull (M1256). Carries a 9-Soldier squad. Crew of 2.</td></tr>\n    <tr><td><b>ICV-D \"Dragoon\"</b></td><td>ICV with a 30 mm cannon</td></tr>\n    <tr><td><b>MCV</b></td><td>Mortar Carrier Vehicle (120 mm)</td></tr>\n    <tr><td><b>ATGM</b></td><td>Anti-Tank Guided Missile vehicle (TOW)</td></tr>\n    <tr><td><b>CV</b></td><td>Commander's Vehicle</td></tr>\n    <tr><td><b>FSV</b></td><td>Fire Support Vehicle</td></tr>\n    <tr><td><b>ESV</b></td><td>Engineer Squad Vehicle</td></tr>\n    <tr><td><b>MEV</b></td><td>Medical Evacuation Vehicle</td></tr>\n    <tr><td><b>RV</b></td><td>Reconnaissance Vehicle</td></tr>\n    <tr><td><b>NBCRV</b></td><td>Nuclear, Biological, Chemical Reconnaissance Vehicle</td></tr>\n  </table>\n  <span class=\"small\"><span class=\"tag t-local\">Local</span> Know which variants your battalion actually has, and whether your ICVs carry the M2 or the Mk 19.</span>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What are the two attack modes of the Javelin?</div><div class=\"a\">Top attack and direct attack.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does TOW stand for?</div><div class=\"a\">Tube-launched, Optically tracked, Wire-guided.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the kill radius of an M67 grenade?</div><div class=\"a\">5 meters. The casualty radius is 15 meters.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is written on the front of a Claymore?</div><div class=\"a\">\"FRONT TOWARD ENEMY.\"</div></div>\n    <div class=\"qa\"><div class=\"q\">What mortar does the Stryker MCV carry?</div><div class=\"a\">The M121 120 mm mortar.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the max effective range of the AT4?</div><div class=\"a\">About 300 meters.</div></div>\n  </div>\n</div>\n"},{"key":"comms","num":18,"title":"Communications & Maintenance","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">18</div><div class=\"txt\"><h2>Communications &amp; Maintenance</h2><div class=\"why\">A team leader keeps the radio working and the vehicle up. As a former driver, this is ground you can own.</div></div></div>\n\n  <h3>Phonetic alphabet <span class=\"tag t-must\">Must know</span></h3>\n  <div class=\"mnem\">\n    <span><b>A</b>Alpha</span><span><b>B</b>Bravo</span><span><b>C</b>Charlie</span><span><b>D</b>Delta</span><span><b>E</b>Echo</span><span><b>F</b>Foxtrot</span><span><b>G</b>Golf</span><span><b>H</b>Hotel</span><span><b>I</b>India</span><span><b>J</b>Juliett</span><span><b>K</b>Kilo</span><span><b>L</b>Lima</span><span><b>M</b>Mike</span>\n    <span><b>N</b>November</span><span><b>O</b>Oscar</span><span><b>P</b>Papa</span><span><b>Q</b>Quebec</span><span><b>R</b>Romeo</span><span><b>S</b>Sierra</span><span><b>T</b>Tango</span><span><b>U</b>Uniform</span><span><b>V</b>Victor</span><span><b>W</b>Whiskey</span><span><b>X</b>X-ray</span><span><b>Y</b>Yankee</span><span><b>Z</b>Zulu</span>\n  </div>\n  <p class=\"small\">Numbers are spoken digit by digit. Nine is \"<b>niner</b>.\"</p>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>Prowords <span class=\"tag t-know\">Know</span></h3>\n      <table>\n        <tr><th>Proword</th><th>Meaning</th></tr>\n        <tr><td><b>OVER</b></td><td>My transmission is ended and I expect a response.</td></tr>\n        <tr><td><b>OUT</b></td><td>My transmission is ended and I expect no response.</td></tr>\n        <tr><td><b>ROGER</b></td><td>I have received your last transmission satisfactorily.</td></tr>\n        <tr><td><b>WILCO</b></td><td>I have received your message, understand it, and will comply.</td></tr>\n        <tr><td><b>SAY AGAIN</b></td><td>Repeat all of your last transmission. (Never \"repeat,\" which is an artillery term.)</td></tr>\n        <tr><td><b>I SAY AGAIN</b></td><td>I'm repeating my transmission.</td></tr>\n        <tr><td><b>BREAK</b></td><td>I'm separating parts of the message.</td></tr>\n        <tr><td><b>WAIT</b> / <b>WAIT OUT</b></td><td>Pause a few seconds / I'll call you back.</td></tr>\n        <tr><td><b>CORRECTION</b></td><td>I made an error. The correct version follows.</td></tr>\n        <tr><td><b>RADIO CHECK</b></td><td>What is my signal strength and readability?</td></tr>\n      </table>\n      <div class=\"callout c-fix\"><div class=\"ttl\">Never say \"Over and out\"</div>OVER asks for a reply. OUT ends with no reply. Together they contradict each other.</div>\n    </div>\n    <div>\n      <h3>Radios <span class=\"tag t-verify\">Verify</span></h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>SINCGARS</b> = Single Channel Ground and Airborne Radio System. VHF-FM, frequency hopping. Being replaced by newer handheld and manpack radios such as the AN/PRC-163 and AN/PRC-117G.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>SOI</b> (Signal Operating Instructions) give the frequencies, call signs, challenge and password.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>PACE plan:</b> Primary, Alternate, Contingency, Emergency methods of communication.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Radio check reply:</b> \"Lima Charlie\" means Loud and Clear.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div><b>COMSEC</b> = Communications Security. Never send classified or sensitive info in the clear.</div></div>\n      <span class=\"small\"><span class=\"tag t-local\">Local</span> Know the radios in your vehicle and your platoon's call signs.</span>\n    </div>\n  </div>\n\n  <h3>Maintenance</h3>\n  <div class=\"grid2\">\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>PMCS</b> = Preventive Maintenance Checks and Services. Intervals: <b>Before, During, After</b> operation, plus <b>Weekly</b> and <b>Monthly</b>. Done from the operator's <b>-10 TM</b>.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>DA Form 5988-E</b> = Equipment Maintenance and Inspection Worksheet, generated from GCSS-Army. <b>DA Form 2404</b> = the manual version.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Two maintenance levels:</b> <b>Field</b> (operator/crew and unit maintainers) and <b>Sustainment</b> (depot and repair-and-return). <span class=\"tag t-verify\">Verify</span> DA Pam 750-1.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>GCSS-Army</b> = Global Combat Support System–Army: the system for maintenance and supply.</div></div>\n    </div>\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Deadline (NMC):</b> a fault that makes the vehicle Not Mission Capable. It can't be dispatched until fixed.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Dispatch:</b> PMCS done, faults recorded, a licensed operator, and a dispatch issued before the vehicle moves.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Ground guides:</b> required when backing up, in motor pools, in assembly areas, and in congested areas. Two ground guides for tracked or large vehicles when backing. <span class=\"tag t-verify\">Verify</span> unit SOP.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Property:</b> <b>DA Form 2062</b> = hand receipt. <b>DD Form 200</b> = Financial Liability Investigation of Property Loss (FLIPL). Policy: <b>AR 735-5</b>.</div></div>\n    </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What does PMCS stand for, and what are the intervals?</div><div class=\"a\">Preventive Maintenance Checks and Services. Before, during, after, weekly, and monthly.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form is used to record faults?</div><div class=\"a\">DA Form 5988-E. DA Form 2404 is the manual version.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between ROGER and WILCO?</div><div class=\"a\">ROGER means I received it. WILCO means I received it, understand it, and will comply.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does PACE stand for?</div><div class=\"a\">Primary, Alternate, Contingency, Emergency.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is a hand receipt?</div><div class=\"a\">DA Form 2062. It shows who is responsible for property.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does SINCGARS stand for?</div><div class=\"a\">Single Channel Ground and Airborne Radio System.</div></div>\n  </div>\n</div>\n"},{"key":"firstaid","num":19,"title":"First Aid, TCCC & 9-Line","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">19</div><div class=\"txt\"><h2>First Aid, TCCC &amp; 9-Line</h2><div class=\"why\">Your 1SGs will expect a team leader to know how to keep a Soldier alive.</div></div></div>\n\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>ATP 4-02.11</b>, Casualty Response, Tactical Combat Casualty Care, and First Aid (23 Mar 2026). It <b>superseded TC 4-02.1</b>.</div></div>\n  <div class=\"grid3\">\n    <div class=\"card dark\"><h4>1 · Care Under Fire</h4>Return fire and win the fight. Move the casualty to cover. Direct them to self-aid. A tourniquet for life-threatening extremity bleeding is the only treatment under fire. <span class=\"tag t-verify\">Verify</span></div>\n    <div class=\"card dark\"><h4>2 · Tactical Field Care</h4>You're no longer under effective fire. Assess and treat with <b>MARCH</b>. <span class=\"tag t-verify\">Verify</span></div>\n    <div class=\"card dark\"><h4>3 · Tactical Evacuation Care</h4>Care while the casualty is moved to a higher level of care. <span class=\"tag t-fixed\">Fixed</span> This is not the \"evac plan.\"</div>\n  </div>\n  <div class=\"mnem\" style=\"margin-top:8px\"><span><b>M</b>Massive hemorrhage</span><span><b>A</b>Airway</span><span><b>R</b>Respiration</span><span><b>C</b>Circulation</span><span><b>H</b>Hypothermia / Head injury</span></div>\n  <span class=\"small\">MARCH is the standard TCCC assessment sequence. <span class=\"tag t-verify\">Verify</span> against ATP 4-02.11 and your unit's medical training.</span>\n\n  <div class=\"callout c-fix\"><div class=\"ttl\">Medical answers follow current medical training</div>Don't work out a treatment from a mnemonic. Rehearse IFAK contents and casualty transfer with your platoon medic. Know where your IFAK and both tourniquets are on your kit (4ID Ivy Ready).</div>\n\n  <h3>9-Line MEDEVAC request <span class=\"tag t-verify\">Verify</span></h3>\n  <table>\n    <tr><th style=\"width:8%\">Line</th><th>Content</th><th style=\"width:8%\">Line</th><th>Content</th></tr>\n    <tr><td>1</td><td>Location of pickup site (grid)</td><td>6</td><td>Security at pickup site (wartime) / Number and type of wound (peacetime)</td></tr>\n    <tr><td>2</td><td>Radio frequency, call sign, suffix</td><td>7</td><td>Method of marking the pickup site</td></tr>\n    <tr><td>3</td><td>Number of patients by precedence</td><td>8</td><td>Patient nationality and status</td></tr>\n    <tr><td>4</td><td>Special equipment required</td><td>9</td><td>CBRN contamination (wartime) / Terrain description (peacetime)</td></tr>\n    <tr><td>5</td><td>Number of patients by type (litter / ambulatory)</td><td></td><td></td></tr>\n  </table>\n  <table style=\"width:75%\">\n    <tr><th>Precedence</th><th>Evacuate within</th></tr>\n    <tr><td><b>A</b> – Urgent</td><td>1 hour</td></tr>\n    <tr><td><b>B</b> – Urgent-Surgical</td><td>1 hour</td></tr>\n    <tr><td><b>C</b> – Priority</td><td>4 hours</td></tr>\n    <tr><td><b>D</b> – Routine</td><td>24 hours</td></tr>\n    <tr><td><b>E</b> – Convenience</td><td>As convenient</td></tr>\n  </table>\n  <span class=\"small\">Your old guide held back the exact 9-line wording pending source checks. These are the long-standing lines and precedence categories. Check them against ATP 4-02.11 or the unit SOI before you recite them as the 2026 standard.</span>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What replaced TC 4-02.1?</div><div class=\"a\">ATP 4-02.11, Casualty Response, Tactical Combat Casualty Care, and First Aid.</div></div>\n    <div class=\"qa\"><div class=\"q\">Name the three phases of TCCC.</div><div class=\"a\">Care Under Fire, Tactical Field Care, Tactical Evacuation Care.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does MARCH stand for?</div><div class=\"a\">Massive hemorrhage, Airway, Respiration, Circulation, Hypothermia/Head injury.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is line 1 of a 9-line?</div><div class=\"a\">Location of the pickup site.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Where do you place a tourniquet in Care Under Fire?</div><div class=\"a\">High and tight on the injured limb. <span class=\"tag t-verify\">Verify</span> ATP 4-02.11.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the most preventable cause of death on the battlefield?</div><div class=\"a\">Bleeding from an extremity (massive hemorrhage).</div></div>\n    <div class=\"qa\"><div class=\"q\">What's in your IFAK?</div><div class=\"a\">Know your issued contents: tourniquet, pressure dressing, hemostatic gauze, nasopharyngeal airway, chest seal, etc. <span class=\"tag t-local\">Local</span></div></div>\n    <div class=\"qa\"><div class=\"q\">What does precedence A, Urgent, mean?</div><div class=\"a\">Evacuate within 1 hour.</div></div>\n  </div>\n</div>\n"},{"key":"landnav","num":20,"title":"Land Navigation","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">20</div><div class=\"txt\"><h2>Land Navigation</h2><div class=\"why\">TC 3-25.26, Map Reading and Land Navigation (15 Nov 2013). Not FM 3-25.26.</div></div></div>\n\n  <div class=\"grid3\">\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> 5 Major</h4>Hill · Saddle · Valley · Ridge · Depression<br><span class=\"small\">Cue: \"Hidden Valley Ranch Salad Dressing\" (different order, same 5).</span></div>\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> 3 Minor</h4>Draw · Spur · Cliff</div>\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> 2 Supplementary</h4>Cut · Fill</div>\n  </div>\n\n  <h3>Map colors <span class=\"tag t-verify\">Verify</span></h3>\n  <table>\n    <tr><th>Color</th><th>Shows</th></tr>\n    <tr><td><b>Black</b></td><td>Cultural (man-made) features other than roads</td></tr>\n    <tr><td><b>Red-Brown</b></td><td>On newer maps: combined cultural, relief, and elevation features (contour lines readable under red light)</td></tr>\n    <tr><td><b>Blue</b></td><td>Water: lakes, rivers, swamps</td></tr>\n    <tr><td><b>Green</b></td><td>Vegetation with military significance: woods, orchards</td></tr>\n    <tr><td><b>Brown</b></td><td>Relief features and elevation (contours on older maps)</td></tr>\n    <tr><td><b>Red</b></td><td>Cultural features: populated areas, main roads, boundaries (older maps)</td></tr>\n    <tr><td><b>Other</b></td><td>Special information, explained in the marginal information</td></tr>\n  </table>\n\n  <div class=\"grid2\">\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Three norths:</b> True, Magnetic, Grid. The <b>declination diagram</b> shows the angles between them.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Grid precision:</b> 6-digit = 100 m. <b>8-digit = 10 m.</b> Read <b>right, then up</b>.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Contour lines:</b> Index (heavier, numbered), Intermediate, Supplementary (dashed).</div></div>\n    </div>\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Lensatic compass:</b> 360 degrees or 6400 mils. Holding techniques: <b>center-hold</b> and <b>compass-to-cheek</b>.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Intersection</b> finds an unknown point using two known points. <b>Resection</b> finds your own location using two or more known points.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>Standard military map scale: <b>1:50,000</b>. Know your own <b>pace count</b> per 100 m.</div></div>\n    </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Name the five major terrain features.</div><div class=\"a\">Hill, saddle, valley, ridge, depression.</div></div>\n    <div class=\"qa\"><div class=\"q\">Minor and supplementary?</div><div class=\"a\">Minor: draw, spur, cliff. Supplementary: cut, fill.</div></div>\n    <div class=\"qa\"><div class=\"q\">An 8-digit grid is accurate to how many meters?</div><div class=\"a\">10 meters.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the three norths?</div><div class=\"a\">True, magnetic, and grid north.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What is the scale of a standard military map?</div><div class=\"a\">1:50,000.</div></div>\n    <div class=\"qa\"><div class=\"q\">What do you use to determine your location?</div><div class=\"a\">Resection, using two or more known points.</div></div>\n    <div class=\"qa\"><div class=\"q\">How many mils in a circle?</div><div class=\"a\">6,400.</div></div>\n  </div>\n</div>\n"},{"key":"drill","num":21,"title":"Drill, Ceremony & Customs","category":"Soldier Skills","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">21</div><div class=\"txt\"><h2>Drill, Ceremony &amp; Customs</h2><div class=\"why\">TC 3-21.5 (3 May 2021) and AR 600-25 (1 May 2026).</div></div></div>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>Drill <span class=\"tag t-verify\">Verify</span></h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Most commands have two parts: <b>preparatory command</b> (\"Forward\") and <b>command of execution</b> (\"MARCH\").</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Types of commands:</b> two-part, combined, supplementary, directives.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Rest positions at the halt:</b> Parade Rest, Stand at Ease, At Ease, Rest.</div></div>\n      <table>\n        <tr><th>Step</th><th>Length</th><th>Cadence</th></tr>\n        <tr><td>Quick time</td><td>30 in</td><td>120 steps/min</td></tr>\n        <tr><td>Double time</td><td>30 in</td><td>180 steps/min</td></tr>\n        <tr><td>Half step</td><td>15 in</td><td>120 steps/min</td></tr>\n        <tr><td>Side / back step</td><td>15 in</td><td>120 steps/min</td></tr>\n      </table>\n    </div>\n    <div>\n      <h3>Customs &amp; courtesies <span class=\"tag t-verify\">Verify</span></h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Salute</b> commissioned and warrant officers, the Medal of Honor recipient, the flag during the anthem or colors, and during reveille and retreat.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Generally no salute:</b> indoors (except when formally reporting), in the field or under tactical conditions, when both hands are full, or when the act would be impractical. Follow AR 600-25.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Reveille and retreat:</b> face the flag (or the sound of music), stand at attention, and salute on the first note. In a vehicle, stop and sit at attention.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>When an NCO addresses you: stand at <b>parade rest</b> for a senior NCO and answer \"Sergeant\" or \"First Sergeant.\"</div></div>\n      <div class=\"callout c-fix\"><div class=\"ttl\">Withheld</div>Your old notes listed holiday gun-salute numbers and indoor-salute exceptions with no source. Don't memorize those. If asked, cite AR 600-25.</div>\n    </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What manual covers drill and ceremonies?</div><div class=\"a\">TC 3-21.5.</div></div>\n    <div class=\"qa\"><div class=\"q\">What regulation covers salutes and honors?</div><div class=\"a\">AR 600-25, Salutes, Honors, and Courtesy.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the two parts of most drill commands?</div><div class=\"a\">The preparatory command and the command of execution.</div></div>\n    <div class=\"qa\"><div class=\"q\">How long is a quick-time step, and at what cadence?</div><div class=\"a\">30 inches at 120 steps per minute.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Name the four rest positions.</div><div class=\"a\">Parade rest, stand at ease, at ease, rest.</div></div>\n    <div class=\"qa\"><div class=\"q\">When do you not salute?</div><div class=\"a\">Indoors (except when formally reporting), in the field or under tactical conditions, or when both hands are full. <span class=\"tag t-verify\">Verify</span> AR 600-25.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the double-time cadence?</div><div class=\"a\">180 steps per minute, 30 inches.</div></div>\n  </div>\n</div>\n"},{"key":"unit","num":22,"title":"4ID, 2SBCT & 2-12 IN","category":"Unit & History","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">22</div><div class=\"txt\"><h2>4ID, 2SBCT &amp; 2-12 IN</h2><div class=\"why\">The CSM and all four 1SGs are 2-12. Unit pride questions are almost guaranteed.</div></div></div>\n\n  <div class=\"callout c-gold\"><div class=\"ttl\">Medal of Honor: Company C, 2-12 Infantry</div>\n    On <b>18 June 2026</b>, President Trump presented the <b>Medal of Honor</b> to <b>MAJ (Ret.) Nicholas Dockery</b> at the White House. He was a <b>Platoon Leader in Company C, 2nd Battalion, 12th Infantry Regiment</b>, in <b>Kapisa Province, Afghanistan</b>. The award upgraded his Silver Star. He led a counterattack to clear a courtyard and shielded a Soldier from an enemy grenade blast.<br>\n    <b>That's your company. Expect this question.</b> <span class=\"tag t-verify\">Verify</span> the date of action and the exact citation wording at army.mil/medalofhonor/dockery.\n  </div>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>2nd Battalion, 12th Infantry: \"Lethal Warriors\"</h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Constituted 3 May 1861</b> in the Regular Army as <b>Company B, 1st Battalion, 12th Infantry</b>. <b>Organized 20 October 1861 at Fort Hamilton, New York.</b> <span class=\"tag t-fixed\">Fixed</span> Your old notes had 1-12's lineage (Company A). <span class=\"tag t-verify\">Verify</span> the official CMH lineage certificate.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Nickname: <b>\"Lethal Warriors.\"</b> Reorganized as a <b>Stryker battalion</b> under <b>2SBCT, 4ID</b> in 2021, alongside 1-12 IN.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Recent missions: Joint Task Force-Southern Border (2025). NTC rotation at Fort Irwin, CA, including a Javelin FTX (Jul 2026).</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>12th Infantry coat of arms: the <b>sea lion</b> comes from the arms of the Philippine Islands. The crest commemorates the capture of a Spanish flag at <b>El Caney</b> (1898). Motto: <span class=\"tag t-local\">Local</span> confirm it with the battalion. Sources disagree.</div></div>\n    </div>\n    <div>\n      <h3>4th Infantry Division: \"Ivy Division\"</h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>Motto: <b>\"Steadfast and Loyal.\"</b> Nicknames: <b>\"Ivy\"</b> (from the Roman numeral IV) and <b>\"Iron Horse.\"</b> <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Organized in <b>December 1917 at Camp Greene, North Carolina</b> for World War I. <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>WWII: landed first at <b>Utah Beach, 6 June 1944</b>. <b>BG Theodore Roosevelt Jr.</b> received the Medal of Honor for his leadership there. The CG spoke at the Utah Beach ceremony on 6 June 2026.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Iraq: 4ID units captured <b>Saddam Hussein</b> on 13 Dec 2003 (Operation Red Dawn).</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Transformation: 4ID is converting to the Army's <b>only all-Stryker infantry division</b>. The 3rd Armored Brigade (\"Iron Brigade\") is converting to Strykers.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Brigade: <b>2nd Stryker Brigade Combat Team, \"Warhorse.\"</b></div></div>\n    </div>\n  </div>\n\n  <h3>4ID standards</h3>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> IVY READY</h4>\n      <div class=\"mnem\"><span><b>R</b>Respect</span><span><b>E</b>Experts</span><span><b>A</b>Athlete</span><span><b>D</b>Discipline</span><span><b>Y</b>You</span></div>\n      <span class=\"small\">From the 4ID standards book. It's a division source, not Army-wide.</span></div>\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> IVY FOUR</h4>\n      <ol><li>Physical Fitness</li><li>Marksmanship</li><li>Small Unit Drills</li><li>Medical Proficiency</li></ol></div>\n  </div>\n  <div class=\"callout c-local\"><div class=\"ttl\">Local check list</div><b>IVY 7</b> (not in your source; get it from the unit) · battalion and brigade campaign streamers and honors · CSM and commander philosophy · battalion crest meaning · company nickname/motto · current policy letters (4ID policy letters page).</div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">How was 2-12 Infantry constituted?</div><div class=\"a\">On 3 May 1861 in the Regular Army as Company B, 1st Battalion, 12th Infantry. Organized 20 Oct 1861 at Fort Hamilton, New York.</div></div>\n    <div class=\"qa\"><div class=\"q\">Who is the most recent Medal of Honor recipient from your company?</div><div class=\"a\">MAJ (Ret.) Nicholas Dockery, a C Co, 2-12 IN platoon leader in Kapisa Province, Afghanistan. Presented 18 June 2026.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What is the 2-12 IN nickname?</div><div class=\"a\">Lethal Warriors.</div></div>\n    <div class=\"qa\"><div class=\"q\">What brigade are you in, and what is its nickname?</div><div class=\"a\">2nd Stryker Brigade Combat Team, \"Warhorse.\"</div></div>\n    <div class=\"qa\"><div class=\"q\">Why the ivy leaf on the 4ID patch?</div><div class=\"a\">\"Ivy\" sounds like the Roman numeral IV. Ivy leaves stand for tenacity and fidelity. <span class=\"tag t-verify\">Verify</span></div></div>\n    <div class=\"qa\"><div class=\"q\">What makes 4ID unique right now?</div><div class=\"a\">It's converting to the Army's only all-Stryker infantry division.</div></div>\n  </div>\n</div>\n"},{"key":"wars","num":23,"title":"Major Wars & Unit Combat History","category":"Unit & History","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">23</div><div class=\"txt\"><h2>Major Wars &amp; Unit Combat History</h2><div class=\"why\">The Army's major wars, and where 4ID and the 12th Infantry fought in each.</div></div></div>\n\n  <h3>America's major wars</h3>\n  <table>\n    <tr><th style=\"width:26%\">War</th><th style=\"width:14%\">Years (U.S.)</th><th>Key facts for the board</th></tr>\n    <tr><td><b>Revolutionary War</b></td><td>1775–1783</td><td>The Army (Continental Army) was born on <b>14 June 1775</b>. Von Steuben's Blue Book defined NCO duties.</td></tr>\n    <tr><td><b>War of 1812</b></td><td>1812–1815</td><td>Against Britain. The defense of Fort McHenry inspired \"The Star-Spangled Banner.\"</td></tr>\n    <tr><td><b>Mexican-American War</b></td><td>1846–1848</td><td>Many Civil War leaders first saw combat here.</td></tr>\n    <tr><td><b>Civil War</b></td><td>1861–1865</td><td>The bloodiest U.S. war. The <b>Medal of Honor</b> was created (Army version 1862). The <b>12th Infantry was constituted in 1861.</b></td></tr>\n    <tr><td><b>Spanish-American War</b></td><td>1898</td><td>Cuba and the Philippines. 12th Infantry at <b>El Caney</b>.</td></tr>\n    <tr><td><b>Philippine-American War</b></td><td>1899–1902</td><td>12th Infantry served in the Philippines. The sea lion on the regimental crest comes from this.</td></tr>\n    <tr><td><b>World War I</b></td><td>1917–1918</td><td>4ID organized in Dec 1917. Fought in the Aisne-Marne, St. Mihiel and Meuse-Argonne campaigns.</td></tr>\n    <tr><td><b>World War II</b></td><td>1941–1945</td><td><b>4ID landed first at Utah Beach, 6 June 1944 (D-Day).</b> Fought at Cherbourg, the Hürtgen Forest and the Battle of the Bulge.</td></tr>\n    <tr><td><b>Korean War</b></td><td>1950–1953</td><td>Ended in an armistice, not a peace treaty. U.S. forces are still in South Korea.</td></tr>\n    <tr><td><b>Vietnam War</b></td><td>About 1965–1973 (major U.S. combat)</td><td>4ID deployed 1966–1970 to the Central Highlands. 2-12 IN served in Vietnam (with the 25th ID). <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>Grenada</b> (Urgent Fury)</td><td>1983</td><td></td></tr>\n    <tr><td><b>Panama</b> (Just Cause)</td><td>1989</td><td></td></tr>\n    <tr><td><b>Gulf War</b> (Desert Shield/Storm)</td><td>1990–1991</td><td>The 100-hour ground war liberated Kuwait.</td></tr>\n    <tr><td><b>Somalia</b> (Restore Hope)</td><td>1992–1993</td><td>Battle of Mogadishu, Oct 1993.</td></tr>\n    <tr><td><b>Global War on Terrorism</b></td><td>2001–present</td><td><b>OEF</b> (Operation Enduring Freedom), Afghanistan 2001–2014. <b>OIF</b> (Operation Iraqi Freedom), Iraq 2003–2010. <b>OND</b> (Operation New Dawn) 2010–2011. <b>OIR</b> (Operation Inherent Resolve) against ISIS, 2014–. <b>OFS</b> (Operation Freedom's Sentinel), Afghanistan 2015–2021.</td></tr>\n  </table>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>4th Infantry Division in combat <span class=\"tag t-verify\">Verify</span></h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>WWI:</b> Aisne-Marne, St. Mihiel, Meuse-Argonne.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>WWII:</b> The <b>8th, 12th and 22nd Infantry Regiments</b> made up 4ID. They landed first on <b>Utah Beach</b>. <b>BG Theodore Roosevelt Jr.</b> landed with the first wave and received the Medal of Honor. Then Cherbourg, the liberation of Paris, the <b>Hürtgen Forest</b> and the <b>Battle of the Bulge</b> in Luxembourg.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Vietnam:</b> 1966–1970. Central Highlands.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>OIF:</b> 4ID Soldiers captured <b>Saddam Hussein</b> near Tikrit on <b>13 December 2003</b> (Operation Red Dawn).</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>OEF:</b> multiple deployments to Afghanistan. The Dockery Medal of Honor action (C Co, 2-12 IN) was in Kapisa Province.</div></div>\n    </div>\n    <div>\n      <h3>12th Infantry Regiment <span class=\"tag t-verify\">Verify</span></h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Civil War:</b> fought with the Regular Army (\"the Regulars\") in the eastern campaigns, including <b>Gettysburg</b>.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Spanish-American War:</b> El Caney, Cuba, 1898. The crest commemorates capturing a Spanish flag there.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>WWII:</b> one of 4ID's three infantry regiments. Landed at Utah Beach, fought in the Hürtgen Forest, and held the line in Luxembourg during the Battle of the Bulge.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>GWOT:</b> 2-12 IN deployed to Iraq and Afghanistan. Became a Stryker battalion in 2SBCT, 4ID in 2021.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Recent:</b> Joint Task Force-Southern Border (2025). NTC rotation (2026).</div></div>\n      <span class=\"small\"><span class=\"tag t-local\">Local</span> Ask for the battalion's official campaign streamers and unit decorations. They're usually posted at battalion HQ.</span>\n    </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Where did 4ID land on D-Day?</div><div class=\"a\">Utah Beach, 6 June 1944. It was the first division ashore there.</div></div>\n    <div class=\"qa\"><div class=\"q\">Who received the Medal of Honor for Utah Beach?</div><div class=\"a\">BG Theodore Roosevelt Jr.</div></div>\n    <div class=\"qa\"><div class=\"q\">Which 4ID unit captured Saddam Hussein, and when?</div><div class=\"a\">4ID Soldiers, near Tikrit, 13 December 2003, during Operation Red Dawn.</div></div>\n    <div class=\"qa\"><div class=\"q\">What were 4ID's three infantry regiments in WWII?</div><div class=\"a\">The 8th, 12th and 22nd Infantry Regiments.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does OEF stand for? OIF?</div><div class=\"a\">Operation Enduring Freedom (Afghanistan). Operation Iraqi Freedom (Iraq).</div></div>\n    <div class=\"qa\"><div class=\"q\">When did the Revolutionary War start?</div><div class=\"a\">1775. The Army's birthday is 14 June 1775.</div></div>\n  </div>\n</div>\n"},{"key":"scenarios","num":24,"title":"Situational Questions","category":"Situational","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">24</div><div class=\"txt\"><h2>Situational Questions</h2><div class=\"why\">\"Specialist, you're a team leader and...\" There's no single right answer. The board wants to see you think like an NCO.</div></div></div>\n\n  <div class=\"callout c-gold\"><div class=\"ttl\">The 5-part answer</div>\n    <b>1. Safety first:</b> is anyone in danger? &nbsp;·&nbsp; <b>2. Take immediate action:</b> stop it, correct it, or secure it. &nbsp;·&nbsp; <b>3. Find the facts:</b> talk to the Soldier. &nbsp;·&nbsp; <b>4. Use the right resource or regulation</b>, and <b>inform your chain</b>. &nbsp;·&nbsp; <b>5. Document and follow up</b> (DA Form 4856).<br>\n    Speak in the first person and in the order you'd act: \"First Sergeant, first I would..., then I would...\"\n  </div>\n\n  <h3>Discipline &amp; standards</h3>\n  <table>\n    <tr><th style=\"width:36%\">Situation</th><th>A strong answer</th></tr>\n    <tr><td>Your Soldier is late to formation for the second time.</td><td>Talk to them privately to find out why. Do event counseling on a DA Form 4856 with a plan of action. Apply corrective training if appropriate. Inform your squad leader. Follow up. If it keeps happening, it moves up the chain.</td></tr>\n    <tr><td>A Soldier from another unit walks past you out of uniform standard.</td><td>Make an on-the-spot correction, professionally and respectfully. Every NCO enforces standards, not just the ones in their own unit.</td></tr>\n    <tr><td>Your Soldier failed the AFT.</td><td>Find out why: injury, preparation, or effort. Build a plan with them (H2F resources, extra PT). Counsel and document. Follow your chain's policy on flags and retests.</td></tr>\n    <tr><td>Your Soldier failed the ABCP waist-to-height check.</td><td>Make sure the assessment followed AD 2026-13 (a second team confirmed it, recorded on DA Form 5500). Counsel the Soldier. Connect them with H2F dietitians and trainers. Inform your chain. Be supportive and hold the standard.</td></tr>\n    <tr><td>You smell alcohol on your Soldier at first formation.</td><td>Remove them from duty and from any weapon or vehicle. Inform your squad leader or PSG right away. The command decides on testing. ASAP referral (AR 600-85). Document it.</td></tr>\n    <tr><td>Your Soldier posted a photo of the vehicle line and the deployment date on social media.</td><td>Have them take it down right away. Explain the OPSEC risk (AR 530-1). Inform your chain, since it may need to be reported. Counsel and retrain.</td></tr>\n  </table>\n\n  <h3>Soldier care</h3>\n  <table>\n    <tr><th style=\"width:36%\">Situation</th><th>A strong answer</th></tr>\n    <tr><td>Your Soldier says, \"Sometimes I don't see the point of anything anymore.\"</td><td><b>ACE.</b> Ask directly: \"Are you thinking about killing yourself?\" Care: listen and take it seriously. Escort: stay with them and take them to Behavioral Health, the chaplain or the ER. Never leave them alone. Inform your chain. If there's immediate danger, call 911.</td></tr>\n    <tr><td>A Soldier tells you they were sexually assaulted.</td><td>Make sure they're safe and get medical care if needed. <b>Don't promise confidentiality.</b> Tell them you have to report it, and connect them with the SARC or SHARP VA right away. The VA explains restricted and unrestricted reporting. Don't investigate yourself. Protect their privacy. AR 600-52.</td></tr>\n    <tr><td>Your Soldier is being harassed by another Soldier because of their race.</td><td>Stop the behavior. Make sure the victim is safe. Inform your chain. Explain the EO complaint options: informal, or formal on DA Form 7279. Connect them with the unit EOL. Protect them from retaliation. AR 600-20 Ch 6.</td></tr>\n    <tr><td>Your Soldier can't pay rent this month.</td><td>Find out the cause. AER for emergency assistance. ACS financial readiness counseling. Help them build a budget. Follow up next payday.</td></tr>\n    <tr><td>Your Soldier's family member is in the hospital back home.</td><td>Inform your chain right away for emergency leave. Red Cross message. AER for travel funds if needed. Check on them while they're gone.</td></tr>\n    <tr><td>A new Soldier just arrived on your team.</td><td>Sponsor them. Do the initial counseling within the first 30 days. Learn their background, goals and family situation. Get them through in-processing, issue and training. Pair them with a battle buddy.</td></tr>\n  </table>\n\n  <h3>Leadership &amp; mission</h3>\n  <table>\n    <tr><th style=\"width:36%\">Situation</th><th>A strong answer</th></tr>\n    <tr><td>You get an order you think is unsafe.</td><td>Bring your concern to the leader who gave it, respectfully, with facts and risk-management steps. If it's lawful, execute it with controls in place. If it's clearly illegal, do not obey, and report it through the chain.</td></tr>\n    <tr><td>Your squad leader is gone and the PSG gives your team a mission.</td><td>Acknowledge it and back-brief. Use the TLPs: issue a WARNORD, plan, inspect (PCCs/PCIs), execute. Report completion. \"Initiative by taking appropriate action in the absence of orders.\" (NCO Creed)</td></tr>\n    <tr><td>Two of your Soldiers keep arguing and it's affecting the team.</td><td>Separate them and talk to each one individually. Find the root cause. Mediate. Set clear expectations. Counsel if needed. Inform your squad leader if it keeps happening.</td></tr>\n    <tr><td>Your team is behind on PMCS before a field problem.</td><td>Prioritize: get the vehicle and weapons mission-capable first. Divide the tasks by who knows what. Inform the chain about deadline faults early, not at the last minute. Do an AAR afterward so it doesn't happen again.</td></tr>\n    <tr><td>Your friend from your old team is now your Soldier.</td><td>Have the conversation early. Explain the relationship has changed professionally. Enforce the same standard for everyone. Avoid any appearance of favoritism (AR 600-20 / AR 600-32).</td></tr>\n    <tr><td>You made a mistake that affected the mission.</td><td>Own it right away. Tell your leader what happened and what you're doing to fix it. Learn from it in the AAR. Integrity matters more than looking good.</td></tr>\n  </table>\n\n  <h3>Tactical</h3>\n  <table>\n    <tr><th style=\"width:36%\">Situation</th><th>A strong answer</th></tr>\n    <tr><td>Your team makes contact on a patrol.</td><td>Return fire and take cover. Locate the enemy. Send a SALUTE report. Gain fire superiority. Follow the battle drill (react to contact) and the squad leader's direction. Send a LACE report after contact.</td></tr>\n    <tr><td>A Soldier on your team is wounded under fire.</td><td>Care Under Fire: win the fight first. Direct the casualty to self-aid and cover. Once it's safe, apply a tourniquet if there's massive bleeding. Move to Tactical Field Care (MARCH). Request MEDEVAC with a 9-line.</td></tr>\n    <tr><td>You find a suspected IED on your route.</td><td>Stop. Don't touch it. Confirm from a distance. Clear the area. Cordon it off. Check for secondary devices. Control the area. Report with a 9-line UXO/IED report. <span class=\"tag t-verify\">Verify</span> the 5 Cs: Confirm, Clear, Call, Cordon, Control
