ke sure the assessment followed AD 2026-13 (a second team confirmed it, recorded on DA Form 5500). Counsel the Soldier. Connect them with H2F dietitians and trainers. Inform your chain. Be supportive and hold the standard.","tags":[],"mc":false},{"id":"scenarios-05","section":"scenarios","category":"Situational","q":"You smell alcohol on your Soldier at first formation.","a":"Remove them from duty and from any weapon or vehicle. Inform your squad leader or PSG right away. The command decides on testing. ASAP referral (AR 600-85). Document it.","tags":[],"mc":false},{"id":"scenarios-06","section":"scenarios","category":"Situational","q":"Your Soldier posted a photo of the vehicle line and the deployment date on social media.","a":"Have them take it down right away. Explain the OPSEC risk (AR 530-1). Inform your chain, since it may need to be reported. Counsel and retrain.","tags":[],"mc":false},{"id":"scenarios-07","section":"scenarios","category":"Situational","q":"Your Soldier says, \"Sometimes I don't see the point of anything anymore.\"","a":"ACE. Ask directly: \"Are you thinking about killing yourself?\" Care: listen and take it seriously. Escort: stay with them and take them to Behavioral Health, the chaplain or the ER. Never leave them alone. Inform your chain. If there's immediate danger, call 911.","tags":[],"mc":false},{"id":"scenarios-08","section":"scenarios","category":"Situational","q":"A Soldier tells you they were sexually assaulted.","a":"Make sure they're safe and get medical care if needed. Don't promise confidentiality. Tell them you have to report it, and connect them with the SARC or SHARP VA right away. The VA explains restricted and unrestricted reporting. Don't investigate yourself. Protect their privacy. AR 600-52.","tags":[],"mc":false},{"id":"scenarios-09","section":"scenarios","category":"Situational","q":"Your Soldier is being harassed by another Soldier because of their race.","a":"Stop the behavior. Make sure the victim is safe. Inform your chain. Explain the EO complaint options: informal, or formal on DA Form 7279. Connect them with the unit EOL. Protect them from retaliation. AR 600-20 Ch 6.","tags":[],"mc":false},{"id":"scenarios-10","section":"scenarios","category":"Situational","q":"Your Soldier can't pay rent this month.","a":"Find out the cause. AER for emergency assistance. ACS financial readiness counseling. Help them build a budget. Follow up next payday.","tags":[],"mc":false},{"id":"scenarios-11","section":"scenarios","category":"Situational","q":"Your Soldier's family member is in the hospital back home.","a":"Inform your chain right away for emergency leave. Red Cross message. AER for travel funds if needed. Check on them while they're gone.","tags":[],"mc":false},{"id":"scenarios-12","section":"scenarios","category":"Situational","q":"A new Soldier just arrived on your team.","a":"Sponsor them. Do the initial counseling within the first 30 days. Learn their background, goals and family situation. Get them through in-processing, issue and training. Pair them with a battle buddy.","tags":[],"mc":false},{"id":"scenarios-13","section":"scenarios","category":"Situational","q":"You get an order you think is unsafe.","a":"Bring your concern to the leader who gave it, respectfully, with facts and risk-management steps. If it's lawful, execute it with controls in place. If it's clearly illegal, do not obey, and report it through the chain.","tags":[],"mc":false},{"id":"scenarios-14","section":"scenarios","category":"Situational","q":"Your squad leader is gone and the PSG gives your team a mission.","a":"Acknowledge it and back-brief. Use the TLPs: issue a WARNORD, plan, inspect (PCCs/PCIs), execute. Report completion. \"Initiative by taking appropriate action in the absence of orders.\" (NCO Creed)","tags":[],"mc":false},{"id":"scenarios-15","section":"scenarios","category":"Situational","q":"Two of your Soldiers keep arguing and it's affecting the team.","a":"Separate them and talk to each one individually. Find the root cause. Mediate. Set clear expectations. Counsel if needed. Inform your squad leader if it keeps happening.","tags":[],"mc":false},{"id":"scenarios-16","section":"scenarios","category":"Situational","q":"Your team is behind on PMCS before a field problem.","a":"Prioritize: get the vehicle and weapons mission-capable first. Divide the tasks by who knows what. Inform the chain about deadline faults early, not at the last minute. Do an AAR afterward so it doesn't happen again.","tags":[],"mc":false},{"id":"scenarios-17","section":"scenarios","category":"Situational","q":"Your friend from your old team is now your Soldier.","a":"Have the conversation early. Explain the relationship has changed professionally. Enforce the same standard for everyone. Avoid any appearance of favoritism (AR 600-20 / AR 600-32).","tags":[],"mc":false},{"id":"scenarios-18","section":"scenarios","category":"Situational","q":"You made a mistake that affected the mission.","a":"Own it right away. Tell your leader what happened and what you're doing to fix it. Learn from it in the AAR. Integrity matters more than looking good.","tags":[],"mc":false},{"id":"scenarios-19","section":"scenarios","category":"Situational","q":"Your team makes contact on a patrol.","a":"Return fire and take cover. Locate the enemy. Send a SALUTE report. Gain fire superiority. Follow the battle drill (react to contact) and the squad leader's direction. Send a LACE report after contact.","tags":[],"mc":false},{"id":"scenarios-20","section":"scenarios","category":"Situational","q":"A Soldier on your team is wounded under fire.","a":"Care Under Fire: win the fight first. Direct the casualty to self-aid and cover. Once it's safe, apply a tourniquet if there's massive bleeding. Move to Tactical Field Care (MARCH). Request MEDEVAC with a 9-line.","tags":[],"mc":false},{"id":"scenarios-21","section":"scenarios","category":"Situational","q":"You find a suspected IED on your route.","a":"Stop. Don't touch it. Confirm from a distance. Clear the area. Cordon it off. Check for secondary devices. Control the area. Report with a 9-line UXO/IED report. the 5 Cs: Confirm, Clear, Call, Cordon, Control.","tags":["verify"],"mc":false},{"id":"corrections-01","section":"corrections","category":"Corrections","q":"Correct this: 1-12 IN lineage (Co A, 1st Bn)","a":"2-12 IN: constituted 3 May 1861 as Company B, 1st Bn, 12th Infantry","tags":[],"mc":true,"choices":["2-12 IN: constituted 3 May 1861 as Company B, 1st Bn, 12th Infantry","1-12 IN: constituted 3 May 1861 as Company A, 1st Bn, 12th Infantry","2-12 IN: constituted 14 June 1775 as Company B, 12th Infantry","2-12 IN: constituted 3 May 1861 as Company C, 2nd Bn, 12th Infantry"]},{"id":"corrections-02","section":"corrections","category":"Corrections","q":"Correct this: SALUTE: U = Uniform","a":"U = Unit","tags":[],"mc":true,"choices":["U = Unit","U = Unknown","U = Unit leader","U = Uniform and equipment"]},{"id":"corrections-03","section":"corrections","category":"Corrections","q":"Correct this: OPORD para 5 = Command and Control","a":"Para 5 = Command and Signal","tags":[],"mc":true,"choices":["Para 5 = Command and Signal","Para 5 = Command and Control (correct as written)","Para 5 = Communications and Support","Para 5 = Sustainment"]},{"id":"corrections-04","section":"corrections","category":"Corrections","q":"Correct this: TC 4-02.1 is first aid","a":"ATP 4-02.11 (23 Mar 2026) superseded it","tags":[],"mc":true,"choices":["ATP 4-02.11 (23 Mar 2026) superseded it","TC 4-02.1 is still current","FM 4-25.11 (2002) replaced it","ATP 4-02.2 (2019) superseded it"]},{"id":"corrections-05","section":"corrections","category":"Corrections","q":"Correct this: FM 3-25.26 land nav","a":"TC 3-25.26 (15 Nov 2013)","tags":[],"mc":true,"choices":["TC 3-25.26 (15 Nov 2013)","FM 3-25.26 is still current","ATP 3-25.26 (15 Nov 2023)","TC 3-21.5 (3 May 2021)"]},{"id":"corrections-06","section":"corrections","category":"Corrections","q":"Correct this: FM 27-2 physical fitness","a":"FM 7-22 and ATP 7-22.02","tags":[],"mc":true,"choices":["FM 7-22 and ATP 7-22.02","FM 27-2 is still the PT reference","TC 3-22.20 only","FM 7-0 and ADP 7-0"]},{"id":"corrections-07","section":"corrections","category":"Corrections","q":"Correct this: 3rd TCCC phase: \"combat casualty evac plan\"","a":"Tactical Evacuation Care","tags":[],"mc":true,"choices":["Tactical Evacuation Care","Medical Evacuation Care","Casualty Collection Care","Prolonged Field Care"]},{"id":"corrections-08","section":"corrections","category":"Corrections","q":"Correct this: Recovery Drill items 6 and 7 swapped","a":"6 = Groin Stretch, 7 = Calf Stretch","tags":[],"mc":true,"choices":["6 = Groin Stretch, 7 = Calf Stretch","6 = Calf Stretch, 7 = Groin Stretch (correct as written)","6 = Hamstring Stretch, 7 = Calf Stretch","6 = Groin Stretch, 7 = Thigh Stretch"]},{"id":"corrections-09","section":"corrections","category":"Corrections","q":"Correct this: Shot process: \"steady position, aiming, breathing, trigger squeeze\"","a":"Stability, Aim, Control, Movement","tags":[],"mc":true,"choices":["Stability, Aim, Control, Movement","Steady position, aiming, breathing, trigger squeeze (correct as written)","Stance, Aim, Breathing, Trigger control","Stability, Aim, Breathing, Follow-through"]},{"id":"corrections-10","section":"corrections","category":"Corrections","q":"Correct this: AR 600-20 is the SHARP reg","a":"AR 600-52 (11 Feb 2025)","tags":[],"mc":true,"choices":["AR 600-52 (11 Feb 2025)","AR 600-20 (15 Apr 2026) is correct","AR 600-92 (4 Oct 2024)","AR 600-63 (15 Apr 2026)"]},{"id":"corrections-11","section":"corrections","category":"Corrections","q":"Correct this: AR 600-63 is suicide prevention","a":"AR 600-92. AR 600-63 is Army Health Promotion.","tags":[],"mc":true,"choices":["AR 600-92. AR 600-63 is Army Health Promotion.","AR 600-63 is correct. AR 600-92 is health promotion.","AR 600-85. AR 600-63 is substance abuse.","AR 600-52. AR 600-63 is SHARP."]},{"id":"corrections-12","section":"corrections","category":"Corrections","q":"Correct this: DA Form 5501 for tape","a":"DA Form 5500 only. 5501 is no longer used.","tags":[],"mc":true,"choices":["DA Form 5500 only. 5501 is no longer used.","DA Form 5501 only. 5500 is no longer used.","DA Form 5500 and 5501 together.","DA Form 705 only."]},{"id":"corrections-13","section":"corrections","category":"Corrections","q":"Correct this: ADP 6-22 = \"Army Talent Management\"","a":"ADP 6-22 = Army Leadership and the Profession","tags":[],"mc":true,"choices":["ADP 6-22 = Army Leadership and the Profession","ADP 6-22 = Mission Command","ADP 6-22 = Developing Leaders","ADP 6-22 = Army Training and Leader Development"]}];
window.__LIBRARY__ = {"sections":[{"key":"creeds","num":1,"title":"Creeds & Army Values","category":"Board & Basics","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">1</div><div class=\"txt\"><h2>Creeds &amp; Army Values</h2><div class=\"why\">Your board opens with a creed. Get it perfect, because it sets the tone for everything after.</div></div></div>\n\n  <div class=\"callout c-verify\"><div class=\"ttl\">Verify word for word</div>The texts below are the standard published versions. Before you lock them in, compare every word against army.mil/values/nco.html and army.mil/values/soldiers.html. Most boards ask for the <b>NCO Creed</b>. The MOI will say which one.</div>\n\n  <div class=\"creed\">\n    <div class=\"lead\"><span class=\"tag t-must\">Must know</span>&nbsp; The Creed of the Noncommissioned Officer</div>\n    <p><span class=\"key\">No one is more professional than I.</span> I am a noncommissioned officer, a leader of Soldiers. As a noncommissioned officer, I realize that I am a member of a time honored corps, which is known as \"The Backbone of the Army\". I am proud of the Corps of noncommissioned officers and will at all times conduct myself so as to bring credit upon the Corps, the military service and my country regardless of the situation in which I find myself. I will not use my grade or position to attain pleasure, profit, or personal safety.</p>\n    <p><span class=\"key\">Competence is my watchword.</span> My two basic responsibilities will always be uppermost in my mind—accomplishment of my mission and the welfare of my Soldiers. I will strive to remain technically and tactically proficient. I am aware of my role as a noncommissioned officer. I will fulfill my responsibilities inherent in that role. All Soldiers are entitled to outstanding leadership; I will provide that leadership. I know my Soldiers and I will always place their needs above my own. I will communicate consistently with my Soldiers and never leave them uninformed. I will be fair and impartial when recommending both rewards and punishment.</p>\n    <p><span class=\"key\">Officers of my unit will have maximum time to accomplish their duties;</span> they will not have to accomplish mine. I will earn their respect and confidence as well as that of my Soldiers. I will be loyal to those with whom I serve; seniors, peers, and subordinates alike. I will exercise initiative by taking appropriate action in the absence of orders. I will not compromise my integrity, nor my moral courage. I will not forget, nor will I allow my comrades to forget that we are professionals, noncommissioned officers, leaders!</p>\n  </div>\n\n  <div class=\"callout c-tip\"><div class=\"ttl\">How to lock it in</div>Each paragraph starts with its own anchor: <b>Professional</b> → <b>Competence</b> → <b>Officers</b>. Recite it out loud 3 times a day, standing at attention, ideally in front of someone who can follow along with the text. Speak at a steady pace. If you stumble, pause, then keep going. Don't start over.</div>\n\n  <div class=\"grid2\">\n    <div class=\"creed lines\">\n      <div class=\"lead\"><span class=\"tag t-must\">Must know</span>&nbsp; The Soldier's Creed</div>\n      <p>I am an American Soldier.</p>\n      <p>I am a warrior and a member of a team.</p>\n      <p>I serve the people of the United States, and live the Army Values.</p>\n      <p class=\"key\">I will always place the mission first.</p>\n      <p class=\"key\">I will never accept defeat.</p>\n      <p class=\"key\">I will never quit.</p>\n      <p class=\"key\">I will never leave a fallen comrade.</p>\n      <p>I am disciplined, physically and mentally tough, trained and proficient in my warrior tasks and drills.</p>\n      <p>I always maintain my arms, my equipment and myself.</p>\n      <p>I am an expert and I am a professional.</p>\n      <p>I stand ready to deploy, engage, and destroy, the enemies of the United States of America in close combat.</p>\n      <p>I am a guardian of freedom and the American way of life.</p>\n      <p>I am an American Soldier.</p>\n    </div>\n    <div>\n      <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Army Values: LDRSHIP</h4>\n        <div class=\"mnem\"><span><b>L</b>Loyalty</span><span><b>D</b>Duty</span><span><b>R</b>Respect</span><span><b>S</b>Selfless Service</span><span><b>H</b>Honor</span><span><b>I</b>Integrity</span><span><b>P</b>Personal Courage</span></div>\n      </div>\n      <div class=\"card\" style=\"margin-top:10px\"><h4><span class=\"tag t-know\">Know</span> Warrior Ethos</h4>\n        The four highlighted lines in the Soldier's Creed:<br><i>mission first · never accept defeat · never quit · never leave a fallen comrade.</i></div>\n      <div class=\"card\" style=\"margin-top:10px\"><h4><span class=\"tag t-know\">Know</span> Army Profession: ADP 6-22</h4>\n        <b>ADP 6-22</b>, Army Leadership and the Profession (31 Jul 2019, incl. C2). Chapter 1 covers the Army Profession and its ethic.<br>\n        <span class=\"tag t-verify\">Verify</span> The five essential characteristics of the profession are <b>Trust, Honorable Service, Military Expertise, Stewardship, Esprit de Corps</b>.</div>\n      <div class=\"card\" style=\"margin-top:10px\"><h4><span class=\"tag t-bonus\">Bonus</span> Army facts</h4>\n        Army birthday: <b>14 June 1775</b>. The NCO Corps and the Infantry share it.<br>Motto: <b>\"This We'll Defend.\"</b><br>Song: <b>\"The Army Goes Rolling Along.\"</b></div>\n    </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Name the Army Values.</div><div class=\"a\">Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, Personal Courage. <b>LDRSHIP.</b></div></div>\n    <div class=\"qa\"><div class=\"q\">What are the two basic responsibilities of an NCO?</div><div class=\"a\">Accomplishment of the mission and the welfare of Soldiers. (NCO Creed, paragraph 2)</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the Warrior Ethos?</div><div class=\"a\">I will always place the mission first. I will never accept defeat. I will never quit. I will never leave a fallen comrade.</div></div>\n    <div class=\"qa\"><div class=\"q\">What publication covers Army leadership and the profession?</div><div class=\"a\">ADP 6-22, Army Leadership and the Profession.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Which Army Value is the hardest for you to live, and why?</div><div class=\"a\">Pick one honestly, such as selfless service when you're tired. Give an example and what you do about it.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does \"time honored corps\" mean to you?</div><div class=\"a\">The NCO Corps dates to 1775. It's a tradition of leaders who carry out the mission and take care of Soldiers. Now you're joining it.</div></div>\n    <div class=\"qa\"><div class=\"q\">Define integrity.</div><div class=\"a\">Do what is right, legally and morally. Being honest in word and deed, even when no one is watching.</div></div>\n    <div class=\"qa\"><div class=\"q\">Define selfless service.</div><div class=\"a\">Put the welfare of the Nation, the Army and your subordinates before your own.</div></div>\n    <div class=\"qa\"><div class=\"q\">Define personal courage.</div><div class=\"a\">Face fear, danger or adversity, both physical and moral.</div></div>\n  </div>\n</div>\n"},{"key":"board","num":2,"title":"Board Procedure & AGSU","category":"Board & Basics","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">2</div><div class=\"txt\"><h2>Board Procedure &amp; AGSU</h2><div class=\"why\">Your appearance and how you report in are graded before you answer a single question.</div></div></div>\n\n  <div class=\"callout c-local\"><div class=\"ttl\">Local check: the MOI decides</div>Below is a common battalion-board sequence. Some details vary by unit: whether you salute an NCO board president, how many knocks, and the exact reporting phrase. Ask your 1SG or a recent board-goer, and follow the MOI once it comes out.</div>\n\n  <h3>Typical reporting sequence</h3>\n  <div class=\"script\">\n<span class=\"act\">[Knock once, firmly. Wait.]</span><br>\n<span class=\"brd\">CSM:</span> \"Enter.\"<br>\n<span class=\"act\">[Enter. Close the door. March by the most direct route to about 2 paces in front of the president, centered. Halt.]</span><br>\n<span class=\"you\">YOU:</span> \"Sergeant Major, Specialist ________ reports to the President of the Board.\" <span class=\"act\">[Salute if the MOI says to. Hold it until it's returned or you're told to drop it.]</span><br>\n<span class=\"brd\">CSM:</span> \"Recite the NCO Creed.\" <span class=\"act\">[Stand at attention. Speak up and keep your eyes forward.]</span><br>\n<span class=\"brd\">CSM:</span> \"Take your seat.\" <span class=\"act\">[Sit straight, back off the chair back, feet flat, hands palms down on your thighs.]</span><br>\n<span class=\"brd\">CSM:</span> \"Tell the board about yourself.\" <span class=\"act\">[See Section 4.]</span><br>\n<span class=\"act\">[Each 1SG asks questions. Address each one as \"First Sergeant.\"]</span><br>\n<span class=\"brd\">CSM:</span> \"Stand up. You are dismissed.\" <span class=\"act\">[Stand at attention. Salute if required. Face about. Exit and close the door.]</span>\n  </div>\n\n  <div class=\"grid2\" style=\"margin-top:10px\">\n    <div class=\"card\"><h4>Bearing</h4>\n      <ul>\n        <li>Eye contact with whoever asked the question.</li>\n        <li>No fidgeting, \"um,\" or \"like.\" Pause instead.</li>\n        <li>Speak a little louder and slower than feels natural.</li>\n        <li>If you didn't hear the question: \"First Sergeant, could you repeat the question?\"</li>\n        <li>If you make a mistake, correct it calmly: \"Correction, First Sergeant...\"</li>\n      </ul></div>\n    <div class=\"card\"><h4>What graders usually score</h4>\n      <ul>\n        <li>Military bearing and self-confidence</li>\n        <li>Personal appearance and uniform</li>\n        <li>Oral expression and conversational skill</li>\n        <li>Knowledge of world affairs <span class=\"tag t-local\">Local</span></li>\n        <li>Awareness of programs and leadership</li>\n        <li>Basic Soldiering knowledge</li>\n      </ul>\n      <span class=\"small\">Confirm the actual scoresheet in the MOI.</span></div>\n  </div>\n\n  <h3>AGSU checklist</h3>\n  <table>\n    <tr><th style=\"width:30%\">Item</th><th>Standard</th><th style=\"width:16%\">Status</th></tr>\n    <tr><td>Ribbons (coat)</td><td>Male: centered 1/8 inch above the left breast pocket. Order of precedence from <b>wearer's right to left</b>. No more than 4 per row. <b>Ribbons are not authorized on the AGSU shirt.</b></td><td><span class=\"tag t-verify\">Verify</span> DA Pam 670-1</td></tr>\n    <tr><td>Badges</td><td>When wearing two or more, place them in order of precedence from the wearer's right (highest) to left. Only <b>one badge per pocket</b>. <b>Miniature badges are not authorized on the AGSU.</b></td><td><span class=\"tag t-verify\">Verify</span> army.mil FAQ</td></tr>\n    <tr><td>Nameplate, unit awards, DUI, combat patch, service stripes, rank</td><td>Measure every item against <b>DA Pam 670-1, AGSU chapter</b>. Sources online contradict each other on nameplate wear, so don't trust a vendor website.</td><td><span class=\"tag t-local\">Local</span> Have an NCO measure</td></tr>\n    <tr><td>ERB/ORB match</td><td>Everything on your chest must be on your record, and the other way around. Board members check.</td><td><span class=\"tag t-must\">Must</span></td></tr>\n    <tr><td>Grooming</td><td>Haircut 1–2 days out. Clean-shaven unless you have an approved exception. See Section 9.</td><td><span class=\"tag t-must\">Must</span></td></tr>\n    <tr><td>Fit and finish</td><td>Pressed, lint-rolled, no strings, shoes shined, belt or tab aligned. Bring a lint roller and a spare shirt.</td><td><span class=\"tag t-must\">Must</span></td></tr>\n  </table>\n  <div class=\"callout c-tip\"><div class=\"ttl\">Do this by 16 Nov</div>Put the full uniform on and get a squad leader or PSG to inspect it with a ruler. That leaves time to buy or replace anything that's missing.</div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">How do you report to the board?</div><div class=\"a\">Knock once, enter when told, march to about 2 paces in front of the president, halt, and say \"Sergeant Major, Specialist ___ reports to the President of the Board.\" Salute only if the MOI says to. <span class=\"tag t-local\">Local</span></div></div>\n    <div class=\"qa\"><div class=\"q\">How do you sit once you're told to take your seat?</div><div class=\"a\">Back straight and off the chair back, feet flat, hands palms down on your thighs.</div></div>\n    <div class=\"qa\"><div class=\"q\">What do you say if you don't know an answer?</div><div class=\"a\">\"First Sergeant, I do not know the answer, but I will find out.\"</div></div>\n    <div class=\"qa\"><div class=\"q\">What do you say if you didn't hear the question?</div><div class=\"a\">\"First Sergeant, could you repeat the question?\"</div></div>\n    <div class=\"qa\"><div class=\"q\">Are ribbons authorized on the AGSU shirt?</div><div class=\"a\">No. Ribbons go on the AGSU coat only. <span class=\"tag t-verify\">Verify</span> DA Pam 670-1</div></div>\n    <div class=\"qa\"><div class=\"q\">Are miniature badges authorized on the AGSU?</div><div class=\"a\">No. Miniature badges are not authorized on the AGSU, and only one badge goes on each pocket.</div></div>\n  </div>\n</div>\n"},{"key":"coc","num":3,"title":"Chain of Command & NCO Support Channel","category":"Board & Basics","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">3</div><div class=\"txt\"><h2>Chain of Command &amp; NCO Support Channel</h2><div class=\"why\">Usually the first questions after the creed. Know every name, rank, and spelling.</div></div></div>\n\n  <div class=\"callout c-verify\"><div class=\"ttl\">Senior leadership changed in 2026</div>The names in the \"last reported\" column come from public sources as of Nov 2026. Some of these positions changed this year: the Chief of Staff was replaced in April 2026, and the Secretary of the Army may be serving in an acting capacity. <b>Confirm each name with your unit or on army.mil before the board</b>, and write the confirmed name in the last column.</div>\n\n  <div class=\"grid2\">\n  <div>\n  <h3>Chain of command</h3>\n  <table>\n    <tr><th>Position</th><th>Last reported</th><th>Confirmed</th></tr>\n    <tr><td>Commander in Chief</td><td>President Donald J. Trump</td><td class=\"blank\"></td></tr>\n    <tr><td>Secretary of Defense (Secretary of War)</td><td>Pete Hegseth</td><td class=\"blank\"></td></tr>\n    <tr><td>Chairman, Joint Chiefs (sometimes asked)</td><td>Gen. Dan Caine, USAF <span class=\"tag t-verify\">Verify</span></td><td class=\"blank\"></td></tr>\n    <tr><td>Secretary of the Army</td><td>Dan Driscoll; reportedly Adam Telle (acting) since Sep 2026 <span class=\"tag t-verify\">Verify</span></td><td class=\"blank\"></td></tr>\n    <tr><td>Chief of Staff of the Army</td><td>GEN Christopher LaNeve (acting since Apr 2026) <span class=\"tag t-verify\">Verify</span></td><td class=\"blank\"></td></tr>\n    <tr><td>Corps CG</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>4ID &amp; Fort Carson CG</td><td>MG Patrick J. Ellis</td><td class=\"blank\"></td></tr>\n    <tr><td>2SBCT Commander</td><td>COL Hugh W.A. Jones <span class=\"tag t-verify\">Verify</span></td><td class=\"blank\"></td></tr>\n    <tr><td>2-12 IN Commander</td><td>LTC Travis Stellfox <span class=\"tag t-verify\">Verify</span></td><td class=\"blank\"></td></tr>\n    <tr><td>C Co Commander</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>Platoon Leader</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n  </table>\n  </div>\n  <div>\n  <h3>NCO support channel</h3>\n  <table>\n    <tr><th>Position</th><th>Last reported</th><th>Confirmed</th></tr>\n    <tr><td>Sergeant Major of the Army</td><td>SMA Michael R. Weimer</td><td class=\"blank\"></td></tr>\n    <tr><td>Corps CSM</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>4ID CSM</td><td>CSM Waylon D. Petty <span class=\"tag t-verify\">Verify</span></td><td class=\"blank\"></td></tr>\n    <tr><td>2SBCT CSM</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>2-12 IN CSM (board president)</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>C Co First Sergeant</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>Platoon Sergeant</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n    <tr><td>Squad Leader</td><td><span class=\"tag t-local\">Local</span></td><td class=\"blank\"></td></tr>\n  </table>\n  <h3>Board members</h3>\n  <table>\n    <tr><th>Seat</th><th>Name</th></tr>\n    <tr><td>A Co 1SG</td><td class=\"blank\"></td></tr>\n    <tr><td>B Co 1SG</td><td class=\"blank\"></td></tr>\n    <tr><td>C Co 1SG</td><td class=\"blank\"></td></tr>\n    <tr><td>HHC 1SG</td><td class=\"blank\"></td></tr>\n  </table>\n  </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What is the NCO support channel?</div><div class=\"a\">The channel from the SMA down to the first-line leader. It parallels and reinforces the chain of command. NCOs use it to pass information, standards, and individual training and welfare issues. <span class=\"tag t-verify\">Verify</span> AR 600-20, Ch 2.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Why is it important to know your chain of command?</div><div class=\"a\">So you know who gives orders and who is responsible, and so issues get routed to the right level.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between the chain of command and the NCO support channel?</div><div class=\"a\">The chain of command issues orders and holds command authority. The NCO support channel backs up the chain, focusing on standards, training and Soldier care.</div></div>\n    <div class=\"qa\"><div class=\"q\">Who is the senior enlisted leader of 4ID?</div><div class=\"a\">The Division CSM (last reported: CSM Waylon D. Petty). <span class=\"tag t-verify\">Verify</span></div></div>\n  </div>\n</div>\n"},{"key":"nco","num":4,"title":"NCO History, Duties & Personal Questions","category":"Board & Basics","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">4</div><div class=\"txt\"><h2>NCO History, Duties &amp; Personal Questions</h2><div class=\"why\">These are where the board decides whether you're ready to lead. Prepare your answers. Don't wing them.</div></div></div>\n\n  <h3>\"Tell the board about yourself\" (60–90 seconds)</h3>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4>Structure</h4>\n      <ol>\n        <li><b>Name, rank, MOS, unit, position.</b> \"Specialist ____, 11B, Team Leader in 2nd Platoon, C Company, 2-12 Infantry.\"</li>\n        <li><b>Hometown and time in service.</b></li>\n        <li><b>Your career so far:</b> M320 grenadier, Stryker driver, SAW gunner and rifleman, now team leader.</li>\n        <li><b>One or two accomplishments:</b> schools, ranges, rotations (NTC, the border mission), awards.</li>\n        <li><b>Goals:</b> BLC, civilian education, next position.</li>\n        <li><b>Close:</b> \"...and that is a little about me, Sergeant Major.\"</li>\n      </ol>\n      <span class=\"small\">Leave out family drama, politics, and anything you can't defend.</span></div>\n    <div class=\"card\"><h4>Write your version here</h4>\n      <div style=\"height:2.1in; background: repeating-linear-gradient(#fff, #fff 21px, #cfd3cc 22px);\"></div></div>\n  </div>\n\n  <h3>Questions to prepare answers for</h3>\n  <table>\n    <tr><th style=\"width:40%\">Question</th><th>What a strong answer includes</th></tr>\n    <tr><td>Why should you be promoted?</td><td>Evidence you already perform at the next level, such as leading your fire team or training Soldiers on the 320 and driving. Show you know the standard, plus one specific example.</td></tr>\n    <tr><td>What does it mean to be an NCO?</td><td>Connect it to the creed: the Backbone of the Army, the two basic responsibilities, leading by example, and enforcing standards.</td></tr>\n    <tr><td>What will you do in your first 30 days as a SGT?</td><td>Get to know your Soldiers (initial counseling, family, goals). Learn your equipment and task status. Set your standards. Meet your leadership's intent.</td></tr>\n    <tr><td>One of your Soldiers comes to you with a problem you can't fix. What do you do?</td><td>Listen. Make sure they're safe. Use the right resource (chaplain, MFLC, Behavioral Health, SHARP, AER). Inform your chain. Follow up.</td></tr>\n    <tr><td>A Soldier is late for formation for the second time.</td><td>Find out why. Do event counseling on DA Form 4856. Apply corrective training if appropriate. Inform your squad leader. Follow up.</td></tr>\n    <tr><td>You see another NCO correcting a Soldier in a way that crosses the line.</td><td>Step in professionally, privately if possible. Report it through the NCO support channel. Standards apply to everyone.</td></tr>\n    <tr><td>What's your biggest weakness?</td><td>A real weakness, plus what you're doing to fix it.</td></tr>\n    <tr><td>Current events <span class=\"tag t-local\">Local</span></td><td>Read the news daily this week: Army transformation, the 4ID move to an all-Stryker division, and major world events.</td></tr>\n  </table>\n\n  <h3>NCO history &amp; duties</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>The NCO Corps dates to <b>1775</b> with the Continental Army. Baron von Steuben's <b>\"Blue Book\"</b> (Regulations for the Order and Discipline of the Troops of the United States, 1778–79) first defined NCO duties in writing.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>The first <b>Sergeant Major of the Army</b> was <b>SMA William O. Wooldridge</b> (1966).</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>The NCO Creed was written in the early 1970s at Fort Benning, as part of the NCO education system. <span class=\"tag t-verify\">Verify</span></div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>TC 7-22.7</b>, The Noncommissioned Officer Guide (19 Aug 2025), is the NCO's reference for duties, responsibilities, and authority. <b>TC 7-21.13</b>, The Soldier's Guide (17 Sep 2025), is the Soldier-level reference.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>NCOs carry out the commander's intent. They lead Soldiers, train individuals and teams, maintain standards and discipline, and take care of Soldiers and their equipment.</div></div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Who was the first Sergeant Major of the Army?</div><div class=\"a\">SMA William O. Wooldridge, 1966.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the \"Backbone of the Army\"?</div><div class=\"a\">The NCO Corps.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the NCO Guide?</div><div class=\"a\">TC 7-22.7, The Noncommissioned Officer Guide.</div></div>\n    <div class=\"qa\"><div class=\"q\">Where do you see yourself in 5 years?</div><div class=\"a\">A realistic goal: squad leader and SSG, ALC complete, college progress, and developing Soldiers.</div></div>\n    <div class=\"qa\"><div class=\"q\">What makes a good team leader?</div><div class=\"a\">Leading by example, knowing your Soldiers, enforcing standards consistently, and training your team to be ready to take your job.</div></div>\n  </div>\n</div>\n"},{"key":"basics","num":5,"title":"Army Basics","category":"Board & Basics","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">5</div><div class=\"txt\"><h2>Army Basics</h2><div class=\"why\">Organization, ranks, the flag, and the Army's mission. A 1SG asks these when they want to see if you know the fundamentals.</div></div></div>\n\n  <div class=\"callout c-gold\"><div class=\"ttl\">Army mission <span class=\"tag t-must\">Must know</span></div>\n    \"To deploy, fight, and win our Nation's wars by providing ready, prompt, and sustained land dominance by Army forces across the full spectrum of conflict as part of the joint force.\" <span class=\"tag t-verify\">Verify</span> army.mil/about\n  </div>\n\n  <div class=\"grid2\">\n    <div>\n      <h3>Unit organization <span class=\"tag t-verify\">Verify</span></h3>\n      <table>\n        <tr><th>Unit</th><th>Typical size</th><th>Led by</th></tr>\n        <tr><td>Fire team</td><td>4</td><td>Team Leader (SGT)</td></tr>\n        <tr><td>Squad</td><td>9 (2 fire teams + SL)</td><td>Squad Leader (SSG)</td></tr>\n        <tr><td>Platoon</td><td>3–4 squads, about 30–45</td><td>PL (LT) / PSG (SFC)</td></tr>\n        <tr><td>Company</td><td>3–4 platoons, about 100–200</td><td>CPT / 1SG</td></tr>\n        <tr><td>Battalion</td><td>4–6 companies, about 500–900</td><td>LTC / CSM</td></tr>\n        <tr><td>Brigade (BCT)</td><td>About 4,000–5,000 (SBCT ≈ 4,500)</td><td>COL / CSM</td></tr>\n        <tr><td>Division</td><td>About 10,000–16,000</td><td>MG / CSM</td></tr>\n        <tr><td>Corps</td><td>2–5 divisions</td><td>LTG / CSM</td></tr>\n      </table>\n      <p class=\"small\">In a Stryker company, the vehicle crews (driver and vehicle commander) are part of the platoon too. Know how your own platoon is organized.</p>\n\n      <h3>Army components</h3>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Three components: <b>Regular Army</b> (active), <b>Army National Guard</b>, and <b>U.S. Army Reserve</b>.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Three types of BCT: <b>Infantry (IBCT)</b>, <b>Stryker (SBCT)</b>, and <b>Armored (ABCT)</b>.</div></div>\n    </div>\n    <div>\n      <h3>Enlisted ranks</h3>\n      <table>\n        <tr><th>Grade</th><th>Rank</th><th>Abbr.</th></tr>\n        <tr><td>E-1</td><td>Private (no insignia)</td><td>PV1</td></tr>\n        <tr><td>E-2</td><td>Private</td><td>PV2</td></tr>\n        <tr><td>E-3</td><td>Private First Class</td><td>PFC</td></tr>\n        <tr><td>E-4</td><td>Specialist / Corporal</td><td>SPC / CPL</td></tr>\n        <tr><td>E-5</td><td>Sergeant</td><td>SGT</td></tr>\n        <tr><td>E-6</td><td>Staff Sergeant</td><td>SSG</td></tr>\n        <tr><td>E-7</td><td>Sergeant First Class</td><td>SFC</td></tr>\n        <tr><td>E-8</td><td>Master Sergeant / First Sergeant</td><td>MSG / 1SG</td></tr>\n        <tr><td>E-9</td><td>Sergeant Major / Command Sergeant Major</td><td>SGM / CSM</td></tr>\n        <tr><td>E-9</td><td>Sergeant Major of the Army</td><td>SMA</td></tr>\n      </table>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>The Corporal is an NCO. The Specialist is not.</b> They're the same pay grade (E-4).</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>Officers: 2LT, 1LT, CPT, MAJ, LTC, COL, BG, MG, LTG, GEN. Warrant officers: WO1, CW2–CW5.</div></div>\n    </div>\n  </div>\n\n  <h3>Flag &amp; National Anthem <span class=\"tag t-verify\">Verify</span></h3>\n  <div class=\"grid2\">\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>13 stripes</b> stand for the original 13 colonies. <b>50 stars</b> stand for the states.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>A ceremonial fold makes <b>13 folds</b> into a triangle with only the blue field showing.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Half-staff:</b> raise it to the peak first, then lower it to half-staff. Raise it to the peak again before lowering it at the end of the day.</div></div>\n    </div>\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>National anthem, in uniform outdoors: face the flag (or the music), stand at attention, and <b>salute</b> on the first note until the last note.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>Indoors in uniform: stand at attention facing the flag or music. <b>No salute.</b></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>The Army flag was dedicated on <b>14 June 1956</b>. The Army song, \"The Army Goes Rolling Along,\" was adopted the same year.</div></div>\n    </div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What is the Army's mission?</div><div class=\"a\">To deploy, fight, and win our Nation's wars by providing ready, prompt, and sustained land dominance by Army forces across the full spectrum of conflict as part of the joint force.</div></div>\n    <div class=\"qa\"><div class=\"q\">How many Soldiers are in a fire team? A squad?</div><div class=\"a\">A fire team has 4. A squad has 9: the squad leader and two fire teams.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between a CPL and a SPC?</div><div class=\"a\">Both are E-4. The CPL is an NCO with NCO authority and responsibilities. The SPC is not.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the three Army components?</div><div class=\"a\">Regular Army, Army National Guard, Army Reserve.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does the flag stand for?</div><div class=\"a\">13 stripes for the original colonies. 50 stars for the states.</div></div>\n    <div class=\"qa\"><div class=\"q\">What do you do when the anthem plays outdoors and you're in uniform?</div><div class=\"a\">Face the flag or the music, stand at attention, and salute from the first note to the last.</div></div>\n  </div>\n</div>\n"},{"key":"leadership","num":6,"title":"Leadership & Counseling","category":"Leadership & Policy","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">6</div><div class=\"txt\"><h2>Leadership &amp; Counseling</h2><div class=\"why\">As a team leader, counseling is what you do every day. Expect scenario questions.</div></div></div>\n\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Army leadership</b> is the activity of influencing people by providing purpose, direction, and motivation to accomplish the mission and improve the organization. (ADP 6-22)</div></div>\n\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Attributes (what a leader IS)</h4>\n      <div class=\"mnem\"><span><b>C</b>Character</span><span><b>P</b>Presence</span><span><b>I</b>Intellect</span></div>\n      <span class=\"small\">Character: Army Values, empathy, Warrior Ethos/service ethos, discipline, humility. Presence: military and professional bearing, fitness, confidence, resilience. Intellect: mental agility, sound judgment, innovation, interpersonal tact, expertise. <span class=\"tag t-verify\">Verify</span> ADP 6-22 Ch 2–4</span></div>\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Competencies (what a leader DOES)</h4>\n      <div class=\"mnem\"><span><b>L</b>Leads</span><span><b>D</b>Develops</span><span><b>A</b>Achieves</span></div>\n      <span class=\"small\">Leads: others, builds trust, extends influence, leads by example, communicates. Develops: creates a positive environment, prepares self, develops others, stewards the profession. Achieves: gets results. <span class=\"tag t-verify\">Verify</span> ADP 6-22 Ch 5–7</span></div>\n  </div>\n\n  <h3>Counseling: ATP 6-22.1 (13 Feb 2024)</h3>\n  <div class=\"grid2\">\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Three categories:</b> Performance, Professional Growth, Event. (Ch 2, para 2-4)</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>DA Form 4856</b>, Developmental Counseling Form, documents counseling.</div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Event counseling examples:</b> specific instances (good or bad), reception and integration, crisis, referral, promotion, separation. <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Three approaches:</b> Nondirective, Directive, Combined. <span class=\"tag t-verify\">Verify</span></div></div>\n    </div>\n    <div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Four-stage counseling process:</b> 1) Identify the need for counseling 2) Prepare 3) Conduct the session 4) Follow up. <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Conducting the session:</b> open the session, discuss the issues, develop a plan of action, record and close. <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div><b>Counselor qualities:</b> respect, self-awareness and cultural awareness, credibility, empathy. <span class=\"tag t-verify\">Verify</span></div></div>\n      <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Local:</b> the 4ID <b>Yellow Book</b> (19 Feb 2026) is the local counseling SOP. It supplements Army doctrine and does not replace it.</div></div>\n    </div>\n  </div>\n\n  <h3>Evaluations: AR 623-3 (14 Feb 2025)</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>DA Form 2166-9-1</b> = NCOER for SGT. <b>DA Form 2166-9-1A</b> = NCOER Support Form. Neither one is a counseling form. <b>DA Pam 623-3</b> is the procedural pamphlet.</div></div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Define leadership.</div><div class=\"a\">Influencing people by providing purpose, direction, and motivation to accomplish the mission and improve the organization.</div></div>\n    <div class=\"qa\"><div class=\"q\">Name the three leader attributes and the three competencies.</div><div class=\"a\">Attributes: Character, Presence, Intellect. Competencies: Leads, Develops, Achieves.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the three categories of counseling?</div><div class=\"a\">Performance, professional growth, and event.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form is used for counseling? For a SGT's NCOER?</div><div class=\"a\">DA Form 4856. DA Form 2166-9-1.</div></div>\n    <div class=\"qa\"><div class=\"q\">When should you do an initial counseling?</div><div class=\"a\">When a Soldier first arrives (reception and integration), and within the first 30 days of a rating period. <span class=\"tag t-verify\">Verify</span> AR 623-3</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What are the levels of leadership?</div><div class=\"a\">Direct, organizational, and strategic. A team leader works at the direct level. <span class=\"tag t-verify\">Verify</span> ADP 6-22.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between counseling, coaching and mentoring?</div><div class=\"a\">Counseling: a leader and subordinate review performance and potential. Coaching: guiding someone to improve a specific skill. Mentoring: a voluntary, long-term relationship between someone more experienced and someone less experienced, for development.</div></div>\n    <div class=\"qa\"><div class=\"q\">What should a counseling plan of action include?</div><div class=\"a\">Specific actions, who is responsible, and a deadline, so the Soldier knows exactly what to do to improve.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the NCOER rating chain for a SGT?</div><div class=\"a\">Rater, senior rater, and supplementary reviewer, if one applies. <span class=\"tag t-verify\">Verify</span> AR 623-3.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does it mean to lead by example?</div><div class=\"a\">Meeting every standard you enforce: PT, appearance, timeliness. Soldiers do what they see.</div></div>\n  </div>\n</div>\n"},{"key":"regs","num":7,"title":"Regulations, Programs & UCMJ","category":"Leadership & Policy","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">7</div><div class=\"txt\"><h2>Regulations, Programs &amp; UCMJ</h2><div class=\"why\">Know the number and title. Board members love \"What regulation covers...?\"</div></div></div>\n\n  <table>\n    <tr><th style=\"width:16%\">Reg</th><th style=\"width:40%\">Title</th><th>Remember</th></tr>\n    <tr><td><b>AR 600-20</b></td><td>Army Command Policy (15 Apr 2026)</td><td><span class=\"tag t-must\">Must</span> Ch 6 = Military Equal Opportunity</td></tr>\n    <tr><td><b>AR 600-52</b></td><td>SHARP Program (11 Feb 2025)</td><td><span class=\"tag t-must\">Must</span> The dedicated SHARP regulation</td></tr>\n    <tr><td><b>AR 600-92</b></td><td>Army Suicide Prevention Program (4 Oct 2024)</td><td><span class=\"tag t-must\">Must</span> ACE</td></tr>\n    <tr><td><b>AR 670-1</b> / DA Pam 670-1</td><td>Wear and Appearance of Army Uniforms and Insignia</td><td><span class=\"tag t-must\">Must</span> Ch 3 = grooming</td></tr>\n    <tr><td><b>AR 600-8-19</b></td><td>Enlisted Promotions and Demotions (6 Mar 2026)</td><td><span class=\"tag t-must\">Must</span> Ch 3 = semi-centralized</td></tr>\n    <tr><td><b>AR 600-9</b></td><td>The Army Body Composition Program</td><td>Now modified by AD 2026-13</td></tr>\n    <tr><td><b>AR 623-3</b></td><td>Evaluation Reporting System</td><td>NCOERs</td></tr>\n    <tr><td><b>AR 350-1</b></td><td>Army Training and Leader Development (1 Jun 2025)</td><td></td></tr>\n    <tr><td><b>AR 600-85</b></td><td>The Army Substance Abuse Program (ASAP)</td><td></td></tr>\n    <tr><td><b>AR 600-25</b></td><td>Salutes, Honors, and Courtesy (1 May 2026)</td><td></td></tr>\n    <tr><td><b>AR 600-8-22</b></td><td>Military Awards (11 May 2026)</td><td></td></tr>\n    <tr><td><b>AR 608-1</b></td><td>Soldier and Family Readiness (26 May 2026)</td><td></td></tr>\n    <tr><td><b>AR 930-4</b></td><td>Army Emergency Relief (15 Apr 2026)</td><td>AER</td></tr>\n    <tr><td><b>AR 27-10</b></td><td>Military Justice (8 Jan 2025)</td><td>Article 15 procedures</td></tr>\n    <tr><td><b>AR 600-8-2</b></td><td>Suspension of Favorable Personnel Actions (Flags)</td><td>A flag stops promotion</td></tr>\n    <tr><td><b>AR 635-200</b></td><td>Active Duty Enlisted Administrative Separations (30 Jun 2025)</td><td></td></tr>\n    <tr><td><b>AR 600-32</b></td><td>Conduct Between Soldiers of Different Grades (16 Sep 2024)</td><td>Fraternization and relationships</td></tr>\n    <tr><td><b>AR 385-10</b></td><td>The Army Safety and Occupational Health Program</td><td></td></tr>\n    <tr><td><b>AR 621-5</b></td><td>Army Continuing Education System (19 Mar 2026)</td><td>TA, education center</td></tr>\n  </table>\n\n\n  <h3>How AR numbers work: the series <span class=\"tag t-new\">New</span></h3>\n  <p class=\"small\">The first number tells you the subject area. Knowing the series lets you reason toward the answer even when you don't remember the exact regulation. <span class=\"tag t-verify\">Verify</span></p>\n  <div class=\"grid2\">\n  <table>\n    <tr><th style=\"width:22%\">Series</th><th>Subject</th></tr>\n    <tr><td><b>25</b></td><td>Information management (25-50 correspondence)</td></tr>\n    <tr><td><b>27</b></td><td>Legal (27-10 Military Justice)</td></tr>\n    <tr><td><b>40</b></td><td>Medical (40-501 Standards of Medical Fitness)</td></tr>\n    <tr><td><b>190</b></td><td>Military Police (190-5 traffic, 190-11 arms security)</td></tr>\n    <tr><td><b>215</b></td><td>MWR</td></tr>\n    <tr><td><b>350</b></td><td>Training (350-1)</td></tr>\n    <tr><td><b>380 / 381</b></td><td>Security / intelligence (381-12 threat reporting)</td></tr>\n    <tr><td><b>385</b></td><td>Safety (385-10, 385-63)</td></tr>\n    <tr><td><b>525</b></td><td>Military operations</td></tr>\n    <tr><td><b>530</b></td><td>Operations security (530-1)</td></tr>\n  </table>\n  <table>\n    <tr><th style=\"width:22%\">Series</th><th>Subject</th></tr>\n    <tr><td><b>600</b></td><td>Personnel, general (600-20, 600-52, 600-85, 600-92, 600-9)</td></tr>\n    <tr><td><b>600-8-x</b></td><td>Military HR (600-8-10 leave, 600-8-19 promotions, 600-8-22 awards, 600-8-2 flags)</td></tr>\n    <tr><td><b>601</b></td><td>Personnel procurement (601-280 retention)</td></tr>\n    <tr><td><b>608</b></td><td>Personal affairs (608-1, 608-18 FAP, 608-75 EFMP)</td></tr>\n    <tr><td><b>614</b></td><td>Assignments (614-200 enlisted)</td></tr>\n    <tr><td><b>621</b></td><td>Education (621-5)</td></tr>\n    <tr><td><b>623</b></td><td>Evaluations (623-3)</td></tr>\n    <tr><td><b>635</b></td><td>Separations (635-200 enlisted)</td></tr>\n    <tr><td><b>670</b></td><td>Uniforms (670-1)</td></tr>\n    <tr><td><b>672</b></td><td>Decorations and incentive awards (672-20)</td></tr>\n    <tr><td><b>710 / 735 / 750</b></td><td>Supply / property accountability / maintenance</td></tr>\n  </table>\n  </div>\n\n  <h3>More regulations with key subtopics <span class=\"tag t-new\">New</span></h3>\n  <table>\n    <tr><th style=\"width:17%\">Reg</th><th style=\"width:30%\">Title</th><th>Subtopics worth knowing</th></tr>\n    <tr><td><b>AR 600-8-10</b></td><td>Leaves and Passes</td><td>Soldiers earn <b>2.5 days of leave per month</b> (30 per year). Covers emergency leave, passes and PTDY. <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>AR 600-8-2</b></td><td>Suspension of Favorable Personnel Actions (Flags)</td><td>Flag types: <b>transferable</b> and <b>non-transferable</b>. A flag stops promotions, awards, schools, reenlistment and PCS. Initiated on <b>DA Form 268</b>. <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>AR 635-200</b></td><td>Active Duty Enlisted Administrative Separations</td><td>Discharge characterizations: <b>Honorable, General (under honorable conditions), Other Than Honorable</b>, and uncharacterized (entry-level). <b>Bad Conduct and Dishonorable</b> come only from a court-martial. Well-known chapters: Ch 13 unsatisfactory performance, Ch 14 misconduct, Ch 10 in lieu of trial by court-martial. <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>AR 600-85</b></td><td>Army Substance Abuse Program</td><td>Referral types: self, command, medical, biochemical (urinalysis), investigation. <b>Self-referral</b> is encouraged. <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>AR 600-32</b> (DA Pam 600-35)</td><td>Conduct Between Soldiers of Different Grades</td><td>Covers fraternization and prohibited relationships. Relationships are improper if they compromise the chain of command, create the appearance of partiality, or involve exploitation.</td></tr>\n    <tr><td><b>AR 600-100</b></td><td>Army Profession and Leadership Policy</td><td>Leader development responsibilities.</td></tr>\n    <tr><td><b>AR 600-63</b></td><td>Army Health Promotion</td><td>Not the suicide regulation. That's AR 600-92.</td></tr>\n    <tr><td><b>AR 40-501</b></td><td>Standards of Medical Fitness</td><td>Profiles (DA Form 3349 permanent/temporary profile). <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>AR 190-11</b></td><td>Physical Security of Arms, Ammunition, and Explosives</td><td>Arms rooms and weapon accountability.</td></tr>\n    <tr><td><b>AR 381-12</b></td><td>Threat Awareness and Reporting Program (TARP)</td><td>Report contacts, espionage indicators, insider threats.</td></tr>\n    <tr><td><b>AR 735-5</b></td><td>Property Accountability</td><td>Hand receipts (DA Form 2062). FLIPL (DD Form 200). Five types of responsibility: command, supervisory, direct, custodial, personal. <span class=\"tag t-verify\">Verify</span></td></tr>\n    <tr><td><b>AR 614-200</b></td><td>Enlisted Assignments and Utilization Management</td><td>Assignments, PCS and reclassification.</td></tr>\n    <tr><td><b>AR 601-280</b></td><td>Army Retention Program</td><td>Reenlistment and the career counselor.</td></tr>\n    <tr><td><b>AR 25-50</b></td><td>Preparing and Managing Correspondence</td><td>Memorandum format.</td></tr>\n  </table>\n\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> Programs</h4>\n      <b>BOSS</b>: Better Opportunities for Single Soldiers<br>\n      <b>MWR</b>: Morale, Welfare, and Recreation<br>\n      <b>AER</b>: Army Emergency Relief (AR 930-4). No-interest loans and grants.<br>\n      <b>ASAP</b>: Army Substance Abuse Program (AR 600-85)<br>\n      <b>ACS</b>: Army Community Service<br>\n      <b>EFMP</b>: Exceptional Family Member Program (AR 608-75)<br>\n      <b>FAP</b>: Family Advocacy Program (AR 608-18)</div>\n    <div class=\"card\"><h4><span class=\"tag t-know\">Know</span> UCMJ basics <span class=\"tag t-verify\">Verify</span></h4>\n      <b>Art. 15</b>: Nonjudicial punishment. Types: summarized, company grade, field grade.<br>\n      <b>Art. 31</b>: Rights against self-incrimination.<br>\n      <b>Courts-martial:</b> summary, special, general.<br>\n      <b>Art. 86</b>: AWOL. <b>Art. 91</b>: insubordinate conduct toward a warrant officer or NCO. <b>Art. 92</b>: failure to obey an order or regulation. <b>Art. 134</b>: the General Article.</div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What regulation covers Army Command Policy?</div><div class=\"a\">AR 600-20.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is AER?</div><div class=\"a\">Army Emergency Relief. It provides financial help to Soldiers and their families. AR 930-4.</div></div>\n    <div class=\"qa\"><div class=\"q\">What do BOSS and MWR stand for?</div><div class=\"a\">Better Opportunities for Single Soldiers; Morale, Welfare, and Recreation.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does a flag do?</div><div class=\"a\">It suspends favorable personnel actions such as promotion, awards, and schools. AR 600-8-2.</div></div>\n    <div class=\"qa\"><div class=\"q\">What article of the UCMJ covers nonjudicial punishment?</div><div class=\"a\">Article 15.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What regulation covers leave?</div><div class=\"a\">AR 600-8-10. Soldiers earn 2.5 days per month.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does a flag do to promotions?</div><div class=\"a\">It suspends favorable actions, including promotion. AR 600-8-2.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the types of discharge?</div><div class=\"a\">Administrative: honorable, general, other than honorable. Punitive (court-martial only): bad conduct and dishonorable.</div></div>\n    <div class=\"qa\"><div class=\"q\">Can a Soldier be punished for self-referring to ASAP?</div><div class=\"a\">Self-referral is encouraged and handled differently from command or test-based referrals. <span class=\"tag t-verify\">Verify</span> AR 600-85 limited use policy.</div></div>\n    <div class=\"qa\"><div class=\"q\">What article covers sexual assault?</div><div class=\"a\">Article 120, UCMJ.</div></div>\n  </div>\n</div>\n"},{"key":"sharp","num":8,"title":"SHARP, EO & Suicide Prevention","category":"Leadership & Policy","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">8</div><div class=\"txt\"><h2>SHARP, EO &amp; Suicide Prevention</h2><div class=\"why\">Every board asks at least one. Precision matters: don't mix up SHARP, EO and harassment reporting.</div></div></div>\n\n  <h3>SHARP: AR 600-52 (11 Feb 2025)</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>Ch 2 = sexual harassment. Ch 3 = sexual assault. Ch 9 = retaliation. Para 3-3 = restricted and unrestricted reporting.</div></div>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4>Restricted report</h4>Confidential. <b>No</b> command notification of the victim's identity and <b>no</b> investigation. The victim gets medical care, advocacy, and counseling. Some exceptions apply. Made to a <b>SARC, a SHARP VA, or healthcare personnel</b>. <span class=\"tag t-verify\">Verify</span> the list in para 3-3.</div>\n    <div class=\"card\"><h4>Unrestricted report</h4>Triggers <b>command notification and an investigation</b>. The victim also gets medical care, advocacy, and counseling. It can be made through the chain of command, law enforcement, a SARC, or a VA.</div>\n  </div>\n  <div class=\"callout c-fix\"><div class=\"ttl\">As a leader, never do this</div>Never promise a Soldier confidentiality yourself. You are not a restricted-reporting channel. Connect them to a <b>SARC or SHARP Victim Advocate</b>, who can explain both options and the exceptions.</div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>DA Form 7746</b> = Sexual Harassment Complaint (Jan 2026). <b>DA Form 7279</b> = Equal Opportunity and Harassment Complaint (Jul 2020). These are separate processes from each other and from sexual-assault reporting.</div></div>\n\n  <h3>Equal Opportunity: AR 600-20, Chapter 6</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div>A formal EO complaint uses <b>DA Form 7279</b>. Complaints can be informal or formal. <span class=\"tag t-verify\">Verify</span> the current 2026 chapter text before you quote filing deadlines, protected categories, or timelines.</div></div>\n\n  <h3>Suicide prevention: AR 600-92 (4 Oct 2024)</h3>\n  <div class=\"mnem\"><span><b>A</b>Ask your buddy directly</span><span><b>C</b>Care: listen, take it seriously</span><span><b>E</b>Escort to help. Don't leave them.</span></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>If a Soldier may be at <b>immediate risk</b>, stay with them, call for emergency help (911, or 988 then press 1 for the Military Crisis Line), and escort them to qualified care: Behavioral Health, the ER, or the chaplain.</div></div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What regulation covers SHARP?</div><div class=\"a\">AR 600-52.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the two reporting options for sexual assault?</div><div class=\"a\">Restricted and unrestricted. A SARC or VA explains eligibility and exceptions.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form records a sexual harassment complaint?</div><div class=\"a\">DA Form 7746.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form is used for a formal EO complaint?</div><div class=\"a\">DA Form 7279.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does ACE stand for?</div><div class=\"a\">Ask, Care, Escort.</div></div>\n    <div class=\"qa\"><div class=\"q\">Who is your unit SARC/VA and EOL? <span class=\"tag t-local\">Local</span></div><div class=\"a\">Know the names and where the contact info is posted on the company board.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Who can take a restricted report?</div><div class=\"a\">A SARC, a SHARP VA, or healthcare personnel. <span class=\"tag t-verify\">Verify</span> AR 600-52 para 3-3.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is retaliation?</div><div class=\"a\">Taking or threatening adverse action, ostracism or maltreatment against someone for reporting. It's prohibited. AR 600-52 Ch 9.</div></div>\n    <div class=\"qa\"><div class=\"q\">Who is your SHARP representative?</div><div class=\"a\">Know your SARC and VA by name and where their info is posted. <span class=\"tag t-local\">Local</span></div></div>\n    <div class=\"qa\"><div class=\"q\">What are the warning signs of suicide?</div><div class=\"a\">Talking about death or hopelessness, giving away possessions, withdrawing, increased alcohol use, sudden mood changes, and relationship, legal or financial trouble.</div></div>\n  </div>\n</div>\n"},{"key":"wear","num":9,"title":"Wear & Appearance","category":"Leadership & Policy","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">9</div><div class=\"txt\"><h2>Wear &amp; Appearance</h2><div class=\"why\">You're wearing the subject of these questions. Be ready to be tested on your own uniform.</div></div></div>\n\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>AR 670-1</b>, Wear and Appearance of Army Uniforms and Insignia. <b>DA Pam 670-1</b> is the detailed wear guide. <b>AR 670-1 Chapter 3</b> covers appearance and grooming.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>Facial hair:</b> Army Directives <b>2025-13</b> and <b>2026-09</b>. Male Soldiers are <b>clean-shaven</b> in uniform or on duty unless an approved medical exception or religious accommodation applies. Authorized mustaches are still permitted. An existing approved religious accommodation stays valid during its required review.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>Army Directive 2025-18</b> also updated grooming and appearance. For any specific hairstyle, jewelry, tattoo, or uniform question, check the AR, DA Pam, directive, and 4ID Green Book together.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>4ID Green Book</b> (9 Apr 2026): local tactical uniform standards, <b>Ivy Duty / Ivy Light / Ivy Ready</b>. Ivy Ready requires <b>two tourniquets</b> and an accessible issued IFAK in training and operations.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>AGSU:</b> ribbons centered 1/8 inch above the left breast pocket of the coat, right to left by precedence, no more than 4 per row. No ribbons on the AGSU shirt. No miniature badges. <span class=\"tag t-verify\">Verify</span> DA Pam 670-1.</div></div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What is the regulation for wear and appearance?</div><div class=\"a\">AR 670-1, with wear details in DA Pam 670-1.</div></div>\n    <div class=\"qa\"><div class=\"q\">What chapter of AR 670-1 covers grooming?</div><div class=\"a\">Chapter 3.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the facial hair standard?</div><div class=\"a\">Clean-shaven in uniform or on duty unless an approved medical exception or religious accommodation applies.</div></div>\n    <div class=\"qa\"><div class=\"q\">Where do ribbons go on your AGSU coat?</div><div class=\"a\">Centered 1/8 inch above the left breast pocket, highest precedence on the wearer's right.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the three 4ID tactical uniform configurations?</div><div class=\"a\">Ivy Duty, Ivy Light, Ivy Ready (4ID Green Book).</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">Where is the nameplate worn on your AGSU?</div><div class=\"a\">Know the exact answer from DA Pam 670-1 for your uniform and be ready to show it. <span class=\"tag t-local\">Local</span></div></div>\n    <div class=\"qa\"><div class=\"q\">Can Soldiers wear wireless earbuds in uniform?</div><div class=\"a\">Check the current AR 670-1 and Army Directive updates. Don't answer from memory. <span class=\"tag t-verify\">Verify</span></div></div>\n    <div class=\"qa\"><div class=\"q\">Who is responsible for a Soldier's appearance?</div><div class=\"a\">The Soldier first, then first-line leaders who inspect and correct.</div></div>\n  </div>\n</div>\n"},{"key":"promo","num":10,"title":"Promotions, Awards & ABCP","category":"Leadership & Policy","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">10</div><div class=\"txt\"><h2>Promotions, Awards &amp; ABCP</h2><div class=\"why\">You're at a promotion board. Know the process you're in.</div></div></div>\n\n  <h3>Promotions: AR 600-8-19 (6 Mar 2026)</h3>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div>Chapter 3 covers <b>semi-centralized promotions</b> (SGT and SSG). Para 3-8 covers unit promotion boards. Para 3-12 covers board proceedings.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>SGT eligibility</b> per the HQDA cutoff-score memo (Feb 2026). Primary zone: <b>34 months TIS / 10 months TIG</b>. Secondary zone: <b>18 months TIS / 6 months TIG</b>. The 2026 revision removed waivers for secondary-zone requirements. <span class=\"tag t-verify\">Verify</span> AR 600-8-19 Table 3-1.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>BLC</b> is not required to appear before a SGT board. It is required to appear before an SSG board. The March 2026 update changed how BLC/ALC promotion points are awarded. <span class=\"tag t-verify\">Verify</span></div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-bonus\">Bonus</span></div><div>Promotion points fall into categories: military training (weapons qualification, fitness), awards and decorations, military education, and civilian education. Check your points in IPPS-A. <span class=\"tag t-verify\">Verify</span> category maximums.</div></div>\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-know\">Know</span></div><div><b>AR 600-8-22</b>, Military Awards (11 May 2026). Don't quote approval authorities from 2025 guidance.</div></div>\n\n  <h3>Army Body Composition Program: Army Directive 2026-13</h3>\n  <div class=\"callout c-gold\"><div class=\"ttl\">The 2026 rule: waist-to-height only</div>\n    <b>Waist circumference (at the navel) ÷ height (inches)</b>. Truncate after 3 decimals. Don't round.<br>\n    <b>Less than 0.550 = PASS.</b> &nbsp; <b>0.550 or more = FAIL.</b><br>\n    A second, different team confirms an initial failure the same duty day. Record it on <b>DA Form 5500</b>. DA Form 5501 is no longer used. <b>A high AFT score does not exempt you.</b>\n  </div>\n  <table style=\"width:60%\">\n    <tr><th>Example</th><th>Math</th><th>Result</th></tr>\n    <tr><td>34.5 in waist, 70 in tall</td><td>34.5 ÷ 70 = 0.4928…→ 0.492</td><td>PASS</td></tr>\n    <tr><td>38.5 in waist, 70 in tall</td><td>38.5 ÷ 70 = 0.5500 → 0.550</td><td>FAIL</td></tr>\n  </table>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">What regulation covers enlisted promotions?</div><div class=\"a\">AR 600-8-19, Enlisted Promotions and Demotions.</div></div>\n    <div class=\"qa\"><div class=\"q\">What is the ABCP pass standard?</div><div class=\"a\">Waist divided by height must be less than 0.550. 0.550 fails. (AD 2026-13)</div></div>\n    <div class=\"qa\"><div class=\"q\">Does a high AFT score exempt a Soldier from ABCP?</div><div class=\"a\">No.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form records the body composition assessment?</div><div class=\"a\">DA Form 5500.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What's the difference between the primary and secondary zone?</div><div class=\"a\">The primary zone has longer TIS and TIG requirements. The secondary zone lets top performers be recommended earlier, at the commander's discretion.</div></div>\n    <div class=\"qa\"><div class=\"q\">What system tracks promotion points now?</div><div class=\"a\">IPPS-A, the Integrated Personnel and Pay System–Army. <span class=\"tag t-verify\">Verify</span></div></div>\n    <div class=\"qa\"><div class=\"q\">What is the highest award for valor?</div><div class=\"a\">The Medal of Honor.</div></div>\n    <div class=\"qa\"><div class=\"q\">What form is a recommendation for award?</div><div class=\"a\">DA Form 638. <span class=\"tag t-verify\">Verify</span></div></div>\n  </div>\n</div>\n"},{"key":"h2f","num":11,"title":"H2F, AFT & CFT","category":"Fitness & Training","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">11</div><div class=\"txt\"><h2>H2F, AFT &amp; CFT</h2><div class=\"why\">2026 is a transition year. Answer the annual framework and the transition rule together.</div></div></div>\n\n  <div class=\"fact\"><div class=\"lvl\"><span class=\"tag t-must\">Must know</span></div><div><b>FM 7-22</b>, Holistic Health and Fitness (1 Oct 2020, incl. C2). <b>Five domains:</b> Physical, Nutritional, Mental, Spiritual, Sleep Readiness.</div></div>\n  <div class=\"mnem\"><span><b>P</b>Physical</span><span><b>N</b>Nutritional</span><span><b>M</b>Mental</span><span><b>S</b>Spiritual</span><span><b>S</b>Sleep</span></div>\n\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> AFT: 5 events</h4>\n      <ol>\n        <li>3-Repetition Maximum <b>Deadlift</b> (MDL)</li>\n        <li><b>Hand-Release Push-Up</b> (HRP)</li>\n        <li><b>Sprint-Drag-Carry</b> (SDC)</li>\n        <li><b>Plank</b> (PLK)</li>\n        <li><b>Two-Mile Run</b> (2MR)</li>\n      </ol>\n      Replaced the ACFT on 1 Jun 2025. <b>Combat standard (11B): 350 total, minimum 60 per event, sex-neutral.</b> Enforced for the Regular Army since 1 Jan 2026. <span class=\"tag t-verify\">Verify</span> ATP 7-22.01.</div>\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> CFT: 7 continuous events</h4>\n      <ol>\n        <li>1-mile run</li>\n        <li>30 dead-stop push-ups</li>\n        <li>100-meter sprint</li>\n        <li>16 × 40-lb sandbag lifts to 65 inches</li>\n        <li>Two 40-lb water cans, 50 meters</li>\n        <li>25 m high crawl + 25 m rush</li>\n        <li>1-mile run</li>\n      </ol>\n      <b>Pass/fail on total time. The Army FAQ says 30 minutes or less.</b> <span class=\"tag t-verify\">Verify</span> uniform and event details in the directive.</div>\n  </div>\n\n  <div class=\"callout c-gold\"><div class=\"ttl\">Army Directive 2026-07 (17 Apr 2026): applies to 11B</div>\n    Annual framework for active-duty combat specialties: <b>one CFT and one AFT per year, at least four months apart.</b><br>\n    <b>Year one is an implementation period:</b> no adverse administrative action solely for a CFT failure. Full implementation is 365 days after the directive.<br>\n    So in November 2026, a CFT failure <b>alone</b> does not trigger adverse action.\n  </div>\n\n  <h3>PRT drills: ATP 7-22.02 (1 Oct 2020, incl. C1)</h3>\n  <div class=\"grid2\">\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Preparation Drill (Ch 3, para 3-1)</h4>\n      <ol><li>Bend and Reach</li><li>Rear Lunge</li><li>High Jumper</li><li>Rower</li><li>Squat Bender</li><li>Windmill</li><li>Forward Lunge</li><li>Prone Row</li><li>Bent-Leg Body Twist</li><li>Push-Up</li></ol></div>\n    <div class=\"card\"><h4><span class=\"tag t-must\">Must know</span> Recovery Drill (Ch 16)</h4>\n      <ol><li>Overhead Arm Pull</li><li>Rear Lunge</li><li>Extend and Flex</li><li>Thigh Stretch</li><li>Single-Leg Over</li><li><b>Groin Stretch</b> <span class=\"tag t-fixed\">Fixed</span></li><li><b>Calf Stretch</b> <span class=\"tag t-fixed\">Fixed</span></li><li>Hamstring Stretch</li></ol></div>\n  </div>\n\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Board answers</div>\n    <div class=\"qa\"><div class=\"q\">Name the five H2F domains.</div><div class=\"a\">Physical, nutritional, mental, spiritual, and sleep readiness.</div></div>\n    <div class=\"qa\"><div class=\"q\">Name the five AFT events.</div><div class=\"a\">Deadlift, hand-release push-up, sprint-drag-carry, plank, two-mile run.</div></div>\n    <div class=\"qa\"><div class=\"q\">What's the AFT combat standard?</div><div class=\"a\">350 total points with at least 60 on each event.</div></div>\n    <div class=\"qa\"><div class=\"q\">Does a CFT failure in November 2026 trigger adverse action?</div><div class=\"a\">Not on its own. AD 2026-07 gives a one-year implementation period from 17 Apr 2026.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the last three exercises of the Recovery Drill?</div><div class=\"a\">Groin Stretch, Calf Stretch, Hamstring Stretch.</div></div>\n  </div>\n  <div class=\"qa-wrap\"><div class=\"qa-title\">Follow-ups the 1SGs ask <span class=\"tag t-new\">New</span></div>\n    <div class=\"qa\"><div class=\"q\">What does H2F stand for?</div><div class=\"a\">Holistic Health and Fitness.</div></div>\n    <div class=\"qa\"><div class=\"q\">What are the first three Preparation Drill exercises?</div><div class=\"a\">Bend and Reach, Rear Lunge, High Jumper.</div></div>\n    <div class=\"qa\"><div class=\"q\">What does the AFT minimum per event mean for you?</div><div class=\"a\">As 11B, I need at least 60 on each event and 350 total under the combat standard.</div></div>\n    <div class=\"qa\"><div class=\"q\">Who is on the H2F performance team?</div><div class=\"a\">Strength coaches, athletic trainers, physical therapists, dietitians, and cognitive performance specialists. <span class=\"tag t-verify\">Verify</span></div></div>\n  </div>\n</div>\n"},{"key":"benefits","num":12,"title":"Benefits & Resilience","category":"Leadership & Policy","html":"<div class=\"section\">\n  <div class=\"sec-head\"><div class=\"num\">12</div><div class=\"txt\"><h2>Benefits &amp; Resilience</h2><div class=\"why\">A team leader sends Soldiers to the right resource. Boards check that you know what's available.</div></div></div>\n\n  <div class=\"callout c-verify\"><div class=\"ttl\">Dollar amounts change</div>Education caps, TSP matching and insurance amounts change by fiscal year and policy. The structure below is stable, but confirm dollar figure
